- id: gates-green-t-wsl-path
  kind: task
  title: Ship a documented, scriptable WSL2 path so Windows users get a working resident service now
  status: planned
  parent: gates-green-e4
  summary: The resident memory service opens an AF_UNIX socket at `workspace-tooling/artifact_memory_service.py:1677`;
    a native Windows transport is an L-effort three-backend port that belongs in M5 (`native-everywhere`),
    and CPython gh-77589 will not rescue it (it targets 3.16 and omits asyncio). WSL2 is the M-effort
    interim that delivers most of the value immediately, and it is the path this repo is already being
    developed against. Ship a setup script, a smoke script that proves a query round-trips, and documentation
    of the Windows-host/WSL-guest boundary (where the repo lives, how paths cross, where derived state
    goes). The CI job that runs the smoke script lands in M3; this task ships the scripts and docs it
    will call.
  priority: must
  lane: next
  size: M
  acceptance:
  - Given a Windows host with WSL2 and a supported distro, when `docs/platforms/windows-wsl.md` is followed
    verbatim from a bare clone, then the documented setup completes with no undocumented manual step.
  - Given the setup has completed, when the committed smoke script is run, then it starts the resident
    service inside WSL, issues one memory query, asserts a non-empty structured result, shuts the service
    down and exits 0 — printing the socket path and the derived-state root it used.
  - Given the smoke script is run where WSL2 is absent, then it exits non-zero within 2 seconds naming
    WSL2 as the missing prerequisite.
  - Given the document, when it is read, then it states explicitly where the repository must live (Windows
    filesystem vs WSL filesystem), the performance and file-locking consequence of that choice, and that
    this is an interim pending the M5 native transport.
  depends_on:
  - gates-green-t-supported-platforms
  tags:
  - X026
  - wsl
  - windows
  - transport-interim
  - portability
