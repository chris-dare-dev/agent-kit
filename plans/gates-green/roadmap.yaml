  - ownership
  - substrate
- id: gates-green-t-outcome-log-lock
  kind: task
  title: Stop pipeline-outcome-log.py silently dropping 15-18% of records on Windows
  status: planned
  parent: gates-green-e4
  summary: '`data/scripts/pipeline-outcome-log.py:295-326` implements atomic append as `os.open(O_WRONLY|O_APPEND|O_CREAT)`
    plus a single `os.write()` under a documented POSIX PIPE_BUF guarantee, with an `fcntl.flock` fallback
    only for lines >= 4096 bytes. Windows gives no O_APPEND atomicity guarantee and has no fcntl, and
    the emit path swallows every exception and returns 0 by design (:349-358), so loss is silent. Measured
    on Windows 11: `AssertionError: 817 != 1000` (threads) and `371 != 400` (multiprocess). This is goal
    F''s foundational capture layer — every downstream metric (sealed-eval''s n_baseline/n_post, trajectory
    confidence tags) is computed from this file, and on Windows the corpus is biased toward runs that
    happened not to collide.'
  priority: must
  lane: next
  size: M
  acceptance:
  - Given `_append_line` takes the shim's exclusive lock on Windows and keeps the O_APPEND fast path on
    POSIX, when `python data/scripts/pipeline-outcome-log-test.py` is run on Windows 11, then the threaded
    case asserts 1000 == 1000 and the multiprocess case asserts 400 == 400, with 0 failures across all
    17 tests.
  - Given `TestConcurrency` is parametrised by `sys.platform`, when the suite runs on Linux and on Windows,
    then both the POSIX and the Windows branch of `_append_line` are exercised and asserted.
  - Given a monotonic per-emit `seq` field is added to the record, when `python data/scripts/pipeline-outcome-log.py
    verify --log <path>` is run against a log with a deliberately deleted line, then it exits non-zero
    reporting the missing sequence number.
  - Given `data/references/pipeline-outcome-log-schema.md:204-214`, when it is read, then the 'Proven
    by TestConcurrency' claim states the POSIX precondition and names the Windows locking path.
  depends_on:
  - gates-green-t-platform-compat
  - gates-green-t-fcntl-datascripts
  tags:
  - F076
  - outcome-log
  - concurrency
  - goal-f
  - evals
