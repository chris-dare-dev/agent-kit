items:
- id: gates-green-e1
  kind: epic
  title: Turn the four generator gates green, make them platform-independent, and make them assert that
    what they emit exists
  status: planned
  summary: 'README.md:106-112 declares four generator gates that "all must be clean before committing
    data/ changes"; on the repo''s only commit two of them exit 2. The causes are mechanical and platform-shaped:
    `catalog-generate.py` serialises OS-native path separators into `provenance`, and `generate-root-contract.py`
    does all nine of its reads and writes with bare `read_text()`/`write_text()` so a Windows run mis-decodes
    UTF-8 (inflating the router body from 5109 B to a phantom 5159 B, past its own 5120 B budget) and,
    worse, rewrites AGENTS.md and CONTEXT.md as cp1252 + CRLF. Beyond being red, the generators emit things
    that do not resolve: the router routes to 8 agents and 5 commands absent from the tree, the coverage
    map''s `escalation_extract` names a missing file, the MCP tool descriptions advertise four removed
    skills/agents that the golden fixture then freezes in, and `--apply` writes 26 files two directories
    above the clone and deletes .toml files there. Outcome: all four `--check` gates exit 0 on all three
    OSes, regenerating anywhere yields a byte-identical tree, and a build-time assertion makes it impossible
    to emit a route to something that does not exist.'
  priority: must
  lane: now
  size: L
  acceptance:
  - Given a clean clone on ubuntu-latest, macos-latest and windows-latest, when `python data/scripts/catalog-generate.py
    --check && python data/scripts/generate-adapter-packs.py --check && python data/scripts/generate-root-contract.py
    --check && python data/scripts/model-policy-apply.py --check` is run, then every command exits 0 on
    every OS.
  - Given the same commit checked out on Windows and on Linux, when every generator is run in write mode
    (no `--check`), then `git status --porcelain` is empty on both and `git diff` between the two produced
    trees is empty.
  - Given a route added to `data/references/agents-md-coverage-map.md` that names an agent, command, reference
    or MCP tool absent from the tree, when `python data/scripts/generate-root-contract.py --check` is
    run, then it exits non-zero naming the unresolved identifier and the file it was declared in.
  tags:
  - F119
  - F151
  - F031
  - F163
  - F181
  - F032
  - F162
  - F182
  - F096
  - F110
  - F109
  - generators
  - gates
  - determinism
  - packs
- id: gates-green-t-utf8-io
  kind: task
  title: Give every data/scripts text I/O explicit encoding='utf-8' and newline='\n'
  status: planned
  parent: gates-green-e1
  summary: '`grep -rn ''read_text()\|write_text('' data/scripts/*.py | grep -v encoding` returns 189 call
    sites that use the platform locale encoding. On Windows (cp1252) this is not merely a false gate failure
    — it is destructive: running the exact command README.md:106-112 prescribes rewrites data/claude-md/AGENTS.md
    and CONTEXT.md with replacement characters for every em dash and converts all LF to CRLF. It is also
    the true root cause of the `BUDGET: AGENTS.md router body 5159 B > 5120 B` failure: with UTF-8 reads
    the same render measures 5109 B and both drift comparisons pass. This lands first because every other
    regeneration task in this epic is unsafe until it does.'
  priority: must
  lane: now
  size: M
  acceptance:
  - Given HEAD on Windows, when `grep -rn 'read_text()\|write_text(' data/scripts/*.py | grep -v encoding`
    is run after the change, then it returns zero lines.
  - 'Given generate-root-contract.py:76, :82, :213, :215, :267, :287, :288, :292, :293 are all updated,
    when `python data/scripts/generate-root-contract.py --check` is run on Windows with the default (non-UTF-8)
    locale and no PYTHONUTF8 set, then it prints `OK: AGENTS.md router 5109 B (<= 5120)` and reports no
    DRIFT, exiting 0.'
  - Given the byte budget check at generate-root-contract.py:208, when the body length is computed, then
    it is computed as `len(body.encode('utf-8'))` explicitly rather than from whatever the platform decoded,
    and `generate-root-contract.py --self-test` (which asserts `BYTE_BUDGET == 5120` at :405) still passes.
  - Given a fresh Windows clone, when `python data/scripts/generate-root-contract.py` is run in write
    mode, then `git diff --stat data/claude-md/` reports no changes (today it reports 16 insertions /
    16 deletions of mojibake).
  - Given the change, when `python -c "import ast,pathlib,sys; sys.exit(0)"`-style lint is replaced by
    a committed check script, then a re-introduced bare `read_text()`/`write_text()` in data/scripts/*.py
    fails that check with a non-zero exit.
  tags:
  - F032
  - F162
  - F182
  - encoding
  - portability
  - generators
- id: gates-green-t-posix-provenance
  kind: task
  title: Emit POSIX separators in catalog provenance so catalog-generate.py --check can pass on Windows
  status: planned
  parent: gates-green-e1
  summary: 'data/scripts/catalog-generate.py builds each entry''s `provenance` with `str(p.relative_to(ROOT))`
    at :266 (skills), :274 (agents) and :282 (commands), assigned at :237. On Windows a fresh render yields
    `data\\agents\\context-curator.md` against the committed `data/agents/context-curator.md`, so `--check`
    reports ''data/facts/catalog.json is stale''. A diff of all JSON leaves after applying the script''s
    own `_strip_freshness` shows exactly 52 differing values and every one is a separator flip or the
    excluded `freshness` field — zero content differs. The remediation the error message suggests is worse
    than the failure: a Windows contributor who regenerates commits 26 backslash provenance strings that
    then red the gate for every Linux and macOS teammate.'
  priority: must
  lane: now
  size: S
  acceptance:
  - Given catalog-generate.py:266, :274 and :282 use `p.relative_to(ROOT).as_posix()`, when `python data/scripts/catalog-generate.py
    --check` is run on Windows against the committed data/facts/catalog.json, then it exits 0.
  - Given a committed catalog whose any entry's `provenance` contains a backslash, when `catalog-generate.py
    --check` is run on any OS, then it exits non-zero with a message naming the offending entry id.
  - Given `python data/scripts/catalog-generate.py --self-test` is run, then it includes and passes an
    assertion that no generated entry's provenance contains a backslash.
  - Given a determinism test that renders the catalog twice with `os.sep` monkeypatched to '\\', when
    it runs, then it asserts byte equality of the two renders.
  - Given `grep -rn 'str(.*relative_to' data/scripts/*.py` is run after the change, then any remaining
    hit is in console output only and is documented as such in a code comment (generate-root-contract.py:284-285).
  tags:
  - F031
  - F163
  - F181
  - catalog
  - portability
  - determinism
- id: gates-green-t-gitattributes
  kind: task
  title: Add a root .gitattributes so byte-sensitive gates cannot be reddened by a checkout
  status: planned
  parent: gates-green-e1
  summary: 'The repo has no `.gitattributes` while its correctness machinery is byte- and digest-sensitive
    in at least four places: the 5120-byte router budget in generate-root-contract.py:49, `tests/fixtures/adapter-packs.golden.json`,
    `tests/fixtures/tools-list.golden.json`, and the sha256 seal over `data/scripts/sealed-eval-v0-corpus.jsonl`.
    A Windows contributor with the default `core.autocrlf=true` gets a checkout that is structurally unable
    to pass them. This is a prerequisite for the sealed-eval re-seal in gates-green-e3 (a CRLF-normalised
    .jsonl produces a false MISMATCH).'
  priority: must
  lane: now
  size: S
  acceptance:
  - Given a root `.gitattributes` containing `* text=auto eol=lf` plus explicit `*.md text eol=lf`, `*.json
    text eol=lf`, `*.ts text eol=lf`, `*.py text eol=lf`, `*.sh text eol=lf`, `*.mjs text eol=lf`, `*.jsonl
    -text` and `*.gz binary`, when a Windows machine runs `git -c core.autocrlf=true clone` of the repo
    into a fresh directory, then `grep -rc $'\r' data/claude-md/AGENTS.md data/scripts/sealed-eval-v0-corpus.jsonl
    tests/fixtures/*.json` reports 0 for every file.
  - Given that same autocrlf=true clone, when `python data/scripts/generate-root-contract.py --check`
    and `bash data/scripts/sealed-eval-test.sh` are run, then both exit 0.
  - 'Given the file is committed, when `git check-attr text eol -- data/scripts/sealed-eval-v0-corpus.jsonl`
    is run, then it reports `text: unset`.'
  tags:
  - F119
  - F162
  - gitattributes
  - line-endings
  - portability
- id: gates-green-t-router-content
  kind: task
  title: Remove the eight phantom agents and five phantom commands from the generated root contract, and
    re-measure its byte budget
  status: planned
  parent: gates-green-e1
  summary: '`data/claude-md/AGENTS.md` is the generated, provider-neutral router every provider loads.
    Its inventory header at :14-16 is accurate (''Agents (20)'', ''Skills (1)'') but its normative body
    at :24-52 is internal-platform residue: it tells agents to ''dispatch one `cluster-health` agent per
    cluster'' (:25), names gitlab-workflow, release-manager, tenant-onboarding, helm-apps, ci-pipelines,
    service-mesh and security in coordination rules (:31, :34-36), points escalation at `cluster-health`
    (:40), calls `get_app_context({app})` (:18, :44, :51) which is not among the 17 tools, and links `get_reference("escalation-matrix")`
    against a missing file. None of the eight agents exists in data/agents/ (which holds 20 milestone/roadmap/spike
    agents). AGENTS.md is generated — the edit is to `data/references/agents-md-coverage-map.md` (the
    `dispatch.*`, `coord.*`, `webapps.*` and `escalation_extract` statements), then regenerate. Note the
    byte budget is measured *after* this trim and after the UTF-8 fix: at HEAD with UTF-8 reads the body
    is already 5109 B (under 5120), so trim further only if the re-measured number still exceeds the budget
    — and do not raise BYTE_BUDGET, which generate-root-contract.py:405 self-tests as exactly 5120.'
  priority: must
  lane: now
  size: M
  acceptance:
  - Given the regenerated data/claude-md/AGENTS.md, when `grep -nE 'cluster-health|gitlab-workflow|release-manager|tenant-onboarding|helm-apps|ci-pipelines|service-mesh|get_app_context|escalation-matrix'
    data/claude-md/AGENTS.md data/claude-md/CONTEXT.md` is run, then it returns zero lines.
  - Given every agent name appearing in the regenerated router, when each is checked against `ls data/agents/`,
    then all resolve; the same holds for every command name against `ls data/commands/` and every reference
    name against `ls data/references/`.
  - Given the coverage map's `escalation_extract` field (agents-md-coverage-map.md:72), when the generator
    runs, then the file it names exists in the tree (or the field is removed).
  - Given the trimmed coverage map, when `python data/scripts/generate-root-contract.py --check` is run
    on Linux, macOS and Windows, then all three print the same `AGENTS.md router body = N B` value, N
    <= 5120, and exit 0.
  - Given `python data/scripts/generate-root-contract.py --self-test` is run, then it passes with `BYTE_BUDGET
    == 5120` unchanged.
  depends_on:
  - gates-green-t-utf8-io
  tags:
  - F096
  - F151
  - router
  - agents-md
  - content
  - packs
- id: gates-green-t-referential-integrity
  kind: task
  title: Add a referential-integrity assertion to the generators so an unresolvable route fails the build
  status: planned
  parent: gates-green-e1
  summary: Removing the phantom routes once is not a fix — the generator has no assertion preventing them
    coming back, and the same class of defect exists on the server surface (src/index.ts tool descriptions)
    and in the coverage map's own `escalation_extract` target. Add one check, invoked from `generate-root-contract.py
    --check` and from a TypeScript test, that resolves every identifier a generated artifact names against
    the discovered content sets. This is what makes gates-green-t-router-content permanent.
  priority: must
  lane: now
  size: M
  acceptance:
  - Given a new `check_referential_integrity()` in data/scripts/generate-root-contract.py that resolves
    every agent, command, reference and MCP tool name appearing in the rendered router and CONTEXT.md
    against `data/agents/`, `data/commands/`, `data/references/` and the tool-name list in `tests/fixtures/tools-list.golden.json`,
    when a deliberately broken route (e.g. `get_agent("does-not-exist")`) is added to the coverage map,
    then `generate-root-contract.py --check` exits non-zero naming the identifier, the coverage-map statement
    id, and the set it failed to resolve against.
  - 'Given the coverage map''s `escalation_extract` names a path that does not exist, when `--check` runs,
    then it fails with ''declared extract target missing: <path>''.'
  - Given `src/mcp-contract.test.ts`, when a test asserts every quoted identifier inside every tool description
    resolves against the discovered skill/agent/reference sets, then reverting gates-green-t-tool-example-names
    makes that test fail.
  - Given the clean tree, when `python data/scripts/generate-root-contract.py --check` and `npm test`
    are run, then both exit 0.
  depends_on:
  - gates-green-t-router-content
  tags:
  - F096
  - F110
  - referential-integrity
  - gates
  - packs
