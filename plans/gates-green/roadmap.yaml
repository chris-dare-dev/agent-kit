- id: gates-green-e2
  kind: epic
  title: Run every test file that exists — and delete the ones that assert nothing
  status: planned
  summary: '`package.json:13` names exactly three test files while `find src tests -name ''*.test.ts''`
    returns eight: canonicalize, token-logger, aidefence, guard and artifact-memory never run, i.e. 1,150
    lines and 52 tests, 73% of the TypeScript test code. Two of the orphans are the security suites, and
    `src/security/aidefence.test.ts:2` and `src/security/guard.test.ts:4` both claim they run ''via `npm
    test`'' against a glob that does not exist. `tsconfig.json:17` excludes `src/**/*.test.ts` so no test
    file is even type-checked. Seven gate scripts (`sealed-eval-test.sh`, `pipeline-outcome-log-test.py`,
    `milestone-pipeline-consolidate-memory-test.sh`, `skill-ref-check.py`, `artifact-memory-eval-manifest-check.py`,
    `tests/check-skill-prompts.sh`, `tests/hooks/block-plaintext-secret-write.test.sh`) are referenced
    by no runner. And two suites are green-by-absence: `test_f10_mirror.py` skips unless a former employer''s
    directory layout exists, and the hook suite `exit 0`s when jq is missing. Meanwhile `data/scripts/`
    holds 33,891 lines of executable code — including a single 13,244-line file — verified only by its
    own `--self-test`. Outcome: one command runs everything that exists, nothing reports success without
    asserting, and data/scripts gains a real external test root.'
  priority: should
  lane: now
  size: L
  acceptance:
  - Given a clean clone on each OS, when `npm test` is run, then all 8 files matching `src/**/*.test.ts`
    are loaded and 0 tests fail; a tripwire test asserts loaded-file count == glob count.
  - Given `grep -rn 'exit 0' tests/hooks/block-plaintext-secret-write.test.sh` and the substrate suite's
    skip reasons, when the suite runs, then no test path reports success without executing an assertion,
    and every skip carries a machine-readable reason string.
  - Given `PYTHONPATH=$PWD/data/scripts python -m unittest discover -s data/scripts/tests -p 'test_*.py'
