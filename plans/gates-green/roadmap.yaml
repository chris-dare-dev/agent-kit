- id: gates-green-t-geteuid
  kind: task
  title: Replace the fifteen os.geteuid() call sites with the shim's current_uid()
  status: planned
  parent: gates-green-e4
  summary: '`os.geteuid` does not exist on Windows and is called at `artifact_security.py:45, :47, :73,
    :157, :362, :364`, `artifact_runtime.py:128, :130`, `artifact_event_consumer.py:938, :968, :1048,
    :2478`, `artifact_memory_service.py:1626, :1719` and `artifact_retrieval.py:233` — 44 of the 163 Windows
    errors are `AttributeError: module ''os'' has no attribute ''geteuid''`. Each site is an ownership
    check comparing `st_uid` against the current user; on Windows `st_uid` is not meaningful, so the sites
    must branch on `supports_posix_privacy()` and either apply a Windows-appropriate check or record an
    explicit, logged degradation — never silently pass. Note: the full Windows ACL privacy backend is
    out of scope here (that is F003, a later milestone); this task only makes the modules importable and
    the checks honest.'
  priority: must
  lane: next
  size: M
  acceptance:
  - Given the change, when `grep -rn 'os.geteuid()' workspace-tooling/*.py data/scripts/*.py` is run,
    then it returns zero lines outside platform_compat.py.
  - 'Given Windows, when the substrate suite is run, then zero errors of the form `AttributeError: module
    ''os'' has no attribute ''geteuid''` appear (today 44).'
  - Given a POSIX host, when the ownership checks in artifact_security.py and artifact_runtime.py are
    exercised against a file owned by another uid, then they still fail closed exactly as at HEAD (a regression
    test asserts the raised message).
  - Given Windows, when an ownership check runs where no equivalent enforcement exists, then it emits
    a single structured warning naming the check and the reason it is degraded, and the degradation is
    asserted by a test rather than being silent.
  depends_on:
  - gates-green-t-platform-compat
  tags:
  - F002
