schema: roadmap/1
slug: gates-green
project: agent-kit
title: M2 Gates Green — the repo passes its own four mandatory gates and actually runs its own tests,
  everywhere
status: draft
phase: sequenced
brief: 'agent-kit declares four mandatory generator gates in README.md:106-112 and two of them are red
  on the repo''s only commit; `npm test` names 3 of the 8 TypeScript suites that exist; the committed
  sealed-eval corpus fails its own manifest; `data/schemas/` does not exist so two shipped gate scripts
  cannot execute; and 333 of ~593 Python substrate tests never collect off macOS.

  M2 makes the repo pass its own checks on macOS, Linux and Windows before M3 automates them. Order inside
  the milestone is forced by the evidence: the UTF-8/newline and POSIX-separator fixes must land before
  anything is regenerated on Windows (regenerating today mojibakes AGENTS.md and flips 26 catalog provenance
  strings to backslashes), and the `platform_compat` shim must land before M3''s matrix so the Python
  leg arrives green rather than red for a reason no CI config can fix.

  Everything here is independently valuable without CI: a contributor on any OS can run four `--check`
  commands, one test command and one gate runner and get a truthful answer. Nothing publishes, nothing
  renames, nothing new is authored.'
goal:
  hmw: How might we make the repo's own declared gates and test suites run truthfully on every supported
    OS — so that green means green, red means a real defect, and skipped means a declared, budgeted reason?
  objective: Every quality signal the repository already claims to have — four generator gates, eight
    TypeScript suites, the Python substrate suite, 25 `--self-test` entrypoints and four shell harnesses
    — executes on macOS, Linux and Windows and reports an honest result, with no skip-to-green test, no
    committed artifact that fails its own seal, and no generated output that references something absent
    from the tree.
  key_results:
  - From a clean clone on each of macOS, Linux and Windows, all four gates — `catalog-generate.py --check`,
    `generate-adapter-packs.py --check`, `generate-root-contract.py --check`, `model-policy-apply.py --check`
    — exit 0 (today 2 of 4 exit 2).
  - Running each generator without `--check` on Windows and on Linux from the same commit produces a byte-identical
    working tree (`git status --porcelain` empty on both); today the Windows run rewrites AGENTS.md/CONTEXT.md
    with mojibake + CRLF and flips 26 catalog provenance strings.
  - '`npm test` executes all 8 files matching `src/**/*.test.ts` (today 3), with 0 failures on all three
    OSes; a tripwire test asserts the loaded-file count equals the glob count.'
  - '`python -m unittest discover -s workspace-tooling/tests -p ''test_*.py'' -t workspace-tooling/tests`
    collects the full ~593 tests with 0 import errors on Windows, Linux and macOS (today: 260 collected,
    14 modules fail at import, 169 red on Windows).'
  - '`bash data/scripts/sealed-eval-test.sh` exits 0 including case T3 `clean-match` (today it fails T3:
    sealed=3dac0bb… vs actual=310723cb…).'
  - One committed runner reports a pass/skip/quarantined verdict for all 25 `data/scripts/*.py --self-test`
    entrypoints and the 4 shell harnesses, exits non-zero on any unexpected failure, and its committed
    expected-status file lists 0 unexplained failures (today 12 fail and nothing invokes them).
  - '`python data/scripts/pipeline-outcome-log-test.py` reports 0 failures on Windows and on POSIX, asserting
    1000/1000 threaded and 400/400 multiprocess records (today 817/1000 and 371/400 on Windows).'
  - A documented, scripted WSL2 path exists and its smoke script round-trips one memory query end-to-end
    on a Windows host.
  wont:
  - No `.github/` workflows, no CI matrix, no coverage ratchet — M2 makes the commands green and committed;
    M3 automates them (`ci-proves-it`).
  - No eslint/prettier/ruff/mypy configuration and no tsconfig strictness ratchet beyond adding a `typecheck`
    script that includes test files — static analysis config is M3.
  - No native Windows named-pipe or loopback transport for the resident memory service — WSL2 is the supported
    Windows path in M2; the transport port is M5 (`native-everywhere`).
  - No npm/PyPI packaging, `bin`, `files`, `exports`, pyproject or release automation — blocked on the
    M1 naming decision and delivered in M4 (`named-and-installable`).
  - No new skills, no golden task set, no ROI statistic — the corpus is n=1 and that work is sequenced
    into M6 (`author-and-measure`).
  - No provider capability manifests or conformance suite; M2 only stops `generate-adapter-packs.py` writing
    outside the clone (M7 owns the data-driven redesign).
  - No rewrite of the AGENTS.md router's *semantics* into a provider-neutral contract — M2 only removes
    references to things that do not exist and gates that they cannot come back.
  - No removal of the four unused @aws-sdk dependencies or other clone-hygiene work — that is M1's `starts-everywhere-e5`.
