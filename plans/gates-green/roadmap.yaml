- id: gates-green-t-platform-compat
  kind: task
  title: Add workspace-tooling/platform_compat.py with current_uid, exclusive_file_lock and supports_posix_privacy
  status: planned
  parent: gates-green-e4
  summary: One shim, importable from both the workspace-tooling and data/scripts trees, is the prerequisite
    for every other task in this epic. It must expose `current_uid()` (os.geteuid on POSIX; a stable per-user
    identity on Windows — the SID string or a documented sentinel), `exclusive_file_lock(fd)` / `unlock(fd)`
    (fcntl.flock on POSIX, msvcrt.locking on Windows, with bounded retry), and `supports_posix_privacy()`
    so callers can branch on whether mode-bit and uid ownership checks are meaningful. Build it with tests
    before touching any call site — the shim is the thing every subsequent change depends on being correct.
  priority: must
  lane: next
  size: M
  acceptance:
  - Given `workspace-tooling/platform_compat.py` exists, when `python -c "import platform_compat as p;
    print(p.current_uid(), p.supports_posix_privacy())"` is run with the module on PYTHONPATH, then it
    prints a value without raising on Windows, Linux and macOS.
  - 'Given `workspace-tooling/tests/test_platform_compat.py`, when the substrate suite runs on each OS,
    then it asserts: two processes contending on `exclusive_file_lock` over the same file serialise (no
    interleaved writes over 500 iterations); the lock is released on context exit and on exception; `current_uid()`
    is stable across calls within a process; and `supports_posix_privacy()` returns False on win32 and
    True elsewhere.'
  - Given the module, when `grep -n 'import fcntl\|import msvcrt' workspace-tooling/platform_compat.py`
    is run, then both imports are guarded by a platform branch and neither is at unconditional module
    scope in a way that raises on the other platform.
  tags:
  - F002
  - F150
  - platform-compat
  - shim
  - portability
