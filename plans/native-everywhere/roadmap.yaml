- id: native-everywhere-e2
  kind: epic
  title: One declarative service contract rendered to launchd, systemd and Task Scheduler
  status: planned
  summary: A single schedule/service declaration per service renders launchd plists, systemd user units
    and timers, and per-user Windows Scheduled Tasks needing no admin rights, driven by an install/uninstall/start/stop/status/logs
    verb set modelled on service-manager-rs. The five broken `com.personal.*` plists — which hardcode
    `$HOME/Work/workspace/scripts/`, embed a literal `$HOME` launchd never expands, and pin `/opt/homebrew/bin`
    — become generated templates and are deleted from the tree. The three hardcoded `/bin/launchctl` probes
    and the plist-derived cadence constants move behind one OS dispatch, the alert channel dispatches
    per OS instead of shelling `/usr/bin/osascript`, and the three plist-asserting test modules assert
    against the OS-neutral contract plus a per-OS rendered artifact.
  priority: should
  lane: next
  size: XL
  acceptance:
  - Given `git ls-files 'workspace-tooling/*.plist'`, then the output is empty — all five com.personal.*
    plists are removed and every unit is rendered from a contract.
  - Given each of the three OSes, when `python workspace-tooling/service_manager.py render --all --dry-run`
    runs, then it prints the rendered artifact for that OS (launchd plist / systemd .service+.timer /
    Scheduled Task XML), and `service_manager.py check` exits non-zero listing every argv path, interpreter
    or log directory that does not exist.
  - Given a non-elevated Windows user, when `service_manager.py install artifact-memory-service` runs,
    then `Get-ScheduledTask -TaskName 'agent-kit-artifact-memory-service'` returns a registered per-user
    task, `service_manager.py status --json` reports it running, and no UAC prompt was raised.
  - Given `python -m unittest discover -s workspace-tooling/tests` on ubuntu-latest and windows-latest,
    then test_artifact_watchdog.py, test_artifact_backup.py and test_artifact_consumer_launchd.py are
    all green with zero whole-module darwin skips.
  depends_on:
  - gates-green-e4
  - named-and-installable-e2
  tags:
  - F004
  - F051
  - F066
  - F103
  - F174
  - F011
  - F016
  - F147
  - X027
  - supervision
  - scheduling
