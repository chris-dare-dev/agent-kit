- id: native-everywhere-t-service-manager-cli
  kind: task
  title: 'Build service_manager.py: install / uninstall / start / stop / status / logs / render / validate
    / check'
  status: planned
  parent: native-everywhere-e2
  summary: 'Add `workspace-tooling/service_manager.py` as the single supervision entry point, modelled
    on the service-manager-rs interface X027 names: user level by default, a restart policy each backend
    approximates, and a status verb reading BOTH the OS supervisor''s view and the existing health-file
    JSON so the known false-healthy probe has exactly one place to be fixed. It owns backend selection
    (launchd / systemd-user / schtasks) and exposes `is_running(label)` as the function the three retired
    launchctl probes will call. Every verb accepts a service name or `--all`, and no verb may require
    elevation.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given `python workspace-tooling/service_manager.py --help`, then the verbs install, uninstall, start,
    stop, status, logs, render, validate and check are all listed, and each accepts a service name or
    --all.
  - Given any OS, when `service_manager.py install <name>` runs as an unprivileged user, then the unit
    is written to that OS's per-user location (~/Library/LaunchAgents, $XDG_CONFIG_HOME/systemd/user,
    or a per-user Scheduled Task) with no sudo and no elevation prompt; when `uninstall <name>` then runs,
    then the unit is removed and `status <name>` reports installed=false.
  - Given `service_manager.py status --json`, then it emits one row per declared service with {name, installed,
    running, health_file, health_age_seconds, backend}, where `running` comes from the OS supervisor and
    `health_age_seconds` from the health file, so a running-but-stale service is distinguishable from
    a stopped one — asserted by a test that stops the service and leaves the health file in place.
  - Given `service_manager.py check`, when any argv path, interpreter or log directory referenced by a
    rendered unit does not exist, then it exits non-zero and prints every missing path; when all exist,
    it exits 0.
  - Given `service_manager.py logs <name> --tail 50`, then it prints the last 50 lines of that service's
    stdout and stderr destinations on all three OSes, and exits non-zero with an actionable message if
    the destinations do not exist.
