    150 for its lock id, which is the BSD/macOS spelling absent from GNU coreutils, making it fragile
    on a minimal Linux image too. Port it to `workspace-tooling/build_agent_vault.py` so the projection
    is one cross-platform program: manifest/policy resolution (currently :23-27), the sync and --audit-policy
    modes, the no-delete transition semantics, and the lock id (via hashlib). The existing no-delete invariant
    test must keep passing against the port.'
  priority: should
  lane: later
  size: L
  acceptance:
  - 'Given a minimal Linux image with no `shasum` binary on PATH, when the builder computes its lock id,
    then it succeeds using `hashlib.sha256` — the reproduction `bash workspace-tooling/build-agent-vault.sh
    --audit-policy` failing with `shasum: command not found` no longer applies.'
  - Given `python workspace-tooling/build_agent_vault.py --audit-policy --output build/vault-audit.json`
    on all three OSes, then it exits 0 and emits the same JSON schema the shell version emitted, plus
    a new `link_strategy` field.
  - 'Given the no-delete invariant, when `python -m unittest workspace-tooling.tests.test_build_agent_vault_no_delete`
    runs against the ported builder, then it passes: the default scheduled mode performs no unlink, no
    replacement, no stale pruning and no empty-directory deletion.'
  - Given `git ls-files workspace-tooling/build-agent-vault.sh`, then either the file is absent or it
    is a shim of at most three lines exec'ing the Python module, asserted by a test on its line count.
  tags:
  - F010
  - obsidian
  - portability
  - shasum
- id: native-everywhere-t-stub-projection
  kind: task
  title: Project Markdown stubs with frontmatter back-references instead of a symlink farm
  status: planned
  parent: native-everywhere-e3
  summary: '`safe_vault_link.py:69-110` builds every projected entry through a `dir_fd=` ladder — `os.open`,
    `os.mkdir`, `os.stat`, `os.readlink`, `os.symlink`, all with `dir_fd=current` — and `os.supports_dir_fd`
    is the empty set on Windows, so `os.symlink in os.supports_dir_fd` is False and the very first `os.open(vault,
    O_RDONLY)` raises `PermissionError [WinError 13]` regardless. Even a dir_fd-free rewrite would not
    help: `os.symlink` on Windows needs Developer Mode or elevation. Make generated Markdown stubs the
    default strategy (frontmatter back-reference to the canonical file), keep the dir_fd symlink path
    as an opt-in `--link-mode symlink` gated on a runtime capability probe rather than an assumption,
    add junction and `--copy` fallbacks mirroring the precedent already in setup-local.sh:9-11, and record
    the strategy actually used in the --audit-policy JSON.'
  priority: should
  lane: later
  size: L
  acceptance:
  - Given Windows without Developer Mode and without elevation, when `python workspace-tooling/build_agent_vault.py
    --apply` runs, then it completes and creates stub files — the reproduction of calling `safe_vault_link.create_missing_link(...)`
    directly and failing at `os.open(vault, O_RDONLY)` with `PermissionError [WinError 13]` no longer
    occurs on the default path.
  - Given the default `--link-mode stub`, then each projected entry is a Markdown file whose frontmatter
    carries `source_path`, `source_sha256` and `projected_at` and whose body links back to the canonical
    file — asserted by a test parsing a projected stub.
  - Given `--link-mode symlink` on a host where the runtime capability probe confirms symlink support,
    then today's dir_fd symlink behaviour runs unchanged and the existing safe_vault_link tests pass;
    given `--link-mode symlink` where the probe FAILS, then the command exits non-zero naming the probe
    result rather than silently falling back to another strategy.
  - Given `--audit-policy`, then the emitted JSON records the strategy actually used per entry as one
    of `stub` | `symlink` | `junction` | `copy`.
  - Given a stub whose canonical source content has changed, when the builder re-runs, then that stub's
    `source_sha256` is refreshed while every unrelated existing entry is preserved byte-for-byte — the
    no-delete invariant test still passes.
  depends_on:
  - native-everywhere-t-vault-build-python
  tags:
  - F010
  - F048
  - obsidian
  - stubs
  - dir-fd
  - windows
  - memory
- id: native-everywhere-t-catalog-reads-projection
  kind: task
  title: Make the catalog index the projection, and settle the dead vault_projection policy block
  status: planned
  parent: native-everywhere-e3
  summary: 'The projection is invisible to the index it exists to feed: `artifact_catalog.py:373-375`
    does `if path.is_symlink(): stats["skipped_symlinks"] += 1; continue`, so a symlink farm contributes
    nothing. Stub-mode projection fixes that by construction, and this story proves it and closes the
    surrounding dead config. `workspace-tooling/artifact-policy.json:4-25` sets `vault_projection.default_action:
    "exclude"` with a single `**/*` exclude rule and a description that defers ownership to `add_properties.py`
    — a file that does not exist in this repository — while `vault_projection_policy.py` carries 489 lines
    behind it. Either restore a working default the shipped example actually exercises, or delete the
    block, the module and README-vault-projection-policy.md together. Whichever is chosen, the tree must
    agree.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given a stub-mode projection, when `python workspace-tooling/artifact_catalog.py --workspace <vault>
    --json` runs, then `skipped_symlinks == 0` and the number of catalogued documents equals the number
    of projected stubs — asserted by a new case in workspace-tooling/tests/test_artifact_catalog.py.
  - Given artifact-policy.example.json, then its `vault_projection` block either (a) declares a working
    default with non-empty candidate_roots and allow_rules that a test exercises end to end against the
    example project map, or (b) is deleted together with vault_projection_policy.py and README-vault-projection-policy.md
    — and `grep -rn 'vault_projection' workspace-tooling/` agrees with whichever branch was taken, with
    no orphan references.
  - Given `grep -rn 'add_properties' workspace-tooling/`, then there are zero hits — the policy description
    no longer cites a file absent from this repository.
  - Given the chosen branch, when `python -m unittest workspace-tooling.tests.test_vault_projection_policy`
    runs, then it either passes against the restored default or the module is deleted along with its test,
    and `python -m unittest discover -s workspace-tooling/tests` stays green on all three OSes.
  depends_on:
