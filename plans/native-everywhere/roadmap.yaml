- id: native-everywhere-t-alert-dispatch
  kind: task
  title: Dispatch alerts per OS and add an OS-independent channel that degrades to a file drop
  status: planned
  parent: native-everywhere-e2
  summary: 'The whole alerting plane is macOS-only and degrades to a silent no-op elsewhere: `artifact_watchdog.py:69-84`
    `_desktop_notify` shells `/usr/bin/osascript`, catches OSError and returns False that nothing acts
    on; `artifact_event_consumer.py:1490-1508` carries a second copy of the same call; the default log
    at `artifact_watchdog.py:48` is `~/Library/Logs/personal-artifact-watchdog.jsonl`; and the consumer
    contract passes `--desktop-notify` assuming the channel works. Add `notify(title, message)` to the
    platform-compat module M2 creates, dispatching to osascript / notify-send / a Windows toast, each
    guarded by `shutil.which`. Because desktop notification is inherently best-effort, add an OS-independent
    channel beside it — a 0600 file drop under the derived root that an oncall or CI job can poll — and
    make `--desktop-notify` degrade to that rather than to nothing.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given Linux WITH notify-send present, when the watchdog raises, then a desktop notification is delivered;
    given Linux WITHOUT notify-send, then `notify()` returns False and the alert is still written to the
    file-drop channel — both asserted by `python -m unittest workspace-tooling.tests.test_artifact_watchdog
    -k alert_channel` on ubuntu-latest.
  - Given Windows, when the watchdog raises, then a toast is attempted through platform-compat `notify()`
    and, regardless of whether it succeeds, `<derived_root>/alerts/<iso8601>-<code>.json` is written with
    owner-only permissions via the privacy backend.
  - 'Given `--desktop-notify` on a host with no notifier binary, then the run''s JSON record carries `alert_channel:
    "file"` and the run exits 0 — never a silently swallowed OSError with no record.'
  - Given `grep -rn 'osascript' workspace-tooling/*.py`, then the only hit is inside the darwin branch
    of the platform-compat notify implementation (the duplicate at artifact_event_consumer.py:1502 is
    gone).
  - Given any OS, then `artifact_watchdog.DEFAULT_LOG` resolves under the OS-aware derived root, and `grep
    -rn 'Library/Logs' workspace-tooling/*.py` returns zero hits outside the launchd renderer.
  depends_on:
