items:
- id: native-everywhere-e1
  kind: epic
  title: 'Pluggable IPC transport: UDS on POSIX, named pipe on Windows'
  status: planned
  summary: Introduce a transport abstraction with AF_UNIX as the POSIX default (the stronger boundary)
    and a DACL-restricted named-pipe backend on Windows, implemented on both the TypeScript adapter and
    the Python service, plus a loopback+token backend so a container can exercise the service at all.
    In the same move, split artifact_security.py into a policy layer and a pluggable privacy backend so
    POSIX mode bits and Windows ACLs become two implementations of one contract rather than one hardcoded
    assumption that silently degrades. The outcome is that the four artifact-memory tools work on Windows
    instead of failing at a literal platform check, and the owner-only custody guarantee either holds
    or raises — never passes vacuously.
  priority: must
  lane: next
  size: XL
  acceptance:
  - Given a Windows host with the memory service running, when `node dist/index.js` starts under the default
    (personal) profile and `artifact_memory_status` is called, then it returns a live service payload
    rather than the 'artifact memory unavailable on this platform' degradation M1 introduced, and `src/mcp-contract.test.ts`
    passes on windows-latest.
  - Given any of the three OSes, when `python -m unittest workspace-tooling.tests.test_transport_conformance`
    runs, then an identical assertion set passes against every backend `artifact_transport.available_backends()`
    reports, and the suite fails (not skips) if the platform reports zero backends.
  - Given a path whose privacy the active backend cannot enforce, when any `artifact_security.require_private_*`
    is called, then `PrivateStateError` is raised — never an AttributeError and never a silent pass; verified
    by `python -m unittest workspace-tooling.tests.test_artifact_security -k fail_closed` on windows-latest.
  - Given `grep -n 'win32' src/tools/artifact-memory.ts`, then no hit is part of a rejection condition;
    the only platform branch is transport/trust-backend selection.
  depends_on:
  - gates-green-e4
  - named-and-installable-e2
  tags:
  - F005
  - F126
  - F003
  - transport
  - windows
  - ipc
  - security-model
  - portability
- id: native-everywhere-spike-1
  kind: spike
  title: '[SPIKE] Choose the Windows endpoint: DACL-restricted named pipe vs loopback TCP + token'
  status: planned
  parent: native-everywhere-e1
  summary: 'F005 and F126 both propose `\\.\pipe\agent-kit-artifact-memory-<sid>` restricted to the current
    SID, but Python''s stdlib has no named-pipe server — `socketserver.UnixStreamServer` is defined only
    when `socket.AF_UNIX` exists and there is no NT-pipe equivalent — so a named-pipe server needs pywin32/win32pipe,
    a Windows-only native dependency. The Node side is free: `http.request({ socketPath })` already accepts
    pipe paths, so the call site at src/tools/artifact-memory.ts:108 would not change. Time-box three
    days, prototype both endpoints end to end, measure them, and put the dependency question to the owner
    as a recorded decision.'
  priority: must
  lane: now
  size: S
  acceptance:
  - 'Given a three-day time box, when the spike ends, then `docs/spikes/windows-ipc-endpoint.md` exists
    recording: (a) a runnable prototype under `spikes/win-ipc/` in which a Python `win32pipe.CreateNamedPipe`
    server with a DACL restricted to the current SID serves one HTTP/1.1 JSON round trip to a Node `http.request({
    socketPath })` client; (b) the same round trip over 127.0.0.1 with a 0600 token file and an Authorization
    header; (c) measured p50/p95 round-trip latency for both over 1000 requests; (d) the pywin32 wheel
    availability matrix for CPython 3.12 on win-x86_64 and win-arm64.'
  - Given the named-pipe prototype, when a second local user account attempts to connect to the pipe,
    then the connection is refused, and the exact DACL string used is recorded in the report.
  - Given the spike report, when the owner reviews it, then a decision is recorded as an ADR under `docs/adr/`
    stating which endpoint is the Windows default and whether pywin32 becomes a `[windows]` extra in the
    substrate pyproject (from M4) or is rejected in favour of loopback+token. No implementation story
    starts before that ADR is merged.
  tags:
  - F005
  - F126
  - spike
  - windows
  - named-pipe
  - pywin32
  - dependency-decision
  - portability
- id: native-everywhere-t-transport-contract
  kind: task
  title: Make the runtime config carry a discriminated {transport, endpoint} service block
  status: planned
  parent: native-everywhere-e1
  summary: '`workspace-tooling/artifact_runtime.py:249` hardcodes `expected_service_fields = {"socket_path"}`
    and `:24` pins `SCHEMA_VERSION = 2`, so the runtime config can only ever describe a Unix socket; `:432-433`
    feeds `service.get("socket_path")` into `_future_private_socket`. Replace the block with `{transport,
    endpoint}` where transport is one of `uds` | `npipe` | `loopback`, bump SCHEMA_VERSION to 3, and gate
    the `require_private_socket` S_ISSOCK/0600/uid ladder at `:106-137` to the `uds` branch while the
    other transports dispatch to the privacy backend. Ship a one-shot migration so an existing schema-2
    config on a live machine is not orphaned.'
  priority: must
  lane: next
  size: M
  acceptance:
  - 'Given an existing schema_version 2 runtime config containing `service.socket_path`, when `python
    workspace-tooling/artifact_memory_provision.py migrate-runtime --apply` runs, then the file becomes
    schema_version 3 with `service: {"transport": "uds", "endpoint": "<the old socket_path>"}` and the
    original is preserved alongside as `<name>.v2.bak`.'
  - 'Given a schema-3 config with `transport: "npipe"` and an `endpoint` of `\\.\pipe\agent-kit-artifact-memory-<sid>`,
    when `artifact_runtime.load_runtime()` runs on win32, then it returns without raising and `require_private_socket`
    is never called (asserted with a mock).'
  - 'Given a schema-3 config with `transport: "uds"`, when it is loaded on any POSIX host, then the existing
    S_ISSOCK + mode-0600 + uid-equality checks still run — proven by every existing assertion in `workspace-tooling/tests/test_artifact_runtime.py`
    passing unchanged.'
  - Given a config whose `transport` value is not one of the three accepted values, when it is loaded,
    then `RuntimeConfigError` is raised naming both the field and the accepted set, and the process exits
    non-zero.
  depends_on:
  - native-everywhere-spike-1
  tags:
  - F005
  - F126
  - runtime-config
  - schema-version
  - transport
  - substrate
- id: native-everywhere-t-py-transport-backends
  kind: task
  title: Replace UnixStreamServer and the AF_UNIX client with a transport backend factory
  status: planned
  parent: native-everywhere-e1
  summary: 'On the Python side three sites hardcode AF_UNIX: `artifact_memory_service.py:1564` declares
    `class ArtifactUnixHTTPServer(socketserver.ThreadingMixIn, socketserver.UnixStreamServer)` — a class
    body that raises AttributeError at import on Windows because `UnixStreamServer` only exists when `socket.AF_UNIX`
    does; `artifact_memory_service.py:1677` probes stale endpoints with `socket.socket(socket.AF_UNIX,
    socket.SOCK_STREAM)`; and `artifact_service_client.py:42` builds the client connection the same way.
    Add `workspace-tooling/artifact_transport.py` exposing `available_backends()`, `server_factory(transport,
    endpoint, handler)`, `client_connection(transport, endpoint, timeout)` and `probe_stale(transport,
    endpoint)`, and reduce those three sites to backend calls. The lifecycle lock at `_socket_lifecycle_lock_path`
    (`:1555-1561`) and the refuse-if-active semantics must survive the port unchanged.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given a Windows CPython where `python -c "import socket; print(hasattr(socket,'AF_UNIX'))"` prints
    False, when `python -c "import artifact_memory_service"` runs with PYTHONPATH set to workspace-tooling,
    then it exits 0 — today it raises AttributeError at the class definition on line 1564.
  - Given a schema-3 npipe (or loopback) config, when `python workspace-tooling/artifact_memory_service.py
    --config <cfg> --health-file <path>` starts on Windows, then the process stays up and writes a health
    file within 60 seconds.
  - Given a running service on any transport, when `artifact_service_client.post_json(route='/status',
    ...)` is called, then the same JSON response shape is returned — asserted by one parametrized test
    that iterates `artifact_transport.available_backends()`.
  - Given a STALE endpoint left behind by a killed service, when the service restarts, then it binds successfully
    using the backend's own probe (AF_UNIX connect on posix, CreateFile on the pipe, TCP connect on loopback);
    given a LIVE endpoint, then it refuses with the existing 'Artifact Memory Service socket is already
    active' ServiceError. Both cases asserted per backend in workspace-tooling/tests/test_artifact_memory_service.py.
  depends_on:
  - native-everywhere-t-transport-contract
  tags:
  - F005
  - F126
  - transport
  - af-unix
  - memory-service
  - substrate
- id: native-everywhere-t-ts-transport-backends
  kind: task
  title: Replace absoluteSocketPath and validateSecureSocket with a platform-dispatched endpoint-trust
    interface
  status: planned
  parent: native-everywhere-e1
  summary: '`src/tools/artifact-memory.ts:165-182` makes `process.platform === "win32"` the FIRST clause
    of `absoluteSocketPath`''s rejection test, so every Windows call throws before a connection is attempted;
    `currentUid()` at `:183-188` throws whenever `process.getuid` is undefined (always, on Windows); `validateSecureSocket()`
    at `:206-260` walks every path component asserting POSIX `stat.uid` and mode bits; and `MAX_SOCKET_PATH_BYTES
    = 103` at `:53` is the POSIX `sun_path` limit applied unconditionally. Replace these with `resolveEndpoint()`
    and a `validateEndpointTrust()` interface dispatched on transport, keeping the POSIX implementation
    byte-for-byte and adding a Windows owner-SID check for the pipe. Also read the endpoint from the provisioner''s
    runtime config rather than the hardcoded default at `:38-47`.'
  priority: must
  lane: next
  size: M
  acceptance:
  - Given `process.platform === 'win32'` and a runtime config declaring an npipe endpoint, when `resolveEndpoint()`
    is called, then it returns the endpoint instead of throwing — and `node dist/index.js` under the default
    personal profile on Windows registers all 17 tools with `artifact_memory_status` reaching the service.
  - Given a POSIX host, when the uds branch runs, then the 103-byte length cap, home-prefix requirement,
    normalization check, NUL rejection, trailing-separator rejection and the full per-component lstat/uid/mode
    ladder are all still enforced — proven by `src/tools/artifact-memory.test.ts` passing UNMODIFIED on
    macos-latest and ubuntu-latest.
  - Given a named pipe whose owner SID is not the current user's, when `validateEndpointTrust()` runs
    on Windows, then it throws the existing SOCKET_ERROR and no HTTP request is issued.
  - Given `npx tsc --noEmit && grep -rn 'process.getuid' src/`, then the only hits are inside the POSIX
    trust backend module, and the build exits 0.
  depends_on:
  - native-everywhere-t-transport-contract
  - native-everywhere-spike-1
  tags:
  - F126
  - F005
  - mcp-adapter
  - typescript
  - endpoint-trust
  - mcp-server
- id: native-everywhere-t-security-backend-split
  kind: task
  title: Split artifact_security into a policy layer and a pluggable OS privacy backend
  status: planned
  parent: native-everywhere-e1
  summary: '`workspace-tooling/artifact_security.py` is the gate every derived-state path passes through
    and its whole trust model is POSIX-only: `require_private_directory` (:81-95) demands mode exactly
    0o700, `require_private_file` (:108-122) demands exactly 0o600, `_owned` (:44-48) demands `st_uid
    == os.geteuid()`, and `fsync_directory` (:219-228) opens a directory with `os.open`. On Windows every
    one of these is meaningless in the DANGEROUS direction — `chmod(0o700)` on a directory reads back
    0o777, `chmod(0o600)` on a file reads back 0o666, `st_uid` is always 0 — so the checks PASS while
    the guarantee is absent, and `os.open(<dir>)` raises PermissionError WinError 13. Split into a policy
    layer plus `PosixPrivacyBackend` (today''s logic verbatim) and `WindowsPrivacyBackend` (DACL grants
    only the current SID; create with inheritance removed), selected explicitly at import and failing
    CLOSED when no backend can enforce.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given a Windows host, when `artifact_security.ensure_private_directory(p)` runs, then `icacls <p>`
    shows a grant to the current SID only and inheritance removed, and `require_private_directory(p)`
    returns p; when the DACL is then widened to include Everyone, then `require_private_directory(p)`
    raises `PrivateStateError`.
  - 'Given a platform for which no privacy backend can enforce the policy, when any `require_private_*`
    is called, then `PrivateStateError` is raised naming the platform. Reproduction: `python -c "import
    artifact_security as s; s._select_backend(''unsupported'')"` exits non-zero with PrivateStateError,
    never AttributeError and never 0.'
  - Given `fsync_directory` on Windows, when it is called on a private directory, then it returns None
    as a documented no-op instead of raising `PermissionError [WinError 13]` — `python -m unittest workspace-tooling.tests.test_artifact_security
    -k fsync` passes on windows-latest.
  - Given macos-latest and ubuntu-latest, when `python -m unittest workspace-tooling.tests.test_artifact_security`
    runs, then every pre-existing assertion passes unchanged, confirming PosixPrivacyBackend preserved
    the mode-bit and uid logic verbatim.
  depends_on:
  - gates-green-e4
  tags:
  - F003
  - F126
  - security-model
  - acl
  - fail-closed
  - windows
  - security
- id: native-everywhere-t-security-fixtures
  kind: task
  title: Rewrite the permission-based test fixtures to acquire unreadability through the privacy backend
  status: planned
  parent: native-everywhere-e1
  summary: The fail-closed guarantees are tested by raw `os.chmod`, which is a no-op on Windows, so the
    tests report green while the guarantee is absent — the exact failure direction F003 flags as worse
    than an unsupported platform. `workspace-tooling/tests/test_artifact_watermark.py:535` (`test_unreadable_subdirectory_fails_the_fingerprint_closed`)
    chmods a nested dir to 0o000 and asserts `quarantine_fingerprint` returns None; on Windows it returned
    a real SHA-256. Its siblings at `:526` and `:551` chmod to 0o400/0o000 and assert STATE_UNKNOWN; on
    Windows they report 'degraded' != 'unknown'. Route all of these through a backend method (`make_unreadable`/`restore`)
    that is a real DACL denial on Windows and chmod on POSIX, and skip loudly where the backend cannot
    deliver it.
  priority: should
  lane: later
  size: M
  acceptance:
  - Given windows-latest, when `python -m unittest workspace-tooling.tests.test_artifact_watermark` runs,
    then `test_unreadable_subdirectory_fails_the_fingerprint_closed` PASSES with `assertIsNone(fingerprint)`
    because the fixture removed read access through `privacy_backend.make_unreadable(path)` rather than
    `os.chmod(nested, 0o000)`.
  - Given windows-latest, when the same module runs, then `test_unstattable_child_reports_unknown_rather_than_raising`
    and `test_unreadable_root_reports_unknown_rather_than_all_clear` both assert `STATE_UNKNOWN` and pass.
  - Given a platform whose backend cannot make a path unreadable, when the fixture runs, then the test
    SKIPS with an explicit reason naming the backend — it never passes vacuously, and a test asserts that
    the skip reason is non-empty.
  - Given `grep -rn 'os.chmod' workspace-tooling/tests/`, then no remaining hit is used to establish a
    privacy precondition (hits inside the POSIX backend's own unit test are permitted and enumerated in
    an allowlist test).
  depends_on:
  - native-everywhere-t-security-backend-split
  tags:
  - F003
  - tests
  - fail-closed
  - fixtures
  - security
- id: native-everywhere-t-loopback-fallback
  kind: task
  title: Add a loopback TCP + token transport so a container can exercise the service
  status: planned
  parent: native-everywhere-e1
  summary: 'F005 asks explicitly for a `127.0.0.1:<port>` fallback with a 0600 token file and a required
    Authorization header, because neither UDS nor a named pipe is reliably available inside a CI container,
    and today there is no way to run the service in CI at all. Implement it as the third `artifact_transport`
    backend: bind loopback only, mint a per-boot token into the derived root at 0600 (or owner-only DACL
    via the privacy backend), and require `Authorization: Bearer <token>` on every route. This is the
    backend that makes the M3 integration job and the conformance suite possible on every OS.'
  priority: should
  lane: later
  size: M
  acceptance:
  - 'Given a Linux container with `AGENT_MEMORY_TRANSPORT=loopback`, when the service starts, then it
    binds 127.0.0.1 on an ephemeral port, writes `<derived_root>/artifact-memory-token` at mode 0600,
    and records `{"transport": "loopback", "endpoint": "127.0.0.1:<port>"}` in the runtime config.'
  - 'Given a request without a valid `Authorization: Bearer <token>` header, when it reaches the loopback
    listener, then the service returns HTTP 401 and writes no part of the request body to any log — asserted
    in workspace-tooling/tests/test_artifact_memory_service.py.'
  - Given a configured bind address that is not 127.0.0.1 or ::1, when the service starts, then it refuses
    with a ServiceError naming the rejected address and exits non-zero.
  - Given the token file, when its mode or owner is not owner-only, when the client starts, then it refuses
    to read the token and raises rather than sending it.
  depends_on:
  - native-everywhere-t-py-transport-backends
  - native-everywhere-t-security-backend-split
  tags:
  - F005
  - loopback
  - token-auth
  - ci-enablement
  - substrate
- id: native-everywhere-t-transport-conformance
  kind: task
  title: One conformance suite that runs the whole memory API over every available transport
  status: planned
  parent: native-everywhere-e1
  summary: With three backends there are now three ways to be silently wrong, and today's only transport
    test — `src/tools/artifact-memory.test.ts`, whose socketFixture at `:42` binds an AF_UNIX socket —
    is orphaned from `npm test` and 12/12 red on Windows. Add `workspace-tooling/tests/test_transport_conformance.py`
    that drives the identical assertion set over every backend the platform reports, wire the TypeScript
    suite so it runs against the platform's backend rather than being excluded, and emit a machine-readable
    result the M3 gate runner asserts on.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given `python -m unittest workspace-tooling.tests.test_transport_conformance` on ubuntu-latest, macos-latest
    and windows-latest, then every backend from `artifact_transport.available_backends()` passes the same
    assertions (status, search, get, error envelope shape, oversize-body rejection above MAX_JSON_BYTES,
