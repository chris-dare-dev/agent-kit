    zero backends.
  - Given the M3 CI matrix, when the windows-latest leg runs `npm test`, then `src/tools/artifact-memory.test.ts`
    is included and un-skipped, exercising the npipe or loopback backend instead of being excluded for
    EACCES on its AF_UNIX bind at src/tools/artifact-memory.test.ts:42.
  - Given a conformance run, then `build/transport-conformance.json` records `{os, backend, passed, failed}`
    per backend, and the committed gate runner exits non-zero if the file is missing, empty, or reports
