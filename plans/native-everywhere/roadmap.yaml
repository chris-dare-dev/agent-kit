schema: roadmap/1
slug: native-everywhere
project: agent-kit
title: M5 Native Everywhere — native transport, cross-OS supervision, and a projection without symlinks
status: draft
phase: sequenced
brief: 'M5 makes the substrate a first-class citizen on all three operating systems. Three planes move
  at once: the IPC transport between the MCP adapter and the resident memory service (AF_UNIX only — `hasattr(socket,
  ''AF_UNIX'')` is False in Windows CPython, and `src/tools/artifact-memory.ts:169` makes win32 the first
  clause of a rejection test); the supervision plane (five `com.personal.*.plist` files that hardcode
  `$HOME/Work/workspace/scripts/` — a directory this repo does not contain — and so cannot install even
  on macOS); and the Obsidian projection (a symlink farm built through `dir_fd=` calls, and `os.supports_dir_fd`
  is empty on Windows). Each becomes one declarative contract with per-OS backends, and the POSIX trust
  model becomes a pluggable privacy backend that fails CLOSED where it cannot be enforced — today on Windows
  `chmod(0o700)` reads back `0o777` and `st_uid` is `0`, so the owner-only guarantee silently degrades
  while CI reports green. It lands after M4 because the AF_UNIX-to-named-pipe port and the three-way supervisor
  are the two largest items on the board and both are worthless if the kit is not installable; it precedes
  M8 because goal E''s lifecycle jobs cannot run cross-OS until the cadence plane does.'
goal:
  hmw: How might we make the transport, the supervision plane and the vault projection first-class on
    Windows and Linux — without weakening the POSIX trust boundary that is the only thing making the memory
    service safe today?
  objective: Run the full substrate — resident memory service, scheduled lifecycle jobs and the Obsidian
    projection — natively on Windows, Linux and macOS, driven by one declarative service contract rendered
    to launchd, systemd and Task Scheduler, and one transport contract with a per-OS privacy backend that
    fails closed.
  key_results:
  - 'All four artifact-memory MCP tools return live service results on windows-latest, macos-latest and
    ubuntu-latest: `build/transport-conformance.json` records at least one passing backend per OS, and
    the CI matrix FAILS (not skips) if any OS reports zero backends.'
  - '`git ls-files ''workspace-tooling/*.plist''` is empty. All five services render from `workspace-tooling/services/<name>/service.toml`,
    and `python workspace-tooling/service_manager.py check` exits 0 on all three OSes.'
  - '`service_manager.py install --all` completes with no UAC/elevation prompt on Windows and no sudo
    on Linux/macOS, and `status --json` reports every service installed and running from the OS supervisor''s
    own view (not from the health file alone).'
  - '`python -m unittest discover -s workspace-tooling/tests` is green on ubuntu-latest and windows-latest
    with zero whole-module darwin skips in test_artifact_watchdog.py, test_artifact_backup.py and test_artifact_consumer_launchd.py.'
  - The vault projection builds on all three OSes with zero symlinks, and `artifact_catalog.py --json`
    reports `skipped_symlinks == 0` with projected-stub count equal to catalogued document count.
  - '`grep -rn ''GitLab/\|Work/workspace\|/bin/launchctl\|osascript\|Library/Logs'' workspace-tooling/`
    returns hits only inside the darwin renderer/backend modules.'
  wont:
  - No memory-capability work. Retrieval configuration, the gold set, the hot/warm/cold tier model and
    the gated write path are M8; this milestone only makes the plane they run on portable.
  - No skills corpus, authoring path or ROI ledger work (M6). data/skills/ holds exactly one skill (handoff/),
    so anything premised on a skill population stays sequenced after a corpus exists.
  - No port of the four bash/jq PreToolUse hooks (F006/F111/F132) — those belong to M3's guard epic, even
    though they are also POSIX-only.
  - WSL is not removed or deprecated. The documented, CI-tested WSL2 path from M2 remains the supported
    Windows story until the native transport ships, and stays supported afterwards as the low-friction
    option.
  - No system-wide (root/Administrator) service installation, no Windows Service Control Manager backend,
    and no remote or cross-machine supervision. User-level only, per X027.
  - No Docker work, no Qdrant packaging and no no-Qdrant degraded mode (M4). No Graphiti or graph work
    at all.
  - The naming decision is not re-opened. M5 renders service labels from whatever M1's owner decision
    settled; it does not choose the name.
generated_by:
  agent: claude-opus-5
  at: '2026-07-26'
  brief: multi-workflow audit + landscape benchmark synthesis
