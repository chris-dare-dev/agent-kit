- id: memory-you-can-trust-t-fused-recall
  kind: task
  title: Add a fused recall entry point over the four corpora, with one ranking contract
  status: planned
  parent: memory-you-can-trust-e1
  summary: 'Four tools search four disjoint corpora with mutually incomparable scores and no router: search_platform_knowledge
    (TypeScript inverted index), search_memory (the same index post-filtered to type===''memory'' at src/index.ts:142-148),
    search_artifacts (Qdrant hybrid + rerank), and query_temporal_facts (Cypher). Introduce recall({query,
    scopes?, max_results}) that fans out in parallel, normalises to {id, text, source_tier, native_score,
    native_rank}, fuses with the RRF constants already at artifact_retrieval.py:31-35, dedupes by canonical
    path and returns tier-labelled results. Whether the four primitives stay individually registered is
    decided by adr-012 from spike-1 — implement whichever the ADR mandates.'
  priority: should
  lane: later
  size: L
  acceptance:
  - Given a query whose best answer lives in the artifact store and whose second-best lives in the TypeScript
    knowledge index, when recall is called once, then both are returned in one ranked list with source_tier
    labels — replacing today's 2-4 tool-call sequence.
  - Given the same document reachable from two backends, when recall runs, then it appears exactly once
    in the output, deduped by canonical path, asserted by a unit test with a fixture present in both indexes.
  - Given one backend is unavailable, when recall is called, then it returns the results from the remaining
    backends and names the degraded tier in the response, rather than failing the whole call.
  - Given adr-012-tool-surface-budget.md, when `npm test` runs, then the tool-budget test passes with
    recall registered — i.e. the registered tool count after this change is within the ADR's N.
  - Given the gold suite, when it runs in recall mode, then nDCG@10 and recall@10 are reported for the
    fused entry point end to end, not only for the Qdrant path.
  depends_on:
