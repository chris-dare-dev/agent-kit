- id: memory-you-can-trust-t-eval-hermetic-mode
  kind: task
  title: Give the retrieval eval a hermetic, CI-runnable mode and a re-runnable holdout ledger
  status: planned
  parent: memory-you-can-trust-e2
  summary: 'Even with a gold set, the harness cannot gate a release cycle: _reserve_holdout (artifact_retrieval_eval.py:1452-1495)
    opens the ledger with O_CREAT|O_EXCL so the holdout can be run exactly once, and there is no fixture-backed
    mode that stands up a throwaway store. Add a `--split dev --fixture <dir>` hermetic mode that builds
    a disposable generation from committed fixture vectors, and give the holdout ledger a declared per-release
    budget so a release candidate can be evaluated without burning the split forever. The POSIX-only geteuid
    dependency in artifact_security.py is fixed upstream in M2 and must not be re-solved here.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given no Qdrant and no network, when `artifact_retrieval_eval.py --split dev --fixture workspace-tooling/tests/fixtures/eval/`
    runs, then it completes and prints per-mode metrics, so the dev split can run on every pull request.
  - Given a holdout ledger with a declared budget of N runs for a release, when the holdout is evaluated
    N times, then the (N+1)th attempt fails with an explicit budget-exhausted error naming the release
    — replacing today's single-shot O_CREAT|O_EXCL behaviour.
  - Given the hermetic mode runs on windows-latest in CI, when the job completes, then it is green — proving
    the private-file checks resolved by gates-green-e4 hold for the eval path too.
  - Given the harness, when it is invoked from a directory other than the repo root, then it resolves
    the manifest-derived corpus path against the manifest's own parent rather than the CWD and does not
    raise FileNotFoundError.
  depends_on:
  - memory-you-can-trust-t-gold-builder
  - gates-green-e4
  tags:
  - F082
  - evals
  - hermetic
  - ci
  - portability
- id: memory-you-can-trust-t-search-relevance-suite
  kind: task
  title: Add a relevance suite for search_platform_knowledge — the discovery surface upstream of every
    skill use
  status: planned
  parent: memory-you-can-trust-e2
  summary: The kit ships a rigorous gold harness for the Qdrant memory and nothing at all for its own
    retrieval. search_platform_knowledge (src/tools/search.ts:36-52) delegates to the hand-rolled ranker
    in src/search/search.ts whose only test is a two-marker smoke assertion in src/mcp-contract.test.ts:134-142
    — so a tokenizer or weight change can silently degrade whether an agent finds the right skill at all.
    Add data/evals/search-gold.json with 20-30 {query, expected_ids[], hard_negatives[]} cases drawn from
    real phrasings over the catalog entries, and a relevance test asserting recall@3 and MRR against a
    committed baseline.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given data/evals/search-gold.json, when `npm test` runs, then src/search/relevance.test.ts computes
    recall@3 and MRR and fails if either falls below the committed baseline in the same file.
  - Given a deliberate one-character change to the tokenizer at src/search/indexer.ts, when `npm test`
    runs, then the relevance test fails — proving the gate has teeth.
  - Given the gold file, when it is validated, then every expected_id resolves to an entry present in
    data/facts/catalog.json, and there are at least 20 cases with at least one hard negative each.
  - Given the suite naming and structure, when it is compared with the artifact-memory gold contract,
    then both use the same {query, expected, hard_negatives} idiom so the repo has one gold-suite vocabulary.
  depends_on:
  - gates-green-e2
  tags:
  - F091
  - evals
  - search
  - relevance
  - mcp-server
- id: memory-you-can-trust-t-retrieval-ci-gate
  kind: task
  title: Wire the gold suite to a CI non-regression gate keyed on the retrieval profile digest
  status: planned
  parent: memory-you-can-trust-e2
  summary: Closes the CI half of F045 and the gate half of X017. The profile digest from memory-that-earns-it-t-retrieval-profile
    is stamped on every eval run and on the collection metadata; CI must then refuse a profile change
    that has not run the gold suite, and refuse a run that regresses beyond a declared tolerance. This
    is the mechanism that makes 'did this change help' answerable — the project's own stated return-on-churn
    goal.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a pull request that changes any file feeding the profile digest (artifact_retrieval.py, the
    profile JSON, the models registry, the chunk profiles), when CI runs, then the retrieval gold job
    executes; given a pull request that touches none of them, then the job is skipped.
  - Given an eval run, when its output JSON is inspected, then it carries the profile_digest, and the
    collection metadata carries the same digest — a mismatch between them fails the job.
  - Given a change that drops nDCG@10 by more than the tolerance committed in data/artifact-memory/evals/tolerances.json,
    when CI runs, then the job fails and the summary names the metric, the baseline, the observed value
    and the tolerance.
  - Given a legitimate improvement, when the baseline is updated in the same commit, then the job passes
    — so the baseline can only move by a conscious, reviewable edit.
  depends_on:
  - memory-you-can-trust-t-retrieval-profile
  - memory-you-can-trust-t-repo-gold-set
  - ci-proves-it-e1
  tags:
  - F045
  - X017
  - ci
  - non-regression
  - evals
- id: memory-you-can-trust-t-forgetting-cases
  kind: task
  title: Add forgetting cases to the gold suite and report a staleness metric beside nDCG
  status: planned
  parent: memory-you-can-trust-e2
  summary: 'The existing harness measures exactly recall, while the failure mode that actually bites in
    production is failing to forget. Add a second suite of negative cases with its own gate: superseded
    (an old revision must not outrank its replacement), deleted (absent from catalog, vectors, projection
    and graph simultaneously), demoted (cold content still reachable within a bounded escalation budget)
    and canonicalization (renamed or aliased identifiers resolve to one span). Report stale_hit_rate@k
    and orphan_rate as gated metrics alongside nDCG.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given an artifact with a superseded revision and its replacement both present, when the forgetting
    suite runs, then the superseded revision does not appear above the replacement, and stale_hit_rate@10
    is reported.
  - Given an artifact deleted through the sanctioned path, when the deleted case runs, then it asserts
    absence simultaneously from the catalog, the Qdrant collection, the Obsidian projection and (if enabled)
    the graph — a single-surface deletion fails the case.
  - Given demoted content, when the demoted case runs, then the content is retrievable within the declared
    escalation budget and the case fails if it is unreachable — so demotion can never be silently equivalent
    to loss.
  - Given the suite, when CI runs it, then stale_hit_rate@10 and orphan_rate are gated against committed
    thresholds in the same tolerances file as nDCG.
  depends_on:
  - memory-you-can-trust-t-repo-gold-set
  - memory-grows-and-tiers-t-bitemporal-catalog
  tags:
  - X020
  - evals
  - forgetting
  - staleness
  - lifecycle
- id: memory-you-can-trust-t-eval-canary
  kind: task
  title: Embed a canary GUID in every eval file and prove the eval set is excluded from the substrate's
    own ingestion
  status: planned
  parent: memory-you-can-trust-e2
  summary: 'This repo is the rare project that ships both an eval suite and a memory substrate that ingests
    its own repository Markdown — so an eval task can silently become a retrievable memory, after which
    the eval measures recall rather than capability. Embed the BIG-bench canary GUID in every file under
    data/evals/ and data/artifact-memory/evals/, add a CI check asserting its presence, and add the repo-specific
    self-contamination check: assert that no eval material is reachable through artifact_catalog.py''s
    include globs or through a live search.'
  priority: should
  lane: later
  size: S
  acceptance:
  - Given every tracked file under data/evals/ and data/artifact-memory/evals/, when the canary check
    runs, then each contains the BIG-bench canary GUID and the check fails if any file lacks it.
  - Given a full catalog run over the repo, when the resulting catalog is queried for any eval path, then
    zero rows match — asserted by a test that fails if artifact-policy.json's include globs ever start
    matching the eval directories.
  - Given a live search against a generation built from this repo, when a distinctive string from a gold
    query is searched, then zero results are returned, proving the eval set never entered the substrate.
  - Given the eval tiers, when data/artifact-memory/evals/ is inspected, then public-demo, sealed-holdout
    and team-private tiers are declared with a sha256 manifest covering each tier's directory.
  depends_on:
  - memory-you-can-trust-t-repo-gold-set
  tags:
  - X043
  - evals
  - canary
  - contamination
  - security
- id: memory-you-can-trust-t-qdrant-integration-job
  kind: task
  title: Stand up a real Qdrant in a nightly integration job — the substrate's first end-to-end proof
  status: planned
  parent: memory-you-can-trust-e2
  summary: 'workspace-tooling/README.md:84-87 correctly states the unit suite is hermetic, but the consequence
    is that nothing in the repo ever exercises the real path: catalog to gzip-JSONL outbox to ONNX embedding
    to Qdrant upsert to semantic search over the socket. All three docker-touching tests mock it (test_artifact_qdrant_bootstrap.py:47).
    A digest-pinned, loopback-bound, read-only service definition already exists at workspace-tooling/services/qdrant/compose.yaml.
    Add an integration workflow that uses it and a test_end_to_end.py kept outside the unit discovery
    pattern.'
  priority: must
  lane: later
  size: L
  acceptance:
  - 'Given the integration workflow on pull_request (label `integration`), push to main and a nightly
    schedule, when it runs, then it generates throwaway QDRANT_API_KEY and QDRANT_READ_ONLY_API_KEY, brings
    up the compose file with --wait, and tears down with `docker compose down -v` under if: always().'
  - Given workspace-tooling/tests/integration/test_end_to_end.py, when it runs, then it ingests two fixture
    Markdown files through artifact_catalog.py and artifact_ingestion.py, runs artifact_qdrant_bootstrap.py,
    starts artifact_memory_service.py, issues a semantic search over the socket, and asserts the expected
    document ranks first.
  - Given a deliberately corrupted fixture whose content hash does not match its manifest, when the end-to-end
    test runs, then the pipeline fails closed and the test asserts the failure rather than a silent skip.
  - Given the integration tests, when `python -m unittest discover -s workspace-tooling/tests -p 'test_*.py'`
    runs, then the integration directory is NOT collected, so the unit suite stays hermetic.
  - Given workspace-tooling/README.md, when :83-87 is read, then it says the UNIT suite is hermetic and
    points at the integration job, rather than implying no service container is ever required.
  depends_on:
  - ci-proves-it-e1
  - gates-green-e4
  tags:
  - F157
  - ci
  - integration
  - qdrant
  - end-to-end
