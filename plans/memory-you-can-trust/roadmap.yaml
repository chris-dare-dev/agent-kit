- id: memory-you-can-trust-e2
  kind: epic
  title: A gold set a second engineer can run, wired to a CI non-regression gate
  status: planned
  summary: 'The retrieval eval harness is well built and completely unrunnable by anyone but its author:
    every default points at private local state (artifact_retrieval_eval.py:38-46), no tool in the repo
    produces a gold suite, and data/artifact-memory/evals/ — the directory the manifest gate at data/scripts/artifact-memory-eval-manifest-check.py:26-28
    targets — does not exist. This epic ships a public gold set derived from the repo''s own tracked Markdown,
    a gold-suite builder, a CI-runnable mode, a relevance suite for search_platform_knowledge, forgetting
    cases with a staleness metric, a self-contamination canary, and the first true end-to-end integration
    proof against a real Qdrant.'
  priority: should
  lane: later
  size: XL
  acceptance:
  - Given a bare clone with no private state, when `npm run eval:retrieval` runs, then it catalogs the
    repo itself, builds a throwaway generation and prints nDCG@10 and recall@10 per mode for every entry
    in artifact_retrieval_eval.MODES.
  - Given a pull request that changes any input to the retrieval profile digest, when CI runs, then the
    gold suite executes and the job fails if nDCG@10 or recall@10 regresses beyond the declared tolerance.
  - Given the nightly integration workflow, when it runs, then a real Qdrant is stood up from workspace-tooling/services/qdrant/compose.yaml
    and an end-to-end test proves catalog to outbox to embedding to upsert to socket search.
  - Given every file under data/artifact-memory/evals/ and data/evals/, when the canary check runs, then
    each contains the BIG-bench canary GUID and a test asserts none of them is reachable through the substrate's
    own ingestion.
  tags:
  - F045
  - F082
  - F091
  - F157
  - X020
  - X043
  - evals
  - gold-set
  - non-regression
