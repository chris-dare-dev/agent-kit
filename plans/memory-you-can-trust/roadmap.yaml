- id: memory-you-can-trust-t-gold-builder
  kind: task
  title: 'Ship the missing authoring half of the gold contract: artifact_gold_build.py'
  status: planned
  parent: memory-you-can-trust-e2
  summary: validate_gold (artifact_retrieval_eval.py:648-868) enforces a strict gold-suite contract —
    30 records per split, 20 answerable plus 10 negatives, exact span/revision/point-id judgments — and
    no tool in the repo produces one; `grep -rl retrieval-gold` matches only the eval and its tests. Add
    workspace-tooling/artifact_gold_build.py that samples spans from a span manifest, emits query stubs
    for human adjudication and writes the binding manifest, so a second engineer can build a suite for
    their own corpus rather than hand-writing point ids.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a span manifest sqlite3 file, when `artifact_gold_build.py --manifest <db> --out retrieval-gold-v2`
    runs, then it writes both .dev.json and .holdout.json plus the binding manifest, and the outputs pass
    validate_gold unmodified except for the adjudication fields.
  - Given a partially adjudicated suite, when the builder is re-run with --resume, then already-adjudicated
    queries are preserved verbatim and only unadjudicated stubs are regenerated.
  - Given the builder output, when it is checked against data/scripts/artifact-memory-eval-manifest-check.py,
    then the emitted manifest satisfies the SHA256, GOLD_VERSION and GENERATION regexes that check enforces
    at :33-35.
  - Given the builder, when `python workspace-tooling/artifact_gold_build.py --self-test` runs, then it
