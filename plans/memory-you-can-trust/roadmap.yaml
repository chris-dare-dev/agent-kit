  status: planned
  parent: memory-you-can-trust-e1
  summary: 'The research corrections flag this as never searched: the server already registers 17 read-only
    tools into every session, and this roadmap proposes to add recall, remember, forget, get_artifact_revision,
    reconcile and as-of variants. There is a live body of work on tool-count degrading selection accuracy
    and on progressive disclosure (one fan-out search tool versus N flat tools) whose conclusions likely
    contradict several recommendations here. Time-box the reading, then publish an ADR that fixes a maximum
    registered tool count and decides whether the four search primitives stay separately registered behind
    a fused recall or are consolidated.'
