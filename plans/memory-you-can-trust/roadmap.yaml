- id: memory-you-can-trust-e1
  kind: epic
  title: Retrieval you can configure, in any language, behind one signed profile digest
  status: planned
  summary: Retrieval today is four module constants, a hard 384-dimension/cosine assertion, an ASCII-only
    tokenizer on both the Python and TypeScript sides, a single chunking profile, and workspace scoping
    the caller is trusted to supply. This epic turns all of that into a versioned retrieval profile hashed
    into the existing ranking_contract() digest, so configurability arrives without losing the freeze
    guarantee. It also lands the fused recall entry point — but only after a spike settles how many tools
    the server may register, since that literature governs both this epic's recall design and the write
    tools in e4.
  priority: must
  lane: later
  size: XL
  acceptance:
  - Given a runtime config declaring any of the three shipped retrieval profiles, when the memory service
    starts, then it starts and reports the active profile_id and profile_digest — and `grep -nE '^(EMBEDDING_MODEL|RERANKER_MODEL|EMBEDDING_DIMENSIONS|QDRANT_SERVER_VERSION)
    *=' workspace-tooling/artifact_retrieval.py` returns no matches.
  - Given a corpus containing one CJK and one accented-Latin document, when the Python FTS5 index and
    the TypeScript inverted index are both queried with a term from each, then both return a non-zero
    lexical hit (today both return zero).
  - Given a query carrying a scope filter, when it reaches Qdrant, then the ACORN query-time flag is set,
    the scope/type/tier payload indexes exist, and the workspace_id must-clause was injected by the service
    rather than the caller.
  - Given the ADR produced by memory-that-earns-it-spike-1 declares a maximum registered tool count, when
    `npm test` runs, then the tool-budget test fails if the server registers more tools than the ADR permits.
