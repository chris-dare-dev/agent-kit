- id: memory-you-can-trust-t-acorn-payload-indexes
  kind: task
  title: Enable ACORN on filtered searches and create the payload indexes those filters require
  status: planned
  parent: memory-you-can-trust-e1
  summary: Any scope-, tier- or type-aware query is a low-selectivity filtered vector search, which is
    the documented case where HNSW gets disconnected and recall collapses. Qdrant 1.16 ships ACORN for
    exactly this. Pass the ACORN query-time flag on every query carrying a filter, and create keyword
    payload indexes on the scope, artifact_type and tier fields at bootstrap time — extending _ensure_qdrant_payload_indexes,
    which artifact_ingestion.py:1238-1243 already calls during reconcile.
  priority: must
  lane: later
  size: S
  acceptance:
  - Given a search request carrying any filter, when the Qdrant query is constructed, then the ACORN flag
    is set — asserted by a unit test that captures the outgoing query params and fails when the flag is
    absent.
  - Given a fresh collection, when `artifact_qdrant_bootstrap.py` completes, then get_collection reports
    keyword payload indexes on scope, artifact_type and tier, asserted in the nightly integration job.
  - Given the filtered-recall gold case added by this task, when the gold suite runs, then recall@10 for
    the filtered query is reported separately and gated, so a regression here fails rather than being
    assumed away.
  - Given ACORN is unavailable on the connected server version, when a filtered query runs, then the service
