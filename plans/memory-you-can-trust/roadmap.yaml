  - filtered-search
  - memory
- id: memory-you-can-trust-t-workspace-scoping
  kind: task
  title: Enforce workspace scoping inside the service as a must-clause the caller cannot omit
  status: planned
  parent: memory-you-can-trust-e1
  summary: Scoping today is a binary SERVER_PROFILE=shared|personal switch, which is not scoping at all.
    Add a workspace_id payload field indexed as keyword with is_tenant set, one collection per embedding
    model, and inject the workspace filter as a must-clause inside artifact_memory_service.py — so a caller
    cannot omit it and a compromised tool cannot bypass it. Mirror the scope in the catalog rows and the
