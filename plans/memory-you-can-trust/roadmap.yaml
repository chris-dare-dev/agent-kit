- id: memory-you-can-trust-t-unicode-lexical
  kind: task
  title: Make lexical retrieval Unicode-aware on both the Python and TypeScript sides
  status: planned
  parent: memory-you-can-trust-e1
  summary: 'artifact_retrieval.py:46 tokenizes with `[A-Za-z0-9][A-Za-z0-9_.:/@-]{0,127}`, so every CJK,
    Cyrillic, Greek, Arabic and accented-Latin token is discarded before the FTS5 query is built at :189-197,
    and the 40-word English stopword list at :47-90 is hardcoded. src/search/indexer.ts:82 has the identical
    defect: `normalized.replace(/[^a-z0-9-]/g, '' '')` strips every non-ASCII character. Replace both
    with Unicode-property-aware tokenization plus a CJK bigram fallback, move STOPWORDS into the retrieval
    profile so it swaps per language, and enable FTS5 unicode61 with remove_diacritics 2.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a corpus containing a Japanese document and a French accented document, when the Python lexical
    leg is queried with a term from each, then both return a non-zero BM25 hit — asserted by workspace-tooling/tests/test_artifact_retrieval_i18n.py,
    which fails against HEAD.
  - Given the same two documents indexed by src/search/indexer.ts, when search() is called with a CJK
    term and with an accented term, then both return the document — asserted by src/search/indexer.i18n.test.ts
    run under `npm test`.
  - 'Given a profile declaring stopwords_lang: fr, when the tokenizer runs, then the French stopword list
    is applied and `grep -n ''STOPWORDS = {'' workspace-tooling/artifact_retrieval.py` shows the set is
    loaded from the profile rather than declared inline.'
  - Given the FTS5 table is created, when its schema is dumped, then the tokenizer clause reads `unicode61
    remove_diacritics 2`, and a query for 'resume' matches a document containing 'résumé'.
  depends_on:
  - memory-you-can-trust-t-retrieval-profile
  tags:
  - F043
  - i18n
  - lexical
  - tokenizer
  - memory
- id: memory-you-can-trust-t-bm25-ts
  kind: task
  title: Replace the TypeScript term-frequency scorer with real BM25 and export a matching ranking contract
  status: planned
  parent: memory-you-can-trust-e1
  summary: src/search/search.ts computes IDF per query term but scores with raw term frequency plus a
    flat 3x title boost and a multiplicative match-ratio factor (`rawScore * (1 + matchRatio)` at :217)
    — there is no term-frequency saturation and no document-length normalisation, so a long document beats
    a short exact match on volume alone. Rewrite the scorer as BM25 (k1=1.2, b=0.75) over per-field indexes
    with document-length normalisation, matching the FTS5 column weighting the Python side already uses
    (FTS_BM25_WEIGHTS at artifact_retrieval.py:37). Export a rankingContract() from TypeScript in the
    same shape as the Python one so both surfaces are provably one ranking system.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a short document containing the query term twice and a 50x-longer document containing it eight
    times, when search() ranks them, then the short document ranks first — asserted by a case in src/search/search.test.ts
    that fails against HEAD.
  - Given the BM25 implementation, when `npm test` runs, then a test asserts k1 and b are read from a
    single exported constant object and that scores are finite and monotonic in term frequency with saturation
    (doubling TF must increase the score by less than 2x).
  - Given the TypeScript index, when rankingContract() is called, then it returns bm25_k1, bm25_b, field_weights,
    tokenizer_id and a contract digest, and a cross-language test asserts the field-weight vector equals
    FTS_BM25_WEIGHTS in workspace-tooling/artifact_retrieval.py.
  - Given the search relevance suite from memory-that-earns-it-t-search-relevance-suite, when it runs
    before and after this change, then recall@3 and MRR are printed for both and the committed baseline
    is updated in the same commit.
  depends_on:
  - gates-green-e2
  tags:
  - X016
  - bm25
  - search
  - mcp-server
