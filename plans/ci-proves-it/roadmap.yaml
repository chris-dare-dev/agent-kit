    `coverage-baseline.txt`. This lands last in the epic on purpose: a coverage number taken while 333
    of 593 Python tests fail to collect is meaningless, so it must follow M2''s collection fixes. Do not
    claim this measures goal F.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given the repo at HEAD, when `npm run test:coverage` is run, then coverage/lcov.info is produced and
    reports a non-zero line-coverage percentage for src/.
  - Given the substrate suite, when `coverage run -m unittest ... && coverage report --fail-under=$(cat
    coverage-baseline.txt)` is run on ubuntu, then it exits 0.
  - Given a PR that deletes tests without deleting code, when CI runs, then the coverage step fails because
    the measured percentage dropped below the committed baseline.
  - Given the coverage baseline file, when it is read, then a header comment states the date, the platform
    it was measured on, and that it is a goal-A signal and explicitly not a goal-F ROI measurement.
  depends_on:
