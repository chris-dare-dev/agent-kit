- id: ci-proves-it-e1
  kind: epic
  title: Cross-OS CI matrix with lint, type and coverage gates
  status: planned
  summary: The repository has no .github/ directory at all — no workflow, no CI configuration of any kind
    — so every suite, every gate and every portability fix is enforced only by the maintainer's memory.
    This epic lands .github/workflows/ci.yml running {ubuntu-latest, macos-latest, windows-latest} x {node
    20, 22} for build and test plus a python-3.12 job for the substrate, adds eslint/ruff/mypy/shellcheck
    as non-blocking-then-required steps with committed violation baselines, makes the only goal-F performance
    harness runnable off macOS, and establishes a coverage ratchet — deliberately here and not earlier,
    because a coverage number taken while 333 of 593 Python tests fail to collect is meaningless.
  priority: must
  lane: now
  size: L
  acceptance:
  - Given a clone at the M3 HEAD, when `ls .github/workflows/`, then ci.yml exists and `gh workflow list`
    shows it enabled.
  - Given a push to any branch, when the ci workflow completes, then the `build-test` job reports success
    on all six {ubuntu-latest, macos-latest, windows-latest} x {node 20, 22} legs and the `substrate`
    job reports success on the ubuntu-3.12 and macos-3.12 legs.
  - Given the Windows leg, when it runs, then `npm test` executes (it does not skip) and the run log shows
    the artifact-memory suite either passing or explicitly skipped with a named per-platform reason —
    never silently absent.
  - Given `npm run lint`, `npm run typecheck` and `ruff check` run locally, when each is invoked, then
    each exits 0 against its committed baseline file.
  - Given `python -m unittest` is replaced by `npm run test:py`, when a contributor runs `npm run test:py`
    on macOS, Linux or WSL, then it runs the identical command CI runs (verified by grepping the workflow
    for the script name rather than an inline incantation).
  depends_on:
