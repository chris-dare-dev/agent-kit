- id: ci-proves-it-t-aidefence-rules-as-data
  kind: task
  title: Move the AIDefence ruleset to data/ with env overrides so adopters tune rather than fork
  status: planned
  parent: ci-proves-it-e4
  summary: 'The rules are compiled TypeScript constants: src/security/aidefence-rules.ts:92-236 hard-codes
    25 injection, 5 traversal, 8 command-injection and 8 PII rules with `RULESET_VERSION = "1.0.0-tightened"`
    frozen at line 27. There is no loader, no external rules file and no suppression mechanism, so a team
    hitting a false positive must fork, edit TypeScript, `npm run build` and restart every session. The
    file''s own header at :16-23 makes the problem explicit — it instructs deployments to ''re-add their
    own internal domains here (and to the regex below) and re-measure'', which is a source-edit-as-configuration
    instruction. Move the rule table to `data/security/aidefence-rules.json` with the schema `{id, cls,
    sub, severity, pattern, flags}` plus a top-level `rulesetVersion`, and load it at startup in src/security/aidefence.ts
    behind a strict validator (reject unknown classes, reject unbounded quantifiers, cap pattern length).
    Add `AIDEFENCE_RULES_PATH` and `AIDEFENCE_SUPPRESS=PI-20,CI-01` env overrides plus an allowlist block
    for internal email domains and account ids. Keep the current constants as the built-in default so
    behaviour is unchanged when nothing is configured, and keep the byte-faithful patterns that carry
    explicit do-not-touch comments (PT-01T at :172-177 and CI-01 at :190-191).'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given no AIDefence env vars set, when the full src/security/aidefence.test.ts suite runs, then every
    existing assertion passes unchanged — the default behaviour is byte-identical to the compiled constants.
  - Given `AIDEFENCE_RULES_PATH` pointing at a file with an unknown `cls` value or a pattern longer than
    the cap, when the server starts, then it refuses to load that ruleset and logs one structured line
    naming the offending rule id.
  - Given `AIDEFENCE_SUPPRESS=CI-01`, when the benign query at src/security/guard.test.ts:47-53 is scanned,
    then CI-01 does not match while every other rule still evaluates.
  - Given an allowlist entry for an internal mail domain, when a message containing that domain is scanned,
    then PII-01 does not fire — and the aidefence-rules.ts:16-23 header instruction to edit source is
    replaced by a pointer to this configuration.
  - Given data/security/aidefence-rules.json, when the data-gates workflow runs, then a schema-validation
    step asserts the file parses against its committed JSON Schema.
  depends_on:
  - gates-green-e2
  tags:
  - F139
  - security
  - aidefence
  - packs
- id: ci-proves-it-t-guard-per-class-enforcement
  kind: task
  title: Replace the enforce/log dilemma with per-class enforcement, a severity floor and real soak telemetry
  status: planned
  parent: ci-proves-it-e4
  summary: 'Out of the box the guard blocks nothing: `resolveGuardMode` (src/security/guard.ts:40-46)
    returns ''log'' unless the profile is `shared` or `AIDEFENCE_GUARD_MODE === ''enforce''`, and the
    default profile is ''personal''. src/index.ts:186-189 then instructs operators not to change that
    (''do NOT set AIDEFENCE_GUARD_MODE=enforce ... without first reviewing the log-mode FP soak'') while
    no soak tooling ships — the only artifact is a `process.stderr.write` at src/index.ts:676-680, with
    no aggregation, no rate and no exit criterion. The reason enforce is unsafe is real and encoded as
    a passing test: guard.test.ts:47-53 ''KNOWN enforce FP: a benign query quoting $(...) blocks under
    CI-01''. Two changes. (1) Add `AIDEFENCE_ENFORCE_CLASSES` and `AIDEFENCE_ENFORCE_MIN_SEVERITY` read
    in resolveGuardMode so a deployment can enforce prompt_injection:critical plus path_traversal while
    leaving CI-01 in log mode. (2) Ship the soak: have TokenLogger record guard matches as structured
    JSONL fields (ruleId, class, tool, blocked) instead of the stderr-only line, and extend `get_token_stats
    {mode:"detail"}` (src/tools/token-stats.ts, which today has zero guard handling) with a guard section
    reporting match rate per rule per 1k calls. Write the ramp exit criterion into README as a number.'
  priority: must
  lane: next
  size: M
  acceptance:
  - Given AIDEFENCE_ENFORCE_CLASSES=prompt_injection,path_traversal, when the benign query at src/security/guard.test.ts:47-53
    is submitted, then it is not blocked; and when a critical prompt-injection payload is submitted, then
    it is blocked with the rule id in the error.
  - Given AIDEFENCE_ENFORCE_MIN_SEVERITY=critical, when a high-but-not-critical match occurs in an enforced
    class, then it is logged and not blocked — asserted by a new unit test on resolveGuardMode.
  - Given a session with guard matches, when `get_token_stats {mode:"detail"}` is called, then the response
    contains a guard section reporting per-rule match counts and a rate per 1k calls.
  - Given the token log after a guard match, when the JSONL is read, then the entry carries ruleId, class,
    tool and blocked as structured fields — `grep -c 'AIDEFENCE' <log>` on stderr is no longer the only
    record.
  - 'Given README.md, when the guard ramp section is read, then it states a numeric exit criterion (for
    example: flip a rule to enforce when its 7-day match rate is below 0.1% and every match was manually
    confirmed a true positive).'
  depends_on:
  - ci-proves-it-t-aidefence-rules-as-data
  - ci-proves-it-t-ts-state-file-hardening
  tags:
  - F140
  - security
  - aidefence
  - mcp-server
- id: ci-proves-it-t-output-side-gate
  kind: task
  title: Scan and provenance-fence served content, and wire the orphaned PII engine into that gate
  status: planned
  parent: ci-proves-it-e4
  summary: 'The server''s entire function is to load Markdown from directories it does not control and
    emit it into an agent''s context — src/index.ts:55-67 discovers skills/agents/references from `WORKSPACE_ROOT/.claude/*`
    and CLAUDE.md files anywhere under PLATFORM_ROOT/WORKSPACE_ROOT, and src/discovery/skills.ts:44-58
    reads any SKILL.md it finds with no validation. Every handler returns that content verbatim (src/tools/references.ts:52,
    src/tools/search.ts:44-50, src/tools/artifact-memory.ts:455-540). The only defence, `guardToolInput`
    at src/index.ts:637, scans `JSON.stringify(argObj)` — the agent''s own query — and never touches `outputText`
    at :793; the comment at :631-632 states the mistaken model explicitly. Separately, src/security/aidefence.ts:102-128
    implements `hasPii` carefully and `scan()` computes `pii` on every call at :166, but guard.ts:75-94
    discards `result.pii` entirely — a repo-wide grep finds zero non-test consumers, and guard.ts:22-23
    explains why by referring to `wiki.ts`, which does not exist in this repo. Add `guardToolOutput(text,
    tier)` in src/security/guard.ts reusing `scan()`, call it in src/index.ts immediately after `const
    outputText = ...` and before `responseCache.record`, and on a SAFETY match wrap rather than drop:
    emit the content inside an explicit untrusted-data fence (for example `<untrusted-content source="skills/foo"
    tier="workspace">`) plus a one-line notice naming the matched rule, logged symmetrically with the
    input-side line at :676-680. Redact PII matches to `[redacted:PII-05]`. Tag every served block with
    its discovery tier (bundled data/ vs WORKSPACE_ROOT/.claude vs artifact-memory) — artifact_retrieval.py:1184
    already sets `untrusted_content`, so extend the same idea to references.ts, skills.ts, memory.ts and
    search.ts. Correct the rationale comment at src/index.ts:631-632 and guard.ts:22-23, and delete the
    `src/tools/wiki.test.ts` entry from data/scripts/secret-scan-allowlist.json:52-56 which makes the
    allowlist unverifiable against a nonexistent file.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given a fixture skill under a temporary WORKSPACE_ROOT containing an injected instruction, when `get_skill`
    is called for it, then the response body is wrapped in an untrusted-content fence naming the discovery
    tier and the matched rule id — asserted by a new test using the existing mcp-contract fixture harness.
  - Given a fixture reference containing a `sk-ant-` shaped token, when it is served, then the token is
    replaced by `[redacted:PII-xx]` in the response and the original is never written to the response
    cache.
  - Given `grep -rn 'hasPii' src/ --include='*.ts' | grep -v '\.test\.'`, when run after this task, then
    it shows a call site in the output-side gate, not only the definition.
  - Given src/security/guard.ts:22-23 and src/index.ts:631-632, when read after this task, then neither
    refers to a nonexistent wiki.ts and both describe the output-side gate that now exists.
  - Given `python data/scripts/secret-scan.py --check`, when run after removing the src/tools/wiki.test.ts
    allowlist entry, then it exits 0 and the allowlist contains no entry pointing at a nonexistent file.
  - Given a clean served response with no matches, when it is emitted, then it is byte-identical to today's
    output apart from the tier tag — the gate adds no noise on the happy path.
  depends_on:
  - ci-proves-it-t-aidefence-rules-as-data
  - gates-green-e2
  tags:
  - F131
  - F136
  - security
  - mcp-server
  - aidefence
- id: ci-proves-it-t-graphiti-loopback-fence
  kind: task
  title: Loopback-fence the Graphiti LLM, embedding and FalkorDB endpoints, gated on the M1 Graphiti decision
  status: planned
  parent: ci-proves-it-e4
  summary: 'The substrate has exactly one rigorous egress validator — `require_loopback_qdrant_url` (workspace-tooling/artifact_ingestion.py:874-895)
    rejects any non-127.0.0.1 host, any credential in the URL, any query or fragment. The Graphiti path
    has nothing equivalent: graphiti_pilot.py:993 declares `--llm-base-url` as a free-form argparse string
    and `_run_cases_async` at :626-704 feeds it straight into `AsyncOpenAI(base_url=...)` and `OpenAIEmbedderConfig(base_url=...)`;
    the only mention of loopback at :663-667 merely decides whether an API key is required. So `graphiti_pilot.py
    apply --llm-base-url https://api.openai.com/v1` ships canonical Markdown chunk bodies off the machine,
    falsifying README.md:22-25''s ''Nothing leaves the machine'' for the exact tier goal D names. Extract
    `artifact_runtime.require_loopback_http_url(url, label)` modelled on the Qdrant validator and apply
    it to `--llm-base-url` and `--embedding-base-url` in graphiti_pilot.py (parser :993-998, consumed
    in _run_cases_async) and artifact_ingestion.py (:2069-2074, :2097-2100), defaulting to reject. Gate
    any non-loopback value behind an explicit `--allow-remote-llm` flag that requires a justification
    string recorded in the run''s evidence JSON and forces every episode body (`_graphiti_episode_body`,
    artifact_ingestion.py:1425-1436) through PII redaction first. Make `_require_falkordb_endpoint` (:1438-1446)
    reject non-loopback hosts by default. Amend README.md:25. THIS TASK IS CONDITIONAL: if M1''s owner
    decision retired the Graphiti pilot, close it as not-applicable and delete the dead paths instead.'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given the M1 Graphiti decision retained the pilot, when `graphiti_pilot.py run --llm-base-url https://api.openai.com/v1`
    is invoked without `--allow-remote-llm`, then it exits non-zero naming the rejected host and the flag
    required to override.
  - Given `--allow-remote-llm` without a justification string, when the command runs, then it exits non-zero;
    and with a justification, then the run's evidence JSON contains the justification verbatim.
  - Given `--allow-remote-llm` with a justification, when an episode body is built, then it passes through
    PII redaction before any outbound call — asserted by a test that injects a `sk-ant-` shaped token
    and observes the redacted form in the request payload.
  - Given a non-loopback FalkorDB endpoint, when `_require_falkordb_endpoint` is called without an explicit
    override, then it raises.
  - Given README.md:22-25, when read after this task, then it states 'nothing leaves the machine by default'
    and names the single flag that changes that.
  - Given the M1 decision retired the pilot instead, when this task closes, then `grep -rn 'graphiti'
    src/ workspace-tooling/ --include='*.py' --include='*.ts' | grep -v test` returns only removal-notice
    comments.
  depends_on:
  - starts-everywhere-e3
  tags:
  - F137
  - security
  - memory
  - egress
