    \"src/**/*.test.ts\""` and run it on the ubuntu/node-22 leg only. On the Python side add `coverage`
    to workspace-tooling/requirements-dev.txt and a `.coveragerc` with `[run] source = workspace-tooling`
    / `omit = */tests/*`, running `coverage run -m unittest ... && coverage xml` on the ubuntu/3.12 leg.
