- id: ci-proves-it-t-mypy-baseline
  kind: task
  title: Add mypy over a declared module allowlist with a committed error baseline and a ratchet
  status: planned
  parent: ci-proves-it-e1
  summary: 'Type-checking 46 flat modules on a hand-set PYTHONPATH all at once is not landable in one
    step, and the packaging that would make it tractable is M4 work. Scope mypy narrowly and honestly:
    add `mypy.ini` (or a `[tool.mypy]` block once a config file exists) configured with `python_version
    = 3.12`, `warn_unused_ignores`, and an explicit `files =` allowlist starting with the data/scripts
    generator modules that CI already gates (`catalog-generate.py`, `generate-adapter-packs.py`, `generate-root-contract.py`,
    `model-policy-apply.py`, `skill-ref-check.py`). Commit `mypy-baseline.txt` with the current error
    count, run the step non-blocking for one release cycle then required, and document in CONTRIBUTING.md
    that adding a module to the allowlist is a one-way ratchet.'
  priority: could
  lane: later
  size: M
  acceptance:
  - Given the repo at HEAD, when `mypy` is run with the committed config, then the error count is less
    than or equal to the value in `mypy-baseline.txt`.
  - Given a PR that introduces a new type error in one of the allowlisted generator modules, when CI runs,
    then the mypy step fails and names the module and line.
  - Given CONTRIBUTING.md, when the static-analysis section is read, then it states the allowlist ratchet
    rule and lists which modules are currently covered.
  - Given a module removed from the allowlist in a PR, when CI runs, then the step fails (the allowlist
    may only grow) — verified by a test PR.
  depends_on:
