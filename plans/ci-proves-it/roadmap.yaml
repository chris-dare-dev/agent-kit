- id: ci-proves-it-t-eslint-typecheck-gate
  kind: task
  title: Add eslint + a typecheck script that covers test files, with a committed violation baseline
  status: planned
  parent: ci-proves-it-e1
  summary: 'There is no ESLint, Prettier or formatter config anywhere; the only static gate is `npm run
    build` (tsc), and tsconfig.json:17 excludes `src/**/*.test.ts` so roughly 1,500 lines of TypeScript
    test code are never type-checked. Add `eslint.config.js` (flat config) with `@typescript-eslint` recommended
    plus `no-floating-promises` and `no-misused-promises` (both require type-aware linting, so wire `parserOptions.projectService`),
    add `eslint` and `typescript-eslint` to devDependencies, add `"lint": "eslint src"`, and add `"typecheck":
    "tsc -p tsconfig.test.json --noEmit"` with a tsconfig that extends the root config but does not exclude
    test files. Record the initial violation count in a committed `.lint-baseline.json` so the number
    can only go down; run the step with `continue-on-error: true` for exactly one release cycle, then
    flip it required.'
  priority: must
  lane: next
  size: M
  acceptance:
  - Given the repo at HEAD, when `npm run lint` is run, then it exits 0 and the reported error count is
    less than or equal to the number in the committed baseline file.
  - Given `npm run typecheck`, when it is run, then tsc reports on `src/**/*.test.ts` as well as `src/**/*.ts`
    (verified by deliberately introducing a type error in a test file and observing a non-zero exit),
    and exits 0 on clean HEAD.
  - Given ci.yml, when the lint job runs, then `lint` and `typecheck` appear as separately named steps
    so a failure in either is attributable without reading the log.
  - Given a PR that adds a new floating promise in src/, when CI runs, then the lint step fails and names
    the file and rule id.
  depends_on:
  - ci-proves-it-t-ci-node-matrix
  tags:
  - F166
  - X005
  - ci
  - lint
  - typescript
- id: ci-proves-it-t-ruff-shellcheck-gate
  kind: task
  title: Add ruff over the Python tree and shellcheck over the 29 tracked shell scripts, each with a baseline
  status: planned
  parent: ci-proves-it-e1
  summary: 'No linter exists for the bulk of the codebase: ~46 workspace-tooling modules plus 38 data/scripts
    modules have no static analysis, and none of the tracked shell scripts is shellchecked. The concrete
    cost is measurable — the ~189 encoding-less `read_text()`/`write_text()` calls and the 10 POSIX-only
    `import fcntl` sites are exactly what a linter settles mechanically. Add a root `ruff.toml` selecting
    at minimum E, F, I, UP and PLW1514/W1514-equivalent (unspecified-encoding), create `workspace-tooling/requirements-dev.txt`
    pinning ruff, and add `ruff check workspace-tooling data/scripts` as a named CI step. Add a `lint-shell`
    job running `shellcheck -S warning` over `data/scripts/*.sh tests/**/*.sh setup-local.sh data/hooks/*.sh`.
    Commit baseline violation counts for both so they can only decrease.'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given the repo at HEAD, when `ruff check workspace-tooling data/scripts` is run, then the violation
    count is less than or equal to the committed `ruff-baseline.txt` value and the command exits 0 under
    the baseline comparison wrapper.
  - Given a newly added `read_text()` call with no `encoding=` argument in data/scripts/, when ruff runs,
    then it reports the unspecified-encoding rule and the CI step fails.
  - Given `shellcheck -S warning` over the tracked script set, when the lint-shell job runs, then it exits
    0 against the committed shell baseline, and `shellcheck --version` is pinned in the workflow rather
    than floating.
  - Given ci.yml, when the lint jobs are inspected, then `ruff` and `shellcheck` are separate named steps
    and both are listed in CONTRIBUTING.md's required-check set.
  depends_on:
  - ci-proves-it-t-ci-python-job
  tags:
