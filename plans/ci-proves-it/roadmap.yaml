- id: ci-proves-it-t-ts-state-file-hardening
  kind: task
  title: Create the token log and cache snapshot 0600, write them atomically, and refuse an untrusted
    snapshot on restore
  status: planned
  parent: ci-proves-it-e3
  summary: 'The Python side enforces owner-only 0600/0700 on every derived file (artifact_security.py:108-122);
    the TypeScript side enforces nothing. TokenLogger writes via `appendFile(this.logPath, ...)` (src/logging/token-logger.ts:343)
    with no mode and no chmod — the constructor at :221-236 only mkdirs — so the log lands world-readable
    under the common umask, and under the default `personal` profile it contains a raw preview of every
    tool argument. The cache snapshot at `$WORKSPACE_ROOT/.claude/mcp-cache-snapshot.jsonl` (src/config.ts:123-140,
    written by writeCacheSnapshotSync/Async at src/index.ts:261-288) is equally unprotected and is trusted
    on restore (src/cache/response-cache.ts:211-221 validates only field types). Both are also full-file
    rewrites at one fixed path per workspace, so two Claude Code windows on the same workspace clobber
    each other. Fix all three: create both files with `openSync(path, ''a'', 0o600)` / chmod to 0600,
    write via `${path}.${process.pid}.tmp` + fsync + rename, and on restore lstat the snapshot and refuse
    it when it is a symlink, is not owned by the current uid, or has group/other bits — the ownership
    walk at src/tools/artifact-memory.ts:219-245 is the in-repo model to copy. Shard per pid (with a startup
    merge-and-prune older than RESTORE_MAX_AGE_MS) or take an O_EXCL advisory lock so the loser skips
    its write.'
  priority: must
  lane: now
  size: M
  acceptance:
  - Given the server started under the default profile with umask 022, when it writes the token log and
    cache snapshot, then `stat -c '%a'` reports 600 for both on POSIX (and the Windows equivalent grants
    only the current user).
  - Given a group-readable or symlinked cache snapshot placed at the configured path, when the server
    starts, then it refuses to restore from it and logs one structured line naming the reason — asserted
    by a new test under src/cache/.
  - Given two writer processes started against the same workspace, when both run for 60 seconds and exit,
    when the merged result is read, then no entry written by either is lost and no partially-written line
    is ever observed — asserted by a new concurrency test.
  - Given a kill -9 mid-write, when the file is read afterwards, then it parses as valid JSONL (the temp-file-plus-rename
    discipline never exposes a truncated target).
  - Given `npm test`, when it runs after this task, then the new privacy and concurrency tests are included
    in the glob and pass on ubuntu, macOS and Windows.
  depends_on:
  - gates-green-e2
  tags:
  - F141
  - F128
  - security
  - mcp-server
  - concurrency
- id: ci-proves-it-t-credential-rotation-policy
