- id: ci-proves-it-t-portable-perf-probe
  kind: task
  title: Make artifact_memory_load_test.py portable so the only goal-F performance evidence can run in
    the matrix
  status: planned
  parent: ci-proves-it-e1
  summary: 'workspace-tooling/artifact_memory_load_test.py is the closest thing the repo has to reproducible
    performance evidence for the memory plane, and `_process()` at lines 57-63 shells out to a hardcoded
    `["/bin/ps", "-p", str(pid), "-o", "rss=,%cpu="]` parsing BSD ps column output, with no `shutil.which`
    lookup and no alternative. There is no `/bin/ps` on Windows, and on Linux ps lives at /bin/ps or /usr/bin/ps
    depending on usrmerge state with a different `%cpu=` no-header form between procps and BSD ps. Replace
    the subprocess with a portable RSS/CPU probe: add `psutil` to workspace-tooling/requirements-artifact-ingestion.txt
    (and the per-platform locks) and read `psutil.Process(pid).memory_info().rss` and `.cpu_percent()`,
    falling back behind the platform-compat module M2 introduces. Emit the harness output as a versioned
    JSON record carrying platform, interpreter version and transport used, so results measured on different
    OSes are explicitly labelled rather than silently compared.'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given workspace-tooling/artifact_memory_load_test.py at HEAD, when `grep -n '/bin/ps' workspace-tooling/artifact_memory_load_test.py`
    is run, then it returns nothing.
  - Given a Linux runner with no `/bin/ps` on PATH, when the harness runs against a live service, then
    it reports non-zero RSS and CPU for the target pid rather than raising FileNotFoundError.
  - Given the harness output, when the emitted JSON is inspected, then it contains `schema_version`, `platform`,
    `python_version` and `transport` fields, and two records from different platforms are distinguishable
    without out-of-band knowledge.
  - Given the ci workflow, when the nightly or on-demand perf leg runs on ubuntu-latest, then the harness
    completes and uploads its JSON as a workflow artifact.
  depends_on:
  - gates-green-e4
  tags:
  - F017
  - ci
  - performance
  - portability
- id: ci-proves-it-t-coverage-ratchet
  kind: task
  title: Add coverage measurement for both languages and a ratchet seeded from a committed baseline
  status: planned
  parent: ci-proves-it-e1
  summary: 'There is no `.coveragerc`, `pyproject.toml`, `setup.cfg`, `tox.ini`, `pytest.ini` or `.nycrc`,
