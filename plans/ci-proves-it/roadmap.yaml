- id: ci-proves-it-t-ci-node-matrix
  kind: task
  title: Create .github/workflows/ci.yml with the node build/test matrix over three OSes and two node
    versions
  status: planned
  parent: ci-proves-it-e1
  summary: 'Create the repository''s first workflow. `.github/workflows/ci.yml` gets a `build-test` job
    with `strategy.matrix.os: [ubuntu-latest, macos-latest, windows-latest]` and `node: [20, 22]`, `fail-fast:
    false`, running `npm ci`, `npm run build`, `npm test` and `npm run typecheck`. Triggers: `push` (all
    branches) and `pull_request`. This is only landable after M1 fixes the win32 startup throw and M2
    widens `npm test` from the three explicitly named files at package.json:13 to the full `src/**/*.test.ts`
    glob — otherwise the Windows leg lands red on day one for reasons unrelated to CI. Concurrency group
    cancels superseded runs on the same ref. Set `permissions: contents: read` at workflow level.'
  priority: must
  lane: now
  size: M
  acceptance:
  - Given .github/workflows/ci.yml at HEAD, when `python -c "import yaml,sys; d=yaml.safe_load(open('.github/workflows/ci.yml'));
    print(d['jobs']['build-test']['strategy']['matrix'])"` is run, then it prints os values ubuntu-latest,
    macos-latest and windows-latest and node values 20 and 22, and `fail-fast` is false.
  - Given a push, when the workflow completes, then all six build-test legs are green and the run summary
    shows `npm test` executed a test-file count equal to `ls src/**/*.test.ts | wc -l` (8 at time of writing)
    on every leg.
  - Given the win32 reproduction from F001/F107 (`node dist/index.js` under the default SERVER_PROFILE=personal),
    when the windows-latest leg runs the mcp-contract suite, then the suite passes rather than dying at
    `absoluteSocketPath()` — the regression fence for the startup throw is now executed by CI on every
    push.
  - Given the workflow file, when `grep -n 'uses:' .github/workflows/ci.yml` is run, then every third-party
    action reference is a 40-char commit SHA (enforced by the supply-chain task in e3, asserted here as
    a review checklist item).
  - Given two pushes to the same branch within the run window, when the second starts, then the first
    is cancelled by the `concurrency` block rather than both consuming runner minutes.
  depends_on:
  - starts-everywhere-e2
  - gates-green-e2
  tags:
  - F013
  - F094
  - F148
  - F172
  - X005
  - ci
  - matrix
