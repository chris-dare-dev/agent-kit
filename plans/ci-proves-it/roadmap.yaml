schema: roadmap/1
slug: ci-proves-it
project: agent-kit
title: M3 CI Proves It — cross-OS enforcement, governance, and a security posture that actually enforces
status: draft
phase: sequenced
brief: 'M3 turns M1''s working server and M2''s green gates into properties a machine defends. It adds
  the repo''s first `.github/`: a {ubuntu, macOS, Windows} x {node 20, 22} matrix plus a python-3.12 substrate
  job, and a data-gates workflow that runs all 25 `--self-test` entrypoints, the four `--check` gates
  and the four shell harnesses as individually named, attributable steps — with eslint/ruff/mypy/shellcheck
  and a coverage ratchet landing non-blocking then required.

  It publishes the governance layer an enterprise OSS intake literally greps for (CONTRIBUTING, SECURITY
  with private reporting, CODE_OF_CONDUCT, CODEOWNERS, issue forms, a ruleset on main) plus ADR-002, ADR-010
  and the backup/DR policy — cited normatively by 27 code sites and present nowhere in the tree.

  It hardens the supply chain: SHA-pinned actions, zizmor, CodeQL, dependabot, per-platform hash-pinned
  Python locks, committed ONNX snapshot digests verified at load, and 0600 atomic writes for the token
  log and cache snapshot.

  And it makes the security posture enforce rather than assert: one Node implementation of the four PreToolUse
  guards that no longer fails open when bash or jq is missing, a written threat model, per-class enforcement
  with a severity floor, and an output-side gate that scans what the server serves rather than only what
  the caller asks.

  Finally it retires the phantom-CI class of defect — after this milestone nothing in the tree may claim
  a `.gitlab-ci.yml` or a `data-lint` job again, and a grep gate keeps it that way.'
goal:
  hmw: How might we make every enforcement claim this repository already prints — gated in CI, digest-checked,
    fails closed — literally true on every push, on all three operating systems, while the solo maintainer
    is asleep?
  objective: 'Establish machine enforcement of the truth M1 and M2 made green: a cross-OS CI matrix that
    runs every suite and every gate, a governance and supply-chain layer a large engineering team can
    intake, and a security posture whose controls actually fire on the platforms the project claims to
    support.'
  key_results:
  - Every push runs `npm ci && npm run build && npm test` green on all six {ubuntu-latest, macos-latest,
    windows-latest} x {node 20, 22} legs, and the Windows leg executes the full `src/**/*.test.ts` glob
    rather than skipping it.
  - The data-gates workflow runs all 25 `--self-test` entrypoints (`grep -l -- --self-test data/scripts/*.py
    | wc -l` == 25), the four generator `--check` gates and all four shell harnesses as individually named
    steps, with zero steps reporting SKIP.
  - '`grep -rn ''gitlab-ci|data-lint|install-cilint-hook'' data/ workspace-tooling/ src/ README.md` returns
    0 hits, and a committed regression gate fails any PR that reintroduces one.'
  - '`grep -hn ''uses:'' .github/workflows/*.yml` shows 100% of third-party actions SHA-pinned; zizmor,
    CodeQL, dependabot and `npm audit --omit=dev --audit-level=high` all pass on clean HEAD.'
  - Every one of the 27 ADR-002 / ADR-010 / DR-policy citations resolves to a committed docs/ file with
    a stable anchor, enforced by a docs link-check gate that fails on a broken anchor.
  - On a windows-latest runner with neither bash nor jq on PATH, each of the four guards exits non-zero
    against a known-bad payload and exits 0 against a known-good one — the fail-open path is gone on every
    OS.
  - '`pip install --require-hashes -r` succeeds against a committed per-platform lock on linux/x86_64
    and darwin/arm64, and `lock_check.py` fails when any lock line lacks a `--hash`.'
  - The token log and cache snapshot are created 0600 and written atomically; a two-writer concurrency
    test loses no entries and never observes a partial line.
  wont:
  - Building real multi-tenancy for SERVER_PROFILE=shared — identity, per-caller authz, per-collection
    JWT scopes, principal-partitioned logs. M3 only writes the threat model and lands the owner's rename-or-schedule
    decision; the build, if chosen, belongs to memory-that-earns-it.
  - 'Publishing anything: no npm package, no PyPI distribution, no MCP Registry or skills.sh entry, no
    release automation. That is named-and-installable, and it is blocked behind the OpenAI AgentKit name-collision
    decision in starts-everywhere.'
  - Porting the substrate's own POSIX dependencies (fcntl, AF_UNIX, geteuid) — only the hook half of F132
    lands here. Import-level portability is gates-green; the UDS-to-named-pipe transport and cross-OS
    service supervision are native-everywhere.
  - A skills corpus, skill authoring paths, or any measurement of whether skills improve. data/skills/
    contains exactly one skill (handoff/), so every statistic over it is n=1; that work is author-and-measure.
  - 'Retrieval quality work of any kind: no gold set, no nDCG gate, no BM25 rewrite, no embedding-model
    pluggability. The model-pin task here is supply-chain integrity, not retrieval quality.'
  - Hot/warm/cold tiering, eviction, compaction or access-ledger work — that is memory-that-earns-it,
    and it depends on the ADRs this milestone finally publishes.
  - Provider capability manifests and the conformance suite. M3 compiles the guards to each provider's
    hook format; turning provider support itself into data is providers-as-data.
  - A documentation site, Projects v2 board build-out, or any release-notes tooling beyond a PR template
    and a label set — deliberately killed as premature for a repo with one commit and zero issues.
