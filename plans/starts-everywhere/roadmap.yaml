schema: roadmap/1
slug: starts-everywhere
project: agent-kit
title: M1 Starts Everywhere — the server launches, every registered tool answers, and the three gating
  decisions are recorded
status: draft
phase: sequenced
brief: 'M1 makes the product observable. Today the default server profile hard-throws at import on win32
  (`absoluteSocketPath` rejects `process.platform === "win32"` unconditionally), the README Quick Start
  omits the `PLATFORM_ROOT` that `loadConfig()` throws without, the four artifact-memory tools address
  `~/.local/share/workspace-artifacts/...` while the Python provisioner writes `~/.local/share/personal-artifacts/...`,
  and `query_temporal_facts` reads an approvals file that nothing in the repo ever writes. Ten of the
  22 roadmap blockers live here.

  It also records the three owner decisions — the OpenAI AgentKit name collision (DevDay 2025-10-06),
  the fate of the Graphiti pilot, and the four unused @aws-sdk runtime dependencies — because each is
  S-effort now and expensive once M2 starts writing the name into env namespaces, a CLI binary, MCP registration
  templates and a package name. The decisions are kept off the critical path of the crash fixes so an
  undecided owner cannot stall F001/F169.

  If the owner stops after M1, they still have a kit that starts on macOS, Linux and Windows, whose every
  registered tool can answer, and a clone containing nothing a public repository should not carry.'
goal:
  hmw: How might we make a stranger's first five minutes with agent-kit end in a running server on their
    own operating system — rather than a stack trace, an undocumented environment variable, or a tool
    that can only return an empty list?
  objective: Any engineer on macOS, Linux or Windows can clone the repo, follow the README verbatim, and
    get a running MCP server in which every registered tool is capable of returning a real result — with
    the three owner decisions that gate every downstream identifier and dependency written down and merged.
  key_results:
  - '`npm ci && npm run build && node dist/index.js` starts and answers a stdio `tools/list` with zero
    environment variables set, on all three of macOS, Linux and Windows. Today it exits 1 on every platform
    (PLATFORM_ROOT throw) and additionally hard-throws before tool registration on win32.'
  - 'Zero registered tools that cannot return a non-empty result by construction: the four artifact-memory
    tools resolve their socket from the same runtime config the Python provisioner writes, and `query_temporal_facts`
    is either wired to a working approvals producer or removed from `tools/list` and the README table.'
  - 'One derived-state-root resolver replaces the 13 hardcoded `~/.local/share/personal-artifacts` literals:
    `git grep -nE "local/share/(personal|workspace)-artifacts" -- ''workspace-tooling/*.py'' ''src/**''`
    returns zero module-level literals outside the resolver and its tests.'
  - 'Three ADRs are merged under `docs/adr/`: the name/licence/provenance decision, the Graphiti decision,
    and the AWS-dependency decision — each with a `Status: Accepted` line and a dated decision record.'
  - '`git grep -nE "SWAT DevOps|Nalej|nalej-|GitLab/workspace/platform|gitlab\\.example\\.com|claude-mcp-server"`
    over tracked files is asserted by `python3 data/scripts/denylist-check.py --check` exiting 0.'
  - '`agent-kit init` completes on a bare clone in a temporary directory on all three OSes, writes nothing
    outside the clone without an explicit flag, and never removes pre-existing `.claude/` content without
    `--force`. `bash setup-local.sh --build-only` today aborts before `npm ci` on every clone.'
  - '`agent-kit doctor` exits non-zero on a machine with an unmet prerequisite and prints one actionable
    line per failing row; it exits 0 on a correctly provisioned machine.'
  wont:
  - Windows named-pipe transport for the artifact-memory adapter, or any Python-side IPC port — the fail-soft
    degrade is the M1 answer; the native transport is M5 (native-everywhere).
  - Making the Python substrate importable/runnable on Windows (fcntl, geteuid, AF_UNIX, resource) — M1
    only makes the README stop overclaiming; the port is M2 (gates-green) plus M5.
  - Any GitHub Actions workflow, CI matrix, lint/type/coverage gate, CODEOWNERS or branch ruleset — M1
    fixes are verified by locally runnable commands; enforcement is M3 (ci-proves-it).
  - npm/PyPI publication, `bin`/`files`/`exports` packaging, release automation, provenance attestation
    or MCP Registry entry — M4 (named-and-installable). M1 only reserves the identifiers.
  - Turning the four generator gates green, wiring the orphaned TypeScript test files into `npm test`,
    or re-sealing the sealed-eval corpus — M2 (gates-green).
  - Any retrieval-quality, chunking, BM25, hot/cold tiering, eval-harness or ROI work — M6 and M8.
  - Provider capability manifests, conformance suites or the Claude plugin — M7 (providers-as-data).
