- id: starts-everywhere-spike-1
  kind: spike
  title: 'Time-box: what does keeping the Graphiti pilot actually cost against a local-first posture?'
  status: planned
  parent: starts-everywhere-e3
  summary: '`query_temporal_facts` is 1 of the 17 advertised tools and the temporal-graph leg of goal
