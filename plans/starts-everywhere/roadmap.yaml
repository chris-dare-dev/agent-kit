    `*.py text eol=lf`, `*.mjs text eol=lf`, `*.plist text eol=lf`, `*.ps1 text eol=crlf` and `*.png binary`
    — covering only extensions actually tracked.
  - Given a clone made with `git -c core.autocrlf=true clone`, when `git ls-files --eol -- '*.sh' '*.py'`
    is run, then every entry shows `w/lf`.
