  status: planned
  parent: starts-everywhere-e5
  summary: '`git ls-files -s` reports all 293 tracked files as mode 100644 — zero 100755 entries. The
    repo''s .git/config sets `core.filemode = false` (the Git-for-Windows default) and the single squashed
    commit was made under it, so the executable bit was never recorded for any of the 29 tracked .sh scripts
    or the ~60 Python files carrying a shebang. There is also no .gitattributes anywhere, so a contributor
    with the common `core.autocrlf=true` checks out CRLF .sh files that fail on POSIX with `bad interpreter:
