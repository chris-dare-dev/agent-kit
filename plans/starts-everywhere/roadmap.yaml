- id: starts-everywhere-e1
  kind: epic
  title: '[OWNER DECISION] Settle the name, the licence and the fork provenance'
  status: planned
  summary: 'Three decisions that cost nothing today and a great deal from M2 onward: whether to rename
    around OpenAI''s AgentKit (shipped DevDay 2025-10-06), how to licence a repo whose actual deliverable
    is prose under a code licence, and whether the 20 agents and 32 references inherited through a squashed-history
    fork of an employer codebase are clean for public release. The name gets written into env namespaces,
    a CLI binary name, MCP registration templates and a package name from M2 onward; four registries are
    expensive to un-name. Nothing in this epic blocks the crash fixes in e2.'
  priority: should
  lane: now
  size: S
  acceptance:
  - 'Given the repo at HEAD, when `ls docs/adr/`, then three files exist: `adr-0001-project-name.md`,
    `adr-0002-licensing.md`, `adr-0003-fork-provenance.md`, each containing a `Status: Accepted` line
    and a decision date.'
  - Given the accepted name, when `git grep -n "agent-kit\|<chosen-name>" package.json README.md`, then
    the chosen identifier appears consistently in `package.json:name`, the README H1 and the MCP server
    name used in `data/scripts/template-mcp.json`, with no residual occurrence of the rejected name outside
    the ADR.
  - Given the provenance ledger, when `python3 data/scripts/provenance-check.py --check` is run, then
    it exits 0 and every file under `data/agents/`, `data/references/` and `data/commands/` has a ledger
    row with a recorded clearance verdict.
  tags:
  - X001
  - X002
  - owner-decision
  - naming
  - licensing
  - provenance
  - governance
  - docs
- id: starts-everywhere-t-name-collision-decision
  kind: task
  title: Resolve the OpenAI AgentKit name collision and reserve every identifier in one pass
  status: planned
  parent: starts-everywhere-e1
  summary: OpenAI shipped a platform product called AgentKit on 2025-10-06 (Agent Builder, ChatKit, Connector
    Registry, Guardrails). This repo is `@chris-dare-dev/agent-kit` in package.json:2 and registers an
    MCP server called `agent-kit` in README.md:92. Publishing to npm, PyPI, the MCP Registry and skills.sh
    under that name means competing for the same search surface as an OpenAI product. Decide once — rename,
    or commit to a disambiguating scoped identity everywhere and accept the SEO cost knowingly — and reserve
    all identifiers together so they cannot diverge.
  priority: must
  lane: now
  size: S
  acceptance:
  - 'Given the decision, when `cat docs/adr/adr-0001-project-name.md`, then it names the collision with
    a dated citation, states the chosen option (rename | scoped coexistence), and lists the exact strings
    chosen for: npm package name, PyPI distribution name, `mcpName` reverse-DNS namespace, GitHub org/repo,
    skills.sh handle, the MCP server key used in registration templates, and the environment-variable
    prefix (today `PLATFORM_ROOT`/`WORKSPACE_ROOT`/`PERSONAL_*`).'
  - Given the chosen strings, when the reservation checklist in the ADR is followed, then each of npm,
    PyPI, GitHub and the MCP Registry shows the identifier held by the owner, and the ADR records the
    reservation date per registry.
  - Given a fresh clone, when `node -e "console.log(require('./package.json').name)"` is run, then it
    prints the chosen npm name, and `git grep -n "<rejected-name>"` returns matches only inside `docs/adr/`.
  tags:
  - X001
  - owner-decision
  - naming
  - blocks-publishing
  - docs
- id: starts-everywhere-t-licence-split
  kind: task
  title: 'Split the licence: MIT for code, CC-BY-4.0 for data/ prose'
  status: planned
  parent: starts-everywhere-e1
  summary: 'LICENSE at the repo root is MIT — a code licence — on a repo whose actual deliverable is prose:
    32 references, 20 agent definitions, 5 commands and 1 skill under data/. The Agent Skills spec itself
    splits Apache-2.0 code / CC-BY-4.0 docs. package.json also carries no `license` field at all, so `npm
    publish` would emit an unlicensed package. Record the split, add the second licence file, and state
    the boundary in one sentence a lawyer can read.'
  priority: must
  lane: now
  size: S
  acceptance:
  - 'Given the repo, when `ls LICENSE LICENSE-DOCS`, then both exist: LICENSE is the unchanged MIT text
    and LICENSE-DOCS is the CC-BY-4.0 text (or the alternative recorded in `docs/adr/adr-0002-licensing.md`).'
  - 'Given README.md, when the `## Licence` section is read, then it names exactly which paths are under
    which licence (code: `src/`, `data/scripts/`, `data/hooks/`, `workspace-tooling/`; prose: `data/skills/`,
    `data/agents/`, `data/commands/`, `data/references/`, `data/claude-md/`) with no ambiguous remainder.'
  - Given package.json, when `node -e "console.log(require('./package.json').license)"` is run, then it
    prints the SPDX expression recorded in the ADR (e.g. `MIT`) and a `repository` field resolving to
    the public GitHub URL.
  - Given `data/references/` and `data/agents/`, when the licence-header check `python3 data/scripts/licence-header-check.py
    --check` is run, then it exits 0 with every prose directory carrying the agreed attribution notice.
  depends_on:
  - starts-everywhere-t-name-collision-decision
  tags:
  - X002
  - owner-decision
  - licensing
  - dual-licence
  - docs
- id: starts-everywhere-t-fork-provenance-ledger
  kind: task
  title: Provenance pass over the 20 agents and 32 references inherited through a squashed-history fork
  status: planned
  parent: starts-everywhere-e1
  summary: package.json:4 describes the repo as a 'fork of the kit architecture' and the entire history
    is one squashed commit, so the provenance of every inherited artifact relative to the employer codebase
    has never been examined and cannot be reconstructed from git. README.md:126-132 makes the falsifiable
    claim that 'the employer-specific integrations, infrastructure facts, and operational tooling were
    removed' — e5 proves that claim is currently false. Produce a per-artifact ledger with an explicit
    clearance verdict so the claim becomes checkable rather than asserted.
  priority: must
  lane: now
  size: M
  acceptance:
  - 'Given the repo, when `cat docs/provenance-ledger.json`, then it contains one row per tracked file
    under `data/agents/`, `data/references/`, `data/commands/`, `data/skills/` and `data/claude-md/`,
    each with `{path, origin: authored-here|inherited|third-party, verdict: clear|redacted|removed, reviewed_at,
    notes}`.'
  - Given the ledger, when `python3 data/scripts/provenance-check.py --check` is run, then it exits 0
    only if every tracked file in those directories has a row and no row has verdict `pending`; deleting
    a ledger row and re-running exits non-zero naming the orphaned path.
  - Given any artifact with verdict `removed`, when `git ls-files <path>` is run, then it returns nothing
    — the file is actually gone, not merely marked.
  - Given README.md, when the Provenance section is read, then the falsifiable sentence at README.md:126-132
    is replaced by one that points at `docs/provenance-ledger.json` and the denylist gate from starts-everywhere-t-purge-employer-content.
  tags:
  - X002
  - owner-decision
  - provenance
  - fork
  - release-blocker
  - docs
- id: starts-everywhere-e2
  kind: epic
  title: 'Fail-soft startup: one unavailable tool group must never kill the server'
  status: planned
  summary: The MCP server — the primary product — dies at startup on Windows under its default configuration,
    and silently disables the personal-memory tier there too. `absoluteSocketPath()` (src/tools/artifact-memory.ts:165-182)
    makes `process.platform === "win32"` the first clause of its rejection test, and src/index.ts:159-162
    calls `createArtifactMemoryTools()` unguarded at module top level whenever the profile is `personal`
    (the default for any unset or typo'd SERVER_PROFILE). The outcome of this epic is that an unavailable
    tool group degrades to a logged, enumerable state and the other 13 tools keep serving.
  priority: must
  lane: now
  size: M
  acceptance:
  - 'Given a Windows host and a built `dist/`, when `node dist/index.js` is launched over stdio and sent
    `initialize` then `tools/list`, then the process does not exit, and the response enumerates the 13
    non-artifact-memory tools. Today the process prints its discovery counts and dies with `Error: artifact
    memory service socket path must be an absolute, normalized Unix path...`.'
  - Given the same host, when `npm test` is run, then `src/mcp-contract.test.ts`, `src/server-profile.test.ts`
    and `src/transport-lock.test.ts` all pass. Today 3 of 7 test cases fail on native Windows for exactly
    this reason.
  - Given a Windows host with `USERPROFILE` set and `HOME` unset, when the server starts, then the startup
    log reports a non-zero `Memory (local/private)` count for a user who has memory files, instead of
    the current silent `0`.
  - Given a POSIX host with a reachable socket, when the server starts, then `tools/list` still returns
    all 17 tools and no degradation line is printed — the fix must not regress the working path.
  tags:
  - F001
  - F049
  - F107
  - F169
  - F009
  - F127
  - windows
  - startup
  - fail-soft
  - blocker
  - mcp-server
- id: starts-everywhere-t-failsoft-tool-group-registration
  kind: task
  title: Wrap createArtifactMemoryTools() so an unavailable transport disables four tools instead of killing
    the process
  status: planned
  parent: starts-everywhere-e2
  summary: src/index.ts:159-162 evaluates `createArtifactMemoryTools()` at module scope whenever `config.serverProfile
    === "personal"`. That call reaches `absoluteSocketPath()` (src/tools/artifact-memory.ts:376-382 →
    :165-182), which throws unconditionally on win32. The throw is uncaught, so the process exits 1 before
    a single tool is served — taking `list_skills`, `get_agent`, `search_platform_knowledge` and 10 other
    tools that never touch the substrate with it. Mirror the graceful-degradation pattern already used
    at src/config.ts:42-51.
  priority: must
  lane: now
  size: M
  acceptance:
  - 'Given src/index.ts, when the `createArtifactMemoryTools()` call at :159-162 is wrapped in try/catch,
    then on throw it sets `artifactMemoryTools = undefined`, writes exactly one stderr line matching `^\[agent-kit-mcp\]
    artifact-memory tools unavailable: .+$` including the reason and the socket path attempted, and continues.'
  - Given `artifactMemoryTools === undefined`, when `tools/list` is served, then the four names in `ARTIFACT_MEMORY_TOOL_NAMES`
    (src/index.ts:152-158) are absent from the response, and the four `case` arms at src/index.ts:723-724
    and the dispatch set at :566 can no longer be reached with a non-null assertion — replace `artifactMemoryTools!`
    with a guarded branch returning an `isError` result naming the reason.
  - Given a test double that forces `createArtifactMemoryTools` to throw, when `node --import tsx --test
    src/mcp-contract.test.ts` is run on any platform, then a new case `personal profile starts when artifact
    memory is unavailable` passes and asserts a 13-tool list against a new fixture `tests/fixtures/tools-list.degraded.golden.json`.
  - Given a Windows host, when `node dist/index.js` is run and a `tools/list` request sent, then exit
    code is not 1 and 13 tools are returned. This is the F001/F107/F169 reproduction and it must now pass.
  tags:
  - F001
  - F049
  - F107
  - F169
  - windows
  - startup
  - fail-soft
  - blocker
  - mcp-server
- id: starts-everywhere-t-artifact-memory-capability-probe
  kind: task
  title: Gate artifact-memory registration on a capability probe, not on serverProfile alone
  status: planned
  parent: starts-everywhere-e2
  summary: Registration today is decided by `config.serverProfile === "personal"` (src/index.ts:159) with
    no check that the transport is usable or that the socket exists. That is why the failure mode is an
    exception rather than a decision. Replace the boolean with a probe that returns a structured availability
    verdict, so 'this platform has no AF_UNIX', 'the socket file is absent', 'the shared profile excludes
    this group' and 'it works' are four distinguishable states rather than one throw.
  priority: must
  lane: now
  size: M
  acceptance:
  - 'Given a new exported `probeArtifactMemory(config): { available: true, socketPath } | { available:
    false, reason: ''unsupported-platform''|''socket-missing''|''socket-insecure''|''disabled-by-profile'',
    detail: string }` in src/tools/artifact-memory.ts, when it is called on win32, then it returns `available:false,
    reason:''unsupported-platform''` and does not throw.'
  - Given a POSIX host where the socket path does not exist, when the probe runs, then it returns `reason:'socket-missing'`
    with `detail` containing the absolute path that was checked — so the operator can see which path was
    wrong (this is the F037 symptom made visible).
  - Given the probe result, when the server registers tools, then registration happens if and only if
    `available === true`, and `src/tools/artifact-memory.test.ts` gains a case per reason value driven
    by a stubbed `process.platform` and a temp-dir socket fixture.
  - Given `node --import tsx --test src/tools/artifact-memory.test.ts` on Windows, when it is run, then
    it passes — the POSIX-only socket-binding cases skip explicitly with a named skip reason rather than
    erroring with EACCES.
  depends_on:
  - starts-everywhere-t-failsoft-tool-group-registration
  tags:
  - F107
  - F169
  - F001
  - capability-probe
  - fail-soft
  - mcp-server
- id: starts-everywhere-t-homedir-personal-memory
  kind: task
  title: Resolve home with os.homedir() so the personal-memory tier is not silently disabled on Windows
  status: planned
  parent: starts-everywhere-e2
  summary: src/config.ts:157 and :161 gate the entire personal-memory tier on `process.env.HOME`. Under
    native PowerShell — how Claude Code actually launches on Windows — `HOME` is undefined while `USERPROFILE`
    and `os.homedir()` both resolve. The condition is false, control falls to the `else` at :163, `memoryDir`
    becomes `""`, and `discoverMemory` returns `[]` with no warning, so `list_memory`/`get_memory`/`search_memory`
    return empty results indistinguishable from 'this user has no memory files'. `homedir()` is already
    imported and used correctly one directory away at src/tools/artifact-memory.ts:16.
  priority: must
  lane: now
  size: S
  acceptance:
  - Given src/config.ts, when `import { homedir } from "node:os"` is added and the reads at :157 and :161
    are replaced with `homedir()`, then `MEMORY_ROOT` still wins as the explicit first-priority override
    (including the empty-string 'disable' case at :154-156).
  - Given a new `src/config.test.ts`, when `node --import tsx --test src/config.test.ts` is run with `HOME`
    deleted from the environment and `USERPROFILE` set, then it asserts `memoryDir` is non-empty and resolves
    under `homedir()`.
  - Given the same test file, when it is run with `MEMORY_ROOT=""`, then `memoryDir` is `""` and the assertion
    documents that as the deliberate disable path.
  - 'Given a Windows host with memory files present under `%USERPROFILE%\.claude\projects\<slug>\memory`,
    when the server starts, then the startup log line `Memory (local/private): N` reports N > 0.'
  tags:
  - F009
  - F127
  - windows
  - memory
  - config
  - mcp-server
- id: starts-everywhere-t-startup-degradation-log
  kind: task
  title: One startup line that distinguishes 'disabled by config' from 'disabled by failure' from 'empty'
  status: planned
  parent: starts-everywhere-e2
  summary: The server's only statement about the memory tier is the count at src/index.ts:69 and the shared-profile
    exclusion line at :81-83. Neither fires for a personal profile whose `memoryDir` resolved to `""`,
    and nothing at all is said when the artifact-memory group fails to register. An operator therefore
    cannot tell a misconfiguration from an empty corpus. Emit one explicit, greppable line per tier state.
  priority: should
  lane: now
  size: S
  acceptance:
  - 'Given a personal profile where `config.memoryDir === ""`, when the server starts, then stderr contains
    `[agent-kit-mcp] memory tier disabled: no MEMORY_ROOT and no resolvable home directory` — distinct
    from the shared-profile line already emitted at src/index.ts:81-83.'
  - Given a personal profile where `memoryDir` resolves to a real but empty directory, when the server
    starts, then stderr contains `[agent-kit-mcp] memory tier enabled, 0 entries at <path>` — distinguishable
    from the disabled case by the presence of the path.
  - Given the artifact-memory group, when the probe reports unavailable, when the server starts, then
    exactly one line names the reason and the attempted socket path; when the group is excluded by `SERVER_PROFILE=shared`,
    then the existing 'EXCLUDED (shared profile)' line is emitted and no failure line is.
  - Given `src/server-profile.test.ts`, when it is run, then it asserts the exact set of degradation lines
    for each of the four states, so a future silent regression fails the suite.
  depends_on:
  - starts-everywhere-t-homedir-personal-memory
  - starts-everywhere-t-artifact-memory-capability-probe
  tags:
  - F009
  - F127
  - F049
  - observability
  - startup
  - mcp-server
- id: starts-everywhere-t-win32-startup-regression-test
  kind: task
  title: Lock the win32 startup regression into the contract suite with a stubbed platform
  status: planned
  parent: starts-everywhere-e2
  summary: src/mcp-contract.test.ts already boots the default profile over stdio and already fails on
    this defect — it simply never runs anywhere that would notice, and it cannot exercise the win32 branch
    from a POSIX developer machine. Add a platform-stubbed case so the regression is caught on every OS,
    not only on a Windows runner, and so it is green before M3 wires the CI matrix.
  priority: must
  lane: now
  size: S
  acceptance:
  - Given `src/mcp-contract.test.ts`, when a new case `default profile starts on a platform without AF_UNIX`
    runs with `process.platform` stubbed to `win32`, then the server initializes, answers `tools/list`
    with 13 tools, and the test passes on macOS, Linux and Windows alike.
  - Given `src/server-profile.test.ts:51-76`, when the existing personal-profile cases are run on native
    Windows, then all pass — today 3 of 7 fail.
  - Given the golden fixtures, when `npm run test:update-golden` is run, then `tests/fixtures/tools-list.golden.json`
    (17 tools) and `tests/fixtures/tools-list.degraded.golden.json` (13 tools) are both regenerated and
    both are asserted by name in the suite.
  - Given a deliberate revert of the try/catch in src/index.ts, when `npm test` is run on any platform,
    then the new case fails — proving the test actually guards the fix.
  depends_on:
