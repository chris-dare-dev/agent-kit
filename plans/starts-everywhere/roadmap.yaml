- id: starts-everywhere-t-artifact-policy-example
  kind: task
  title: Ship artifact-policy as a schema-backed example instead of one engineer's private vault layout
  status: planned
  parent: starts-everywhere-e5
  summary: 'workspace-tooling/artifact-policy.json is not an example, it is the enforced default: artifact_catalog.py:784
    sets `--policy` to `Path(__file__).with_name("artifact-policy.json")`. Its `catalog.canonical_roots`
    and `required_roots` are both `["Projects", "Source Code"]` — the author''s Obsidian vault layout
    — and its include globs name `github-governance/**` and `local-llm-pipelines/**`, two of the author''s
    own repositories. Because `required_roots` is enforced (:119-134 validates, :332-337 emits `missing
    required root:`), running the catalog against any normal repository produces a scan with both required
    roots missing. The module''s own DEFAULT_ROOTS (:33-42) describe a third, different layout, so the
    fallback and the shipped policy do not agree.'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given the repo, when `git ls-files workspace-tooling/artifact-policy*.json` is run, then only `artifact-policy.example.json`
    is tracked and it contains no path naming a personal vault or a private repository.
  - Given `python3 workspace-tooling/artifact_catalog.py scan` with no `--policy`, when it is run, then
    it exits non-zero with a message naming `artifact-policy.example.json` and the `init-policy` command
    — it must not silently enforce someone else's roots.
  - Given `python3 workspace-tooling/artifact_catalog.py init-policy --workspace <path>`, when run against
    an arbitrary repository, then it writes a starter policy whose `canonical_roots` were inferred from
    that tree, and a subsequent `scan --policy <written-file>` completes with zero `missing required root:`
    diagnostics.
  - Given `workspace-tooling/schemas/artifact-policy.schema.json`, when the example is validated against
    it, then validation passes; when a required key is removed from the example, then it fails — asserted
    by a unit test.
  - Given artifact_catalog.py:33-42, when read, then DEFAULT_ROOTS/DEFAULT_INCLUDE_GLOBS either match
    the shipped example or are deleted, so there is one layout contract instead of three.
  tags:
  - F052
  - F122
  - de-personalisation
  - policy
  - schema
  - substrate
- id: starts-everywhere-t-template-settings
  kind: task
  title: Rewrite template-settings.json — it ships kubectl/AWS grants and a hook path that does not exist
  status: planned
  parent: starts-everywhere-e5
  summary: data/scripts/template-settings.json is what the installer merges into a user's Claude Code
    settings.json. Its `permissions.allow` block grants `Bash(kubectl get:*)`, `Bash(kubectl describe:*)`,
    `Bash(kubectl logs:*)` and `Bash(AWS_PROFILE=YOUR_AWS_PROFILE kubectl:*)` — a Kubernetes/AWS allowlist
    for a repo that ships no Kubernetes anything. Its PreToolUse hooks fall back to `${PERSONAL_WORKSPACE_ROOT:-$HOME/Work/workspace}/.claude/hooks/...`,
    the author's machine layout. Its PostToolUse Edit|Write hook invokes `${CLAUDE_PROJECT_DIR:-$PWD}/scripts/project-linker-hook.sh`
    — there is no `scripts/` directory at the repo root (the script is workspace-tooling/project-linker-hook.sh)
    — and the `[ -f "$h" ] && exec ...; exit 0` shape means the miss is never reported.
  priority: should
  lane: next
  size: S
  acceptance:
  - Given data/scripts/template-settings.json, when `permissions.allow` is read, then it contains no kubectl
    or AWS entry; if those grants are still wanted, they live in a separate opt-in `data/scripts/template-settings.k8s.json`.
  - Given the hook entries, when they are read, then every path is rooted at `${CLAUDE_PROJECT_DIR}` with
    no `$HOME/Work/workspace` fallback, and the PostToolUse Edit|Write hook points at a path that exists
    in this repo — verified by a check that resolves every hook command path in the template against the
    tree and fails on a miss.
  - Given a hook whose target is missing at runtime, when it fires, then it emits one stderr line naming
    the missing path instead of silently `exit 0`.
  - Given `block-kubectl-mutations.sh`, when the template is read, then it is either shipped and registered
    deliberately or its registration is removed — no registration of a guard for a tool the kit does not
    otherwise mention.
  - Given a new `data/scripts/template-settings.md`, when it is read, then it states which hooks are on
    by default and what each blocks.
  tags:
  - F183
  - templates
  - hooks
  - permissions
  - security
