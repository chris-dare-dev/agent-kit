- id: memory-grows-and-tiers-t-access-ledger
  kind: task
  title: Record durable per-artifact access recency, frequency and citation — build this first and let
    it accumulate
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'Nothing in the repo ever records that an artifact, revision, chunk or point was read: grepping
    last_access, access_count, accessed_at, hit_count and read_count across workspace-tooling/, src/ and
    data/ returns zero matches, and the service keeps only restart-volatile aggregate counters (artifact_memory_service.py:1035-1047).
    Without a recency/frequency signal no demotion policy is computable, so any tiering would have to
    demote on age alone — exactly the policy artifact_unit_archive.py already proves is wrong here. Land
    this ahead of the rest of the milestone so real data exists before any tier is declared.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given a search that returns three results, when it completes, then artifact-access-ledger.sqlite3
    contains three access_events rows carrying point_id, revision_id, artifact_id, route, rank and timestamp
    — written from record_retrieval_result (artifact_memory_service.py:1035) and the /v1/get path, and
    from nowhere else.
  - Given the ledger file is read-only or its disk is full, when a search runs, then the search still
    returns results and the ledger failure is logged — asserted by a test that makes the ledger unwritable
    and expects a successful read.
  - Given `artifact_access_ledger.py rollup`, when it runs, then access_summary rows carry last_access_at,
    count_7d, count_30d, count_all and an exponential-decay score whose half-life comes from the lifecycle
    policy block rather than a constant.
  - Given the ledger file, when its mode is inspected on POSIX, then it is 0600 and created through the
    same conventions as artifact_unit_archive.open_archive; on Windows the equivalent private-path check
    from gates-green-e4 applies.
  - Given memory_status and artifact_watermark, when they run, then the access summary is exposed read-only
    through both, so the signal is visible before any policy consumes it.
  depends_on:
  - starts-everywhere-e3
  - gates-green-e4
  tags:
  - F056
  - X048
  - access-ledger
  - telemetry
  - lifecycle
- id: memory-grows-and-tiers-t-lifecycle-policy-block
  kind: task
  title: Replace the single 14-day age gate with per-memory-type TTL and decay policy
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'artifact-policy.json contains exactly one time-based rule for the entire substrate — quarantine.minimum_age_days:
    14 — applied uniformly to decision, handoff, plan, research and roadmap, while a skill-event receipt
    and a decision record have wildly different half-lives. Add a lifecycle block keyed by artifact_type
    x authority_class declaring hot_ttl_days, warm_ttl_days, decay_half_life_days, cold_representation
    and never_demote, validated with the same strict shape artifact_quarantine._load_rules uses. Move
    RPO_HOURS and RETENTION_WARN_DAYS out of artifact_memory.py:38-43 and the four snapshot constants
    out of artifact_backup_snapshot.py:32-36 into policy.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given artifact-policy.json, when it is validated against workspace-tooling/schemas/artifact-policy.schema.json,
    then the lifecycle block is present, every declared artifact_type x authority_class pair has all five
    fields, and an unknown key fails validation.
  - Given `grep -nE 'RPO_HOURS|RETENTION_WARN_DAYS' workspace-tooling/artifact_memory.py`, when it is
    run at HEAD, then the constants are gone and both values are read from the policy file.
  - Given an artifact_type marked never_demote true, when classify() is asked for its tier, then it returns
    HOT regardless of age or access score, asserted by a unit test.
  - Given artifact_observations rows older than the policy window, when the new catalog compaction subcommand
    runs, then they collapse into a per-revision first_run/last_run range row and the current_artifact_revisions
    view still returns exactly the same rows as before compaction.
  depends_on:
  - memory-grows-and-tiers-t-access-ledger
  tags:
  - F063
  - policy
  - ttl
  - decay
  - lifecycle
- id: memory-grows-and-tiers-t-tier-model
  kind: task
  title: Declare HOT/WARM/COLD tiers with owning code, and a dry-run demotion planner
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'Define three temperatures with owning code and wire them to what already exists: HOT (current
    revisions in Qdrant, searchable), WARM (superseded revisions evicted from the live collection into
    the existing unit archive, reachable via an as_of parameter rather than the currently-refused include_history),
    COLD (the off-device bundle, restorable). Add a tiers block to artifact-policy.json, artifact_tier_policy.py
    exposing a pure classify(revision, signals) -> tier, and artifact_tier_plan.py with plan/apply subcommands
    that are dry-run by default and route every destructive step through artifact_outbox_retention.classify()''s
    RETAIN kernel. No tier may be declared until the access ledger holds data.'
  priority: must
  lane: later
  size: L
  acceptance:
  - Given artifact-policy.json, when it is validated, then the tiers block declares, per tier, a storage
    backend, a target p95 read latency, an admission rule and a demotion predicate, and artifact_tier_policy.py
    fails closed on a tier with a missing predicate.
  - Given a revision plus its access-summary signals, when classify() is called twice with identical inputs,
    then it returns identical tiers — asserted by a determinism test, since classify must be pure and
    stdlib-only like graphiti_policy.py.
  - Given `artifact_tier_plan.py plan --json`, when it runs without --apply, then nothing is written or
    deleted and the output enumerates every proposed demotion with the predicate that fired.
  - Given a revision whose outbox unit artifact_outbox_retention.classify() marks RETAIN, when plan runs,
    then that revision never appears in the demotion set, asserted by a test that constructs exactly that
    case.
  - Given memory_status, when it runs, then it reports per-temperature counts, replacing today's bare
    historical_points number at artifact_memory.py:501.
  depends_on:
  - memory-grows-and-tiers-t-access-ledger
  - memory-grows-and-tiers-t-lifecycle-policy-block
  tags:
  - F055
  - F046
  - tiering
  - policy
  - lifecycle
- id: memory-grows-and-tiers-t-retrieval-decay
  kind: task
  title: Implement forgetting as retrieval-time decay plus salience, keeping RETAIN as the storage default
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'The only forgetting mechanism compatible with the substrate''s never-rewrite-canon rule is
    read-time scoring, not deletion. Score at retrieval as semantic similarity modulated by recency decay
    and an ingest-assigned salience weight, with recently-retrieved items boosted and untouched ones damped
    toward a floor. Use type-specific curves from the lifecycle policy block: working memory expires hard
    at run completion, procedural memory does not decay. Actual eviction stays reserved for the gated
    paths in the sibling tasks.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given two candidates with identical similarity where one was retrieved yesterday and one has never
    been retrieved, when the decay-aware ranker scores them, then the recently-retrieved one ranks higher,
    asserted by a unit test over the access ledger fixture.
  - Given an artifact_type declared non-decaying in the lifecycle policy, when it is scored, then its
    decay multiplier is exactly 1.0 regardless of age.
  - Given working-memory entries scoped to a run, when the run completes, then they are excluded from
    subsequent retrievals without any storage deletion, asserted by a test that inspects the store afterwards
    and finds the rows intact.
  - Given the decay parameters, when ranking_contract() is computed, then decay half-lives and the salience
    weighting are part of the profile digest, so a decay-curve change re-runs the gold gate.
  - Given the forgetting cases from memory-that-earns-it-t-forgetting-cases, when the decay ranker is
    enabled, then stale_hit_rate@10 improves against the recorded pre-decay baseline and the improvement
    is recorded in the tolerances file.
  depends_on:
  - memory-grows-and-tiers-t-access-ledger
  - memory-you-can-trust-t-forgetting-cases
  tags:
  - X033
  - decay
  - salience
  - retrieval
  - lifecycle
- id: memory-grows-and-tiers-t-qdrant-storage-class
  kind: task
  title: Make Qdrant storage class configurable and add a gated, attestation-backed point-eviction path
    (declared partial scope)
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'There is exactly one collection, created with VectorParams(size, distance=COSINE) and nothing
    else (artifact_ingestion.py:1036-1043) — no on_disk, no quantization, no HNSW tuning, no indexing_threshold
    — and qdrant_reconcile explicitly reports point_deletion: disabled (artifact_ingestion.py:1234), so
    no code in the repo can remove a point. Extend collection creation to take a tier profile supplying
    those knobs, defaulting to today''s behaviour, and add artifact_tier_move.py implementing move-then-delete
    gated on a prior artifact_unit_archive.py attestation. DECLARED PARTIAL SCOPE: the second, quantized,
    alias-fronted cold collection is deferred with X048''s build phase until the access ledger shows a
    hot set that is a small fraction of a large corpus.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given a tier profile declaring on_disk true and an indexing_threshold, when a collection is created,
    then get_collection reports exactly those settings; given no tier profile, then the created collection
    is byte-identical in configuration to today's.
  - Given a superseded revision whose payload artifact_unit_archive.py has attested, when `artifact_tier_move.py
    --apply` runs, then its points are deleted from Qdrant and the run reports the attestation id it relied
    on.
  - Given a superseded revision with NO archive attestation, when the same command runs, then it refuses
    to delete and exits non-zero naming the missing attestation — asserted by a test that constructs exactly
    that state.
  - Given the eviction path, when qdrant_reconcile's result payload is inspected, then point_deletion
    no longer reads 'disabled' unconditionally but names the gate that governs it.
  - Given this task's diff, when reviewed, then it introduces no second collection and no quantization_config
    default — both are explicitly deferred and their absence is recorded in workspace-tooling/README-artifact-lifecycle.md
    with the measurement that would justify them.
  depends_on:
  - memory-grows-and-tiers-t-tier-model
  - memory-you-can-trust-t-qdrant-integration-job
  tags:
  - F057
  - qdrant
  - eviction
  - storage-class
  - lifecycle
  - partial-scope
- id: memory-grows-and-tiers-t-rehydration-read-path
  kind: task
  title: Build the verified rehydration route so a cold hit is not indistinguishable from loss (declared
    partial scope)
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'artifact_memory.py:45-48 hard-disables historical retrieval with HISTORICAL_SNIPPETS_DISABLED
    and get_artifact only returns the canonical current file by path, so a superseded revision has no
    read route at all — which means demotion today is indistinguishable from deletion and no operator
    will ever enable it. Add artifact_rehydrate.py with `get --revision-id <id>` resolving from the live
    source file then the unit archive, verifying content_sha256 and unit_sha256 at every step and labelling
    the response with its provenance tier and integrity status. DECLARED PARTIAL SCOPE: the content-addressed
    store (F060) is deferred, so resolution stops at the unit archive; the resolver must return an explicit
    not-in-any-tier error rather than pretending.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a revision present only in the unit archive, when `artifact_rehydrate.py get --revision-id <id>`
    runs, then it returns the content, names the tier it came from, and reports integrity verified against
    the stored unit_sha256.
  - Given a revision whose archived bytes do not match their recorded hash, when the same command runs,
    then it fails closed with an integrity error and returns no content.
  - Given a revision present in no tier, when the command runs, then it exits non-zero with an explicit
    'not resolvable in any configured tier' message naming the tiers searched — never an empty success.
  - Given the MCP surface, when get_artifact_revision is called, then it succeeds — requiring /v1/get
    with a revision_id to be added to ALLOWED_ROUTES at src/tools/artifact-memory.ts:72-77, without which
    the adapter rejects the route.
  - Given HISTORICAL_SNIPPETS_DISABLED, when the code is read at HEAD, then it is lifted only for objects
    that resolve through the verified path, and README-artifact-ingestion.md:600-607 and its Current boundary
    section at :788-796 are updated in the same commit.
  depends_on:
  - memory-grows-and-tiers-t-tier-model
  tags:
  - F065
  - rehydration
  - cold-read
  - lifecycle
  - partial-scope
- id: memory-grows-and-tiers-t-lessons-demotion
  kind: task
  title: Turn the lessons.md FIFO trim into an archiving demotion, and bridge the two memory planes
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'data/scripts/milestone-pipeline-consolidate-memory.sh:104-108 enforces a 500-line cap with
    `out = out[overflow:]`, permanently discarding the oldest dated lessons with no archive and no recovery
    — the exact opposite of the substrate''s doctrine three directories away. Two bugs compound it: the
    inserted marker line does not match LINE_RE so it lands in `unparsable`, is appended to the tail,
    and can never be trimmed (the file stabilises at max_lines+1 and every run destroys one more lesson
    forever); and the near-duplicate collapse at :95-98 discards the recurrence count, which is precisely
    the frequency signal a lesson''s value should be scored on. Fix the bugs, demote overflow to lessons-cold.md,
    and add the narrow artifact-policy.json allow rule that lets cold lessons be catalogued despite the
    broad agent-memory prune.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a lessons.md at 520 lines with max_lines 500, when the consolidator runs, then lessons-cold.md
    contains all 20 overflow lines verbatim and a sidecar consolidation-log.jsonl records {agent, dropped_count,
    at, sha256} — asserted by new test T6 in data/scripts/milestone-pipeline-consolidate-memory-test.sh.
  - Given the consolidator is run twice in succession with no new lessons, when the second run completes,
    then lessons.md is byte-identical to after the first run and no additional line was demoted — asserted
    by test T7, which fails against HEAD because the marker accumulates in the untrimmable tail.
  - Given three near-duplicate lessons, when the collapse runs, then the surviving line carries an [n=3]
    occurrence tally and survivors are ranked by recency times occurrences.
  - Given artifact-policy.json, when the catalog walker runs, then `**/agent-memory/*/lessons-cold.md`
    is catalogued with its own artifact_type while the broad `agent-memory` entry in catalog.prune_directory_names
    still excludes the hot files — asserted by a catalog test over a fixture tree.
  - Given the two-plane contract, when workspace-tooling/README-artifact-lifecycle.md is read, then it
    documents hot lessons.md to lessons-cold.md to catalogued/embedded/searchable, and names which plane
    owns cold lessons.
  depends_on:
  - memory-grows-and-tiers-t-lifecycle-policy-block
  tags:
  - F058
  - F071
  - lessons
  - agent-memory
  - demotion
  - lifecycle
- id: memory-grows-and-tiers-t-lifecycle-schedule-health
  kind: task
  title: Schedule the never-invoked cold path and surface its verdict in the health watermark
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: artifact_outbox_retention.py and artifact_unit_archive.py constitute the entire archive-then-prune
    capability and are invoked by nothing — grepping for either name outside tests/ returns only a single
    internal import. Meanwhile artifact_watermark.compute_watermark builds eleven components (:923-965)
    and none of them is outbox size, retention pressure or archive coverage, so a new team member reading
    the health surfaces sees green while derived state grows unattended. Add a scheduled weekly job through
    the M5 cross-OS service contract, a twelfth `lifecycle` component, and a lifecycle block in both the
    status payload and the service /v1/status route.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given the weekly lifecycle job, when it runs, then it executes `artifact_unit_archive.py backfill
    --apply` then `artifact_outbox_retention.py --json` and writes artifact-lifecycle-health.json into
    the derived root.
  - Given that file is older than its declared cadence, when compute_watermark runs, then the `lifecycle`
    component reports STALE; given the file is absent, then MISSING — asserted by workspace-tooling/tests/test_artifact_watermark.py.
  - Given the lifecycle component, when it is healthy, then it reports outbox bytes, RETAIN / RETAIN-BY-DEFAULT
    / PRUNABLE directory counts, irreproducible revision count and archive coverage percent.
  - Given the job definition, when it is rendered by the M5 service contract, then equivalent units exist
    for launchd, systemd and Windows Task Scheduler — not a sixth macOS plist.
  - Given workspace-tooling/README-artifact-lifecycle.md, when it is read, then both modules are documented
    and README-artifact-ingestion.md §6 cross-links to it, closing the gap where quarantine is documented
    and neither module is mentioned.
  depends_on:
  - native-everywhere-e2
  - memory-grows-and-tiers-t-tier-model
  tags:
  - F059
  - scheduling
  - watermark
  - cold-path
  - lifecycle
- id: memory-grows-and-tiers-t-storage-accounting
  kind: task
  title: Emit per-class storage accounting with growth forecasting and enforceable budgets
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'The system cannot answer how big memory is, where it is growing, or when it runs out. The
    only budget in the tree is four module constants for snapshot count and bytes (artifact_backup_snapshot.py:32-36)
    governing one artifact class, and the only disk check is a single shutil.disk_usage call in the backup
    builder. A tiering system is a cost-management system: without cost measurement there is no signal
    to tier against and no way to prove tiering worked. Add artifact_storage_accounting.py covering outbox
    (by retention verdict), unit archive, catalog sqlite per table, the Qdrant collection, snapshots,
    off-device bundles, quarantine sets, eval outputs and the graph store, plus rolling deltas and a projected
    days-to-full.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given a populated derived root, when `artifact_storage_accounting.py --json` runs, then artifact-storage-accounting.json
    contains bytes and object counts for every named class plus 7-day and 30-day deltas and a projected
    days-to-full from shutil.disk_usage.
  - Given the outbox breakdown, when it is inspected, then it is segmented by artifact_outbox_retention.classify()'s
    verdicts rather than by a separate reimplementation.
  - Given a `budgets` block in artifact-policy.json with soft and hard ceilings per class, when a class
    exceeds its soft ceiling, then the lifecycle watermark component reports DEGRADED and the watchdog
    raises; `grep -n 'WARN\|ALARM' workspace-tooling/artifact_backup_snapshot.py` shows the four constants
    now read from that block.
  - Given the report, when it is rendered, then each class is explicitly labelled bounded or unbounded,
    so the reader can tell which classes have a rotation policy and which grow forever.
  depends_on:
  - memory-grows-and-tiers-t-lifecycle-schedule-health
  tags:
  - F062
  - storage-accounting
  - budgets
  - capacity
  - lifecycle
- id: memory-grows-and-tiers-t-backup-watermark
  kind: task
  title: Give the coldest tier an alarm, an actor for its rollback deadline, and a health surface that
    stops contradicting itself
  status: planned
  parent: memory-grows-and-tiers-e2
  summary: 'Three small honesty defects in the same surface. (1) A frozen off-device RPO clock fires no
