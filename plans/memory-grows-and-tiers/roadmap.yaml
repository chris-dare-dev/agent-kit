- id: memory-grows-and-tiers-t-write-contract
  kind: task
  title: Generalise the Graphiti policy validator into a substrate-independent memory write contract
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: workspace-tooling/graphiti_policy.py already implements exactly the right thing — pre-persistence
    validation of extracted objects, pure and stdlib-only so it stays testable without the optional dependency
    — but it is buried inside a pilot where no external reader will find it and it gates only one destination.
    Lift it into memory_write_contract.py gating every write regardless of destination (canonical Markdown,
    vector payload, graph), add a protected-core-facts set a candidate write may not contradict (failing
    closed rather than merging), publish the contract as a versioned JSON schema with a conformance suite,
    and return rejection reasons in the tool response so an agent can correct and retry.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a candidate write to any of the three destinations, when it is submitted, then it passes through
    memory_write_contract.validate() first — asserted by a test that monkeypatches the validator to always
    reject and confirms zero writes reach any destination.
  - Given a candidate that contradicts a protected core fact, when it is validated, then it is rejected
    with a machine-readable reason code and no partial write occurs.
  - Given the contract, when data/schemas/memory-write-contract.schema.json is validated, then it is Draft
    2020-12 with additionalProperties:false and carries a contract version, and the conformance suite
    in workspace-tooling/tests/ covers at least one accept and one reject case per rule.
  - Given a rejected write through the MCP surface, when the tool result is read, then it contains the
    rule id and a human-readable reason, so the agent can correct and retry without guessing.
  - Given graphiti_policy.py, when it is read at HEAD, then it delegates its validation rules to the shared
    module rather than duplicating them.
