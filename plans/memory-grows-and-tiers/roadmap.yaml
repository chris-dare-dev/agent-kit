- id: memory-grows-and-tiers-e2
  kind: epic
  title: An explicit hot/warm/cold tier model driven by recorded access signals
  status: planned
  summary: 'Goal E is not partially implemented — it is unimplemented as a concept: a repo-wide grep for
    tier, demote, rehydrate, evict or decay returns zero storage-lifecycle hits, and the only time rule
    in the whole policy file is quarantine.minimum_age_days: 14. Every component correctly refuses to
    be the one that deletes, so no component owns lifecycle. This epic builds the access ledger first
    and lets it accumulate real data, then declares tiers with per-tier backends, latency targets, admission
    rules and demotion predicates; replaces the single age gate with per-memory-type TTL and retrieval-time
    decay; makes superseded vectors evictable and cold content readable back; turns the lessons.md FIFO
    trim into an archiving demotion; and gives the never-invoked cold-path modules a schedule, a health
    file, storage accounting and a perf gate.'
  priority: should
  lane: later
  size: XL
  acceptance:
  - Given the access ledger has been running, when `artifact_access_ledger.py rollup --json` is run, then
    it reports per-revision last_access_at, count_7d, count_30d and a decayed score — signals that today
    exist nowhere in the repo.
  - Given artifact-policy.json, when it is validated, then it contains a tiers block declaring HOT/WARM/COLD
    with a storage backend, p95 read-latency target, admission rule and demotion predicate per tier, and
    a lifecycle block keyed by artifact_type x authority_class.
  - 'Given a superseded revision whose payload has been attested by artifact_unit_archive.py, when the
    sweep runs with --apply, then its Qdrant points are deleted and memory_status reports the per-temperature
    counts — today artifact_ingestion.py:1234 reports point_deletion: disabled and no code can remove
    a point.'
  - Given a lessons.md file at its 500-line cap, when the consolidator runs, then every trimmed line is
    present verbatim in lessons-cold.md and the count is recorded in a sidecar log — today those lines
    are destroyed.
  depends_on:
  - memory-you-can-trust-e1
