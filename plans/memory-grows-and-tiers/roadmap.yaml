    it is returned through any memory tool, then the marker is escaped and the content is wrapped in a
    delimiter block declared as non-instruction data — asserted by a test using a corpus of known injection
    strings.
  - Given a retrieved entry that does not validate against its declared memory_type schema, when it is
    read, then it is routed into the reversible quarantine and excluded from the result, with the quarantine
    reason recorded.
  - Given the AIDefence guard, when a memory result is produced, then guardToolOutput runs over it before
    the response is cached — closing the gap where the guard faces only the caller and never the output.
  - Given the delimiter scheme, when it is documented in docs/THREAT-MODEL.md, then the memory-as-injection-channel
