    and the bi-temporal work in memory-that-earns-it-t-bitemporal-catalog carries the capability instead.
    Otherwise: Graphiti''s bi-temporal model is the one place in the stack with a built-in hot/cold mechanism,
    and the read path ignores it. artifact_memory.py:355-378 selects r.invalid_at and uses it only in
    ORDER BY, so a fact Graphiti has explicitly marked superseded is returned in the same list, stamped
    quality_status ''approved'' at :369, as a live one. Nothing ever writes invalid_at either, even though
    Supersedes is already in graphiti_policy.py''s DEFAULT_EDGE_TYPES.'
  priority: should
  lane: later
  size: M
  acceptance:
  - Given a graph containing an invalidated edge, when query_temporal_facts is called with no as_of, then
    the invalidated fact is not returned — the Cypher now filters r.invalid_at IS NULL.
  - Given as_of set to a time when the fact was valid, when the query runs, then the fact IS returned
    and its quality_status reads 'approved-superseded' rather than 'approved', so the label can never
    lie.
  - Given the as_of parameter, when it is supplied to the MCP tool, the service /v1/facts route and the
    Python layer, then all three honour it — asserted by a test exercising each layer.
  - Given a Supersedes edge persisted through the policy layer, when the write completes, then invalid_at
    is set on the superseded edge by the new invalidate stage, so the field the reader now honours is
    actually populated.
  - Given the owner retired Graphiti in M1, when this item is reviewed, then it is closed as won't-do
    with that decision cited, and no partial implementation is left behind.
  depends_on:
  - starts-everywhere-e3
  tags:
  - F068
