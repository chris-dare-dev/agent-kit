- id: memory-grows-and-tiers-t-index-memory-tiers
  kind: task
  title: Index the agent-memory and personal-memory tiers — the only tiers that learn are excluded three
    ways
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: 'The exclusion runs exactly the wrong way: artifact-policy.json lists agent-memory in catalog.prune_directory_names
    and .claude in catalog.exclude_roots, and _should_prune_dir fires on directory name during the os.walk
    prune step (artifact_catalog.py:180-183) before _is_included ever runs — so the `.claude/agent-memory/**`
    include glob can never win. The walk also uses followlinks=False and counts symlinked files into skipped_symlinks,
    which is precisely what the sanctioned consolidation design produces. The learning loop goal F needs
    — an agent writes a lesson, a later agent retrieves it semantically — is broken at the indexing step,
    and the failure is silent.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given `artifact_catalog.py --include-memory-roots <unified-agent-memory-root> <MEMORY_ROOT>`, when
    it runs, then those roots are catalogued with artifact_type='agent-memory' and authority_class='local',
    even though they lie outside the workspace.
  - Given a symlinked agent-memory root of the shape the consolidation design produces, when the catalog
    walks it, then one level of symlink is resolved for those roots only and the files are catalogued
    rather than counted into skipped_symlinks.
  - Given a lesson written through the gated write path, when search_artifacts is called with artifact_type='agent-memory',
    then the lesson is returned — the end-to-end learning loop, asserted in the integration job.
  - Given a catalog run where files land in skipped_symlinks or outside_artifact_scope, when the run summary
    is printed, then those counts are surfaced as a warning naming example paths, not as a silent stat.
  - Given artifact-policy.json at HEAD, when it is read, then the broad agent-memory prune no longer blocks
