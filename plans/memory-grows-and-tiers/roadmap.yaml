- id: memory-grows-and-tiers-e1
  kind: epic
  title: A gated write path with provenance and validity at the tool boundary
  status: planned
  summary: 'All 17 MCP tools are read-only, and the actual write mechanism is raw shell embedded in agent
    prompt bodies — 14 of the 20 files in data/agents/ carry the `mkdir -p ... && echo >> lessons.md`
    pattern, with no schema, no validation, no dedupe, no attribution and no failure signal. This epic
    makes writes never touch canonical files directly: a typed ADD|UPDATE|SUPERSEDE|NOOP record appends
    to the immutable outbox, a policy gate generalised from the Graphiti pilot''s validator applies it,
    and only then does canonical Markdown change. Alongside it land bi-temporal validity, explicit supersession,
    provenance on every result, a memory_type dimension, indexing for the only two tiers that actually
    learn, a secret/PII ingest gate with an erasure path, untrusted-input framing at the read boundary,
    and scheduled reconciliation from the outbox.'
  priority: must
  lane: later
  size: XL
  acceptance:
  - Given an agent calls the write surface, when the call completes, then a typed operation record exists
    in the outbox, the policy gate's verdict is recorded, and canonical Markdown changed only if the gate
    passed — asserted end to end by an integration test.
  - Given `grep -rn 'lessons.md' data/agents/ | grep '>>'`, when it is run at HEAD, then it returns zero
    matches and every agent writes through the tool surface.
  - Given any artifact-memory tool result, when it is inspected, then it carries canonical path, sha256,
    outbox unit id, catalog generation, embedding model and dimension, memory_type, scope and validity
    window.
  - Given derived state is deleted, when the reconciliation consumer runs with --repair, then the catalog
    rows, the vector collection and the projections are rebuilt from the outbox alone and diff clean against
