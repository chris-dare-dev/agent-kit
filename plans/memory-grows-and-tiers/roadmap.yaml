- id: memory-grows-and-tiers-t-gated-write-path
  kind: task
  title: 'Build the gated write path: propose to the outbox, apply a policy gate, then write canonical
    Markdown'
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: 'There is no programmatic way for an agent to create a memory: README.md:81 states all 17 tools
    are read-only, and the real mechanism is prompt-embedded bash appending to lessons.md, which is unportable
    (no bash on Windows), unvalidatable and unobservable — a failed append is invisible. Add a write surface,
    gated by MEMORY_WRITE=enabled with read-only remaining the default, whose calls append a typed ADD|UPDATE|SUPERSEDE|NOOP
    operation record to the immutable outbox; the event consumer applies memory_write_contract and only
    on pass writes canonical Markdown and reindexes. Present the surface as the Anthropic memory-tool
    verbs so the safety machinery is adoptable without a new API, ship readOnly/destructive/idempotent
    annotations on all tools old and new, and respect the tool budget from adr-012. No LLM decides the
    operation type — the caller declares it and the gate validates it.'
  priority: must
  lane: later
  size: L
  acceptance:
  - Given MEMORY_WRITE is unset, when the server starts, then the write tools are not registered and the
    server remains read-only — asserted by src/mcp-contract.test.ts against the default profile.
  - Given MEMORY_WRITE=enabled and a valid ADD call, when it completes, then an operation record exists
    in the outbox, the consumer's gate verdict is recorded, canonical Markdown contains the new entry,
    and the index returns it — proven end to end by the integration job.
  - Given a call whose declared operation contradicts the contract (for example SUPERSEDE naming a nonexistent
    target), when it is submitted, then no canonical file changes, the outbox holds the rejected proposal
    with its reason, and the tool returns the rule id.
  - Given the process is killed between the outbox append and the canonical write, when the consumer restarts,
    then it applies the pending record exactly once — asserted by a crash-injection test.
  - Given every registered tool, when tools/list is called, then each carries readOnly/destructive/idempotent
    annotations, and the tool-budget test from adr-012 still passes with the write tools registered.
  - Given data/agents/, when `grep -rn 'lessons.md' data/agents/ | grep -c '>>'` runs, then it returns
    0 and the agents call the write surface instead.
  depends_on:
