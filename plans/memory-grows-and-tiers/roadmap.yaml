- id: memory-grows-and-tiers-t-ingest-secret-pii-gate
  kind: task
  title: Gate ingest for secrets and PII, and give the immutable outbox an erasure path
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: Canonical Markdown is chunked, embedded and stored with zero content inspection — a grep for
    redact, scrub, pii or secret across artifact_ingestion.py and artifact_catalog.py returns nothing
    — while chunk bodies land in the catalog, the outbox and Qdrant payloads. The outbox is immutable
    by construction (atomic_write_bytes publishes via os.link no-replace at artifact_security.py:272)
    and there is deliberately no deletion authority anywhere, so one engineer pasting a token into a handoff
    note permanently contaminates the replay set with no answer to a deletion request. Add a pre-ingest
    gate over each chunk body before the unit payload is written, and an authorised expunge path that
    tombstones the affected unit while preserving the manifest hash chain.
