  kind: task
  title: Treat retrieved memory as untrusted input at the read boundary
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: Once the write path lands, anything one agent wrote is readable by another and memory becomes
    a persistent injection channel. Wrap recalled content in explicit non-instruction structural delimiters,
    escape boundary markers, role patterns and known injection signatures, validate each entry against
    its declared memory_type schema, and route non-conformers into the existing reversible quarantine.
