    content_sha256, outbox_unit_id, catalog_generation, embedding_model, embedding_dimensions, memory_type,
    scope, valid_from and invalid_at — asserted field by field in src/mcp-contract.test.ts.
  - Given a result's content_sha256, when the named canonical file is hashed, then the two match — asserted
    by an integration test that verifies the chain end to end rather than merely checking the field is
    present.
  - Given a result whose source file has changed since indexing, when it is returned, then the mismatch
    is reported as an explicit integrity flag on that entry rather than omitted.
  - Given the golden tools/list fixture, when it is regenerated, then the documented result shape includes
