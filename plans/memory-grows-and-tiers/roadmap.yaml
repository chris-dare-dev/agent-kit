  status: planned
  parent: memory-grows-and-tiers-e1
  summary: 'The substrate computes canonical path, content hash, outbox unit id, catalog generation and
    embedding identity on every path and then throws all of it away when the result crosses into the MCP
    tool response. Carrying it is the cheapest way to make the actual differentiator visible in every
    call: competitors return text and a score, this can return text, a score and a verifiable chain to
    a hash-checked file. It also turns the README''s ''the index is a hint, retrieve the real file'' rule
    from prose into something the calling agent can mechanically check.'
