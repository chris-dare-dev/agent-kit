    that module's mask(), and nothing is written to the catalog, the outbox or Qdrant.
  - Given a clean corpus, when ingest runs, then the gate adds no false positives — asserted by running
    it over the repo's own tracked Markdown and expecting zero refusals.
  - 'Given an approved human authorization record, when `artifact_outbox_expunge.py --apply` runs, then
    the affected outbox unit becomes a tombstone with an explicit expunged: true entry, the manifest hash
    chain still verifies, the matching Qdrant points are deleted, and a receipt is written in the content-addressed
