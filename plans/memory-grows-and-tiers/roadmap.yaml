- id: memory-grows-and-tiers-t-bitemporal-catalog
  kind: task
  title: Add bi-temporal validity and explicit supersession to the catalog and the outbox
  status: planned
  parent: memory-grows-and-tiers-e1
  summary: This is the primitive that tiering, demotion, supersession and safe forgetting all need, and
    it is the natural vocabulary for the never-rewrite-canon rule the substrate already enforces. Add
    created_at, valid_from, invalid_at and superseded_by to catalog rows and outbox units; default conflict
    resolution to recency-wins-with-explicit-invalidation rather than deletion or rewrite; and expose
    an as_of parameter that defaults to currently-valid rows. Do this on ordinary catalog rows with no
    graph dependency — it is the part of the Graphiti pilot worth keeping regardless of what the owner
    decided about the pilot itself. Cheap now, expensive once the write path starts generating contradictions.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given a catalog schema migration, when it completes, then artifact_revisions carries created_at, valid_from,
    invalid_at and superseded_by, and existing rows are backfilled with valid_from from their observed_at
    and a null invalid_at.
  - Given revision B supersedes revision A, when the write path applies it, then A.invalid_at is set and
    A.superseded_by names B — and A is not deleted or rewritten, asserted by a test comparing A's bytes
    before and after.
  - Given as_of set to a timestamp before B existed, when a search runs, then A is returned as valid and
    B is not; given as_of omitted, then only B is returned.
  - Given the outbox, when a unit is published, then it carries the same four fields, so bi-temporality
    survives a full rebuild from the log alone.
  - Given the catalog schema version, when it is read, then it was bumped in this change and the migration
    is reversible or explicitly documented as one-way in workspace-tooling/README-artifact-catalog.md.
  depends_on:
  - memory-grows-and-tiers-t-write-contract
  tags:
  - X019
  - bitemporal
  - catalog
  - supersession
  - memory
