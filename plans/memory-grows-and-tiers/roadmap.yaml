schema: roadmap/1
slug: memory-grows-and-tiers
project: agent-kit
title: M9 Memory That Grows and Tiers — a gated write path and hot/warm/cold tiers driven by measured
  access
status: draft
phase: sequenced
brief: 'Give memory the two things it structurally lacks: a way to be written, and a way to age. A gated
  write path (propose -> outbox -> policy gate -> canonical Markdown) with provenance and validity returned
  at the tool boundary, and an explicit hot/warm/cold tier model whose demotion is driven by recorded
  access signals rather than a single 14-day quarantine age gate.'
goal:
  hmw: How might we let memory grow safely and shed weight on evidence rather than on a fixed timer?
  objective: Agents can write memory through an auditable gate that never rewrites canon directly, and
    every artifact carries an access signal that drives an explicit, reversible tier transition.
  key_results:
  - From a bare clone on all three CI operating systems, `npm run eval:retrieval` completes and prints
    nDCG@10 and recall@10 for all four modes in artifact_retrieval_eval.MODES against a tracked gold set;
    today the eval has no corpus any adopter can supply (F045, F082).
  - '`grep -nE ''^(EMBEDDING_MODEL|RERANKER_MODEL|EMBEDDING_DIMENSIONS|QDRANT_SERVER_VERSION) *='' workspace-tooling/artifact_retrieval.py`
    returns zero matches, and a 768-dimension profile ingests, searches and passes the gold gate without
    a source edit (F042, X021).'
  - A pull request that changes the retrieval profile digest and drops nDCG@10 or recall@10 beyond the
    declared tolerance fails CI; a profile change that does not run the gold suite also fails CI (X017).
  - Every artifact-memory tool result carries canonical_path, content sha256, outbox unit id, catalog
    generation, embedding model + dimension, memory_type, scope and validity window; a contract test asserts
    each field is non-null on a live search (X018, X019, X032).
  - '`grep -rn ''lessons.md'' data/agents/ | grep -c ''>>''` returns 0 and no code path outside the outbox
    applier writes canonical Markdown; every write is reconstructible from the outbox alone (F039, X029,
    X034).'
  - The access ledger has recorded at least 30 days of real access events, with a reproducible `artifact_tier_plan.py
    plan` output, before any demotion predicate is enabled in a shipped configuration (F056, X048).
  - 'A lessons trim loses zero lines: regression test T6 in data/scripts/milestone-pipeline-consolidate-memory-test.sh
    asserts every trimmed line is present in lessons-cold.md, and the marker line no longer accumulates
    in the untrimmable tail (F058).'
  - stale_hit_rate@10 and orphan_rate are reported beside nDCG in every eval run and are gated with committed
    thresholds (X020).
  wont:
  - Multimodal ingestion — the modality half of F043 (PDF/image/notebook extractors, widening DOCUMENT_SUFFIXES
    at artifact_catalog.py:43-46) is explicitly out of scope; only the language half ships. 'Multimodal'
    stays an unmet claim and the README must stop asserting it.
  - The content-addressed unit store (F060) and cold-representation compaction (F061). Rehydration in
    this milestone resolves through the live file and the existing unit archive only; the CAS tier is
    deferred until the access ledger justifies it.
  - The two-collection hot/cold split with alias-fronted quantized cold storage, SIEVE-style demotion,
    minimum dwell time and lazy promotion (the deferred half of F057 and all of X048's build phase). Storage-class
    configurability and a gated eviction path ship; the second collection does not.
  - Quantization tuning (X046) and AST-aware/tree-sitter chunking (X047) — both belong with the deferred
    cold-plane engineering, not with the chunk-profile registry that ships here.
  - A shared or team memory tier (F038). The store stays uid-scoped and private; multi-tenant trust boundaries
    belong with the threat model in M3, not here.
  - Asynchronous consolidation as a supervised event-consumer job (X035). The write path and the reconciliation
    consumer ship; the importance/merge/decay/eviction consolidation pass does not.
  - Any per-skill retrieval or prompt-optimisation machinery. data/skills/ contains exactly one skill
    (handoff/); that work is n=1 until M6 builds a corpus.
  - 'Everything on the KILLED list, restated so it cannot creep back in: PAM portable memory artifacts,
    cryptographic erasure over the immutable outbox, W3C CG conformance packs, Qdrant miniCOIL sparse
    vectors, a three-backend reranker plugin registry, LLM-generated contextual chunk prefixes, an LLM-arbitrated
    write path, and promoting the Graphiti pilot into the canonical path.'
