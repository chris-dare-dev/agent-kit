- id: author-and-measure-t-strip-tools-roundtrip
  kind: task
  title: Replace line-based strip_skill_tools with a structured round-trip and gate the leak
  status: planned
  parent: author-and-measure-e1
  summary: 'strip_skill_tools (data/scripts/generate-adapter-packs.py:162-173) splits the text of the
    `allowed-tools:` line on commas. For the YAML block-sequence form the line''s value is empty, so it
    rewrites the key to `allowed-tools: ` and leaves every following `- Agent` item intact — shipping
    Claude-only tools into the OpenCode and neutral packs. Replace it with parse via the shared strict
    parser, drop STRIP_TOOLS members through tool_list(), re-emit in the target provider''s declared form.
    Extend the self-test at :649-655 to the block form and promote the check to a hard gate in linkcase_problems
    (:497-513) so the golden can never hash a leak again.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given the input frontmatter `allowed-tools:\n  - Read\n  - Agent\n  - AskUserQuestion`, when `transform_skill(text,
    'codex')` runs, then yaml.safe_load of the emitted frontmatter's allowed-tools returns exactly ["Read"].
  - 'Given the comma form `allowed-tools: Read, Agent, AskUserQuestion, Bash`, then the emitted value
    resolves to ["Read", "Bash"] and the existing self-test assertion at generate-adapter-packs.py:649-655
    still passes.'
  - Given any rendered codex or opencode pack file whose frontmatter names a member of STRIP_TOOLS ({Agent,
    AskUserQuestion}), when linkcase_problems runs, then it reports a problem naming the file and the
    tool — asserted by injecting a leak into a temp pack dict.
  - Given `python3 data/scripts/generate-adapter-packs.py --self-test`, then it exits 0 with explicit
    cases for the comma form, the block-sequence form and the space-separated form.
  - Given `python3 data/scripts/generate-adapter-packs.py --check`, then it exits 0 and tests/fixtures/adapter-packs.golden.json
    is regenerated and committed in the same change.
  depends_on:
  - author-and-measure-t-shared-frontmatter-lib
  tags:
  - F023
  - packs
  - degradation
  - gate
