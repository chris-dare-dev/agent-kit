- id: author-and-measure-t-outcome-schema-v2
  kind: task
  title: Bump the outcome record to schema v2 with code, identity and cost blocks
  status: planned
  parent: author-and-measure-e5
  summary: 'Bump SCHEMA_VERSION from 1 to 2 in data/scripts/pipeline-outcome-log.py and widen RECORD_FIELDS
    with three additive blocks named after the OTel gen_ai keys (field naming only — the trace-projection
    rewrite is out of scope): code (repo, branch, base_sha, head_sha, files_changed, insertions, deletions,
    test_command, test_exit_code, time_to_green_s, reverted_by), identity (run_id, agent_id, provider,
    pack_version, kit_commit, model, model_release_date, skill_revisions[]) and cost (input_tokens, output_tokens,
    cache_tokens, wall_ms). Every sha/id column must join STRING_FIELDS so a numeric-looking SHA cannot
    coerce to a float — the bug caught by sealed-eval-spike-1. Update data/references/pipeline-outcome-log-schema.md
    and make summary() switch on schema_version.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given SCHEMA_VERSION == 2, then RECORD_FIELDS contains every named column and `python3 -c "import
    importlib.util,sys;..."` asserts each new sha/id column is a member of STRING_FIELDS.
  - Given a --field value of `10365e3` for base_sha, then the emitted record's base_sha is the string
    "10365e3", not 10365000.0 — asserted by a regression test named for the original defect.
  - Given a log containing both v1 and v2 records, when `pipeline-outcome-log.py summary --json` runs,
    then it returns all records without error and reports the per-version counts.
  - Given the largest realistic v2 record, when the test serialises it, then its byte length is printed
    and the test fails if it reaches PIPE_BUF (4096) — forcing the atomic single-write guarantee to be
    re-decided rather than silently degrading.
