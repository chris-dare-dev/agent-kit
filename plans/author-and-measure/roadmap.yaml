schema: roadmap/1
slug: author-and-measure
project: agent-kit
title: M6 Author and Measure — a real skills corpus, and a ledger that says whether it pays
status: draft
phase: sequenced
brief: 'Today data/skills/ holds exactly one skill (handoff/), nine divergent frontmatter parsers disagree
  about what any of these files declare, and the outcome ledger''s only ROI signal is a self-graded (critical+high)/milestone
  proxy against three of one person''s frozen internal milestone ids. This milestone settles the input
  contract before M7 generalises the renderer: one published Draft 2020-12 schema per kind, one parser,
  a structured round-trip that stops YAML block-sequence `allowed-tools` leaking Agent/AskUserQuestion
  into Codex and OpenCode packs, a scaffold and templates, and the five commands promoted to real skills
  so the measurable population goes from 1 to 6. On that corpus it lands content identity (bodySha256
  + a 12-hex revision in catalog.json, before M7 signs anything), a bundled/team/personal tier model with
  an ordered content-pack root list, an 8-10 case offline golden task set as a required check, and outcome
  ledger v2 — git provenance, a real run_id joining the MCP token log to a diff and a test result, churn
  metrics and a stdlib statistics layer with bootstrap intervals. Stopping after this milestone still
  leaves a kit that can honestly say what a run cost and whether a skill edit made things worse.'
goal:
  hmw: How might we give a contributor one documented, validated way to author a skill — and give the
    maintainer a corpus large enough, and a ledger honest enough, to say with statistics rather than self-grading
    whether a skill change actually paid?
  objective: Make the skills corpus authorable, schema-validated and larger than n=1, and make the outcome
    ledger join a run to a diff, a test result and a cost, so a skill change can be gated in CI and evaluated
    with confidence intervals instead of a self-graded proxy.
  key_results:
  - data/facts/catalog.json reports counts.skills >= 6 (handoff plus the five migrated entrypoints) and
    every skill, agent and command passes `python3 data/scripts/frontmatter-lint.py --check` against a
    published Draft 2020-12 schema.
  - 'Exactly one frontmatter parser definition survives: `grep -rn "def split_frontmatter\|def parse_frontmatter\|def
    _frontmatter\|def normalize_frontmatter\|def frontmatter_value\|def _frontmatter_fields" data/scripts
    workspace-tooling` returns one site (data/scripts/lib/frontmatter.py), and the block-sequence reproduction
    (`allowed-tools:` with `- Agent` on the next line) no longer leaks into any rendered non-Claude pack.'
  - 8-10 golden task cases run offline with no model call as a required CI check in under 5 minutes, and
    a deliberately broken skill body fails the check naming the case and the assertion.
  - Every outcome record emitted by the milestone, spike and roadmap pipelines carries schema_version
    2 with a non-null run_id, base/head sha, insertions/deletions and test_exit_code; `pipeline-outcome-log.py
    join --run-id <id>` returns one row combining cost, diff and test result.
  - '`python3 data/scripts/sealed-eval.py metric` prints every metric with a 95% bootstrap interval and
    fires the overclaim guard when the interval crosses zero; `grep -rn "MIN_N\|BASELINE_IDS\|POST_IDS\|PIPELINE_METRICS\|_RUN_BUCKET_HEX"
    data/scripts` returns nothing.'
  - '`python3 data/scripts/catalog-generate.py --check` exits 2 on a one-character skill body edit that
    was not regenerated (bodySha256 is in the drift comparison), and `_schemaVersion` is 1.2.'
  wont:
  - No model-in-the-loop evaluation in the required CI check — the gate is assertion-only and offline;
    any model-in-the-loop set is nightly and advisory.
  - No Codex or OpenCode telemetry, edit beacons or instrumented delivery (F085, F088) — deliberately
    held to M7, where the renderer is already being rewritten, so the same generator is not edited twice.
  - No provider capability manifests, conformance suite, tier-0 .agents/ output or signed packs — all
    M7 (X011, F018, F021, X009, X051).
  - No skill-optimisation harness, SkillHone decision ledger, shadow A/B, interleaving or per-skill regression
    sets — on the KILLED list, and the corpus is still six, not sixty.
  - 'No Prometheus, OTel or metric-push path: the documented one is deleted, not implemented (F079), and
    the trace-projection rewrite is on the KILLED list.'
  - No retrieval, Qdrant tiering, memory write-path or gold-set work — M8.
  - 'No publishing to npm, PyPI, the MCP Registry or skills.sh: blocked on the M1 naming decision (the
    OpenAI AgentKit collision).'
  - No changes to the four PreToolUse security hooks' language or the AIDefence ruleset — M3.
