  priority: must
  lane: later
  size: XL
  acceptance:
  - Given a fixture milestone pipeline driven to `complete`, then the emitted outcomes.jsonl record has
    schema_version 2, a non-null run_id, base_sha, head_sha, files_changed, insertions, deletions, test_command
    and test_exit_code — asserted end to end, not by unit stubs.
  - Given that record and the MCP token log, when `python3 data/scripts/pipeline-outcome-log.py join --run-id
    <id>` runs, then it returns one row combining cost, diff and test result.
  - Given `python3 data/scripts/sealed-eval.py metric`, then every metric prints a point estimate, n and
    a 95% bootstrap interval, and the overclaim guard fires when the interval crosses zero rather than
    when n < 5.
  - Given `grep -rn "PIPELINE_METRICS\|_emit_metric\|_RUN_BUCKET_HEX\|BASELINE_IDS\|POST_IDS\|MIN_N" data/`,
    then no output.
  - Given `python3 data/scripts/churn-metrics.py --repo . --since 90d --json`, then it prints assisted-vs-unassisted
    splits for 14-day churn, revert rate and change-failure rate, each with a bootstrap 95% interval.
  depends_on:
