- id: author-and-measure-e5
  kind: epic
  title: Outcome ledger v2 and an honest ROI statistic
  status: planned
  summary: 'Goal F asks for return on code churned and nothing in the repo measures churn: grepping data/scripts
    and workspace-tooling for numstat|shortstat|files_changed|insertions|deletions|revert returns zero
    hits. run_id is hardcoded to None (pipeline-outcome-log.py:261), token_cost is null in every record,
    the milestone emit site does not exist while the schema doc claims ten sites across six families,
    a Prometheus push is documented in detail and implemented nowhere, and the only reported metric is
    a self-graded (critical+high)/milestone proxy against three frozen internal ids. This epic makes a
