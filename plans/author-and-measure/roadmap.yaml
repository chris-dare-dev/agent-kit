items:
- id: author-and-measure-e1
  kind: epic
  title: One frontmatter contract, one parser
  status: planned
  summary: YAML frontmatter is the core data model of the whole product and there are nine independent
    implementations of it — eight in Python plus gray-matter in TypeScript — that disagree materially
    about the same file. The MCP server drops a malformed skill silently (`catch { continue; }` at src/discovery/skills.ts:84),
    catalog-generate.py recovers it via a lenient line-regex fallback, and generate-adapter-packs.py returns
    `{}` and renders an over-permitted agent. Publish one schema per kind, collapse to one parser, and
    fix the line-based tool strip that leaks Claude-only tools into non-Claude packs.
  priority: should
  lane: later
  size: L
  acceptance:
  - Given the repo at HEAD, when `python3 data/scripts/frontmatter-lint.py --check` runs, then it exits
    0 and reports every file under data/skills, data/agents and data/commands as validated against data/schemas/frontmatter-{skill,agent,command}.schema.json.
  - 'Given `grep -rn "def split_frontmatter\|def parse_frontmatter\|def _frontmatter\|def normalize_frontmatter\|def
    frontmatter_value\|def _frontmatter_fields" data/scripts workspace-tooling src`, then exactly one
    definition site is returned: data/scripts/lib/frontmatter.py.'
  - Given a SKILL.md whose `allowed-tools` is the YAML block sequence `- Read` / `- Agent` / `- AskUserQuestion`,
    when `python3 data/scripts/generate-adapter-packs.py --check` runs, then the rendered codex and opencode
    frontmatter parses (yaml.safe_load) to exactly ["Read"] — the documented reproduction from F023 now
    passes.
  - Given tests/fixtures/frontmatter/ with at least 20 hostile cases, when `npm test` and the Python gate
    runner both run, then Python and gray-matter return the same (frontmatter, body) for every case and
    reject the same invalid ones.
  - Given the parser swap, when the four generator gates run, then data/facts/catalog.json, data/claude-md/AGENTS.md,
    data/claude-md/CONTEXT.md and tests/fixtures/adapter-packs.golden.json are byte-identical to the pre-refactor
    outputs (no silent output drift).
  depends_on:
  - gates-green-e1
  - gates-green-e3
  tags:
  - F022
  - F116
  - F023
  - frontmatter
  - schema
  - parser
  - packs
- id: author-and-measure-t-frontmatter-schemas
  kind: task
  title: Publish Draft 2020-12 frontmatter schemas for skill, agent and command
  status: planned
  parent: author-and-measure-e1
  summary: 'The frontmatter contract the catalog gate actually enforces exists only in catalog-generate.py''s
    module docstring (lines 15-22). Publish data/schemas/frontmatter-skill.schema.json, -agent and -command
    as Draft 2020-12 with additionalProperties:false, required name+description (commands carry no `name`
    — the filename is the /slash id), and model-class constrained to the six keys of data/model-policy.json
    `classes` (deep-reasoning-max, deep-reasoning-high, balanced-high, balanced-standard, fast-mechanical,
    specialist-default). allowed-tools/tools must accept all three shapes in the tree today: comma string,
    YAML block sequence, and the Agent-Skills-spec space-separated string. Declare a `metadata:` object
    as the escape hatch for non-spec keys.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given each of the three schema files, when `python3 -m json.tool` runs on it, then `$schema` equals
    `https://json-schema.org/draft/2020-12/schema` and `additionalProperties` is false at the root.
  - Given data/skills/handoff/SKILL.md frontmatter, when validated against frontmatter-skill.schema.json
    with jsonschema, then it passes; given the same frontmatter with an added top-level `trigger:` key,
    validation fails with an additionalProperties error naming `trigger` (the invented field third-party
    spec writeups circulate).
  - 'Given an agent with `model-class: nonsense`, when validated, then it fails and the reported enum
    equals `list(json.load(open(''data/model-policy.json''))[''classes''].keys())` — asserted by a test
    that derives the enum from model-policy.json rather than duplicating it.'
  - 'Given the three shapes `allowed-tools: Read, Bash`, `allowed-tools:\n  - Read\n  - Bash` and `allowed-tools:
    Read Bash`, when each is validated, then all three pass and a fourth shape (a nested map) fails.'
  - Given data/commands/*.md, when validated against frontmatter-command.schema.json, then all five pass
    with argument-hint as a string and codex-adapter constrained to the enum {skill, prompt-policy}.
  depends_on:
  - gates-green-e3
  tags:
  - F022
  - schema
  - frontmatter
  - model-policy
  - packs
