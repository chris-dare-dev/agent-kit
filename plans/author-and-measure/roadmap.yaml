- id: author-and-measure-t-roi-statistics
  kind: task
  title: Replace the self-graded proxy and the n<5 heuristic with a stdlib statistics layer
  status: planned
  parent: author-and-measure-e5
  summary: 'sealed-eval.py''s sole metric registry contains three variants of ch_per_milestone — mean(critical+high)
    per run — computed from the same agent family the pipeline dispatches, so a less aggressive adversary
    lowers the metric without improving anything, and the adversary body is itself the calibration target.
    Its baseline is frozen to three of one person''s internal milestone ids and its whole inference layer
    is `MIN_N = 5`. Add data/scripts/lib/stats.py (stdlib only: bootstrap percentile CIs, paired-difference
    tests on the same task ids, cluster-robust standard errors, minimum detectable effect), extend METRIC_NAME_TABLE
    with outcome-grounded metrics from the v2 schema, and replace both hardcoded id sets with a --baseline-window
    so each adopter''s baseline is their own first runs. OWNER GATE: retiring the custodian-sealed v0
    baseline (CUSTODIAN="Chris Dare", SEAL_VERSION=v0, BASELINE_IDS frozen at sealed-eval.py:39-45) is
    a custody decision, not an engineering one — it must be decided before this work starts.'
  priority: must
  lane: later
  size: L
  acceptance:
  - Given data/scripts/lib/stats.py, then it exposes bootstrap_ci(samples, statistic, alpha), paired_diff_test(before,
    after) keyed on task id, cluster_se(samples, cluster_key) and minimum_detectable_effect(n, sd, power),
    and `grep -nE "^(import|from) " data/scripts/lib/stats.py` shows no third-party import.
  - Given `python3 data/scripts/lib/stats.py --self-test`, then it reproduces a known bootstrap interval
    on a fixed seed to three decimal places and exits 0.
  - Given `python3 data/scripts/sealed-eval.py metric`, then each metric prints point estimate, n and
    a 95% bootstrap interval, and the overclaim guard fires when the interval crosses zero; `grep -n "MIN_N"
    data/scripts/sealed-eval.py` returns nothing.
  - 'Given METRIC_NAME_TABLE, then it carries task_success_rate (test_exit_code == 0 and human_verdict
    != reject), edit_churn_per_accepted_line, revert_rate_30d, tokens_per_accepted_line and time_to_green_p50
