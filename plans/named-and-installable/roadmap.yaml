    a pinned ONNX model — on machines where Docker is often not allowed. Ship a first-run path where the
    catalog plus SQLite FTS5 lexical retrieval and exact-hash lookup serve the full 17-tool surface with
    vectors disabled, degrading semantic recall rather than failing, and prove it in CI on a runner with
    no docker binary (X024). The pieces already exist and are not wired: LexicalIndex.search at workspace-tooling/artifact_retrieval.py:410-455
