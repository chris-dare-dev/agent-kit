- id: named-and-installable-t-pack-context-budget
  kind: task
  title: Emit a per-pack context budget report with a committed baseline and a CI gate
  status: planned
  parent: named-and-installable-e1
  summary: 17 read-only tools plus 20 agents plus 32 references is a permanent context tax paid on every
    request whether or not anything fires, and nothing measures it. data/scripts/mcp-token-stats.py today
