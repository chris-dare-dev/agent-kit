schema: roadmap/1
slug: named-and-installable
project: agent-kit
title: M4 Named and Installable — a published, provenance-attested release that runs without Docker
status: draft
phase: sequenced
brief: 'M4 turns a repo you must clone, hand-build and hand-configure into a product a team can install.
  It ships the first thing anyone will pin: a real npm package with bin/files/exports and a prepublishOnly
  that runs the gates, a PEP 621 Python distribution replacing 46 flat modules on a hand-set PYTHONPATH,
  and release-please plus OIDC trusted publishing so npm, PyPI and server.json move in lockstep with automatic
  provenance.

  Two things ride along because they are expensive to change after publication. The MCP 2026-07-28 revision
  lands with the package rather than as a breaking v2, so adopters absorb it once. And the server surface
  is collapsed from four hand-synced registries into one typed ToolDescriptor registry before external
  code depends on the shape.

  The milestone''s adoption payload is the no-Docker, no-Qdrant first run: the catalog plus the existing
  SQLite FTS5 lexical leg serves all 17 tools with vectors disabled, degrading recall rather than failing,
  proved by a CI job on a runner where docker is absent. That is the single strongest adoption lever in
  the whole audit and it appeared nowhere as a recommendation.

  Everything here is gated on M1''s naming decision and on M1-M3 having made the first pinned version
  worth pinning.'
goal:
  hmw: How might we turn a repo that must be cloned, hand-built and hand-configured into a provenance-attested
    package a team installs under one decided name in one command — and have it serve its full tool surface
    on a laptop where Docker is not allowed?
  objective: Publish the kit as an installable, provenance-attested release on npm and PyPI under its
    decided name, speaking the current MCP revision, and prove on CI that it serves all 17 tools on a
    machine with no Docker, no Qdrant and no ONNX runtime.
  key_results:
  - '`npm pack --dry-run` produces a tarball containing dist/index.js and data/ and zero .py and zero
    .plist paths with no gitignore-fallback warning; installing that tarball into an empty directory and
    launching its bin answers tools/list with 17 tools on ubuntu-latest, macos-latest and windows-latest.'
  - In a clean venv with PYTHONPATH unset, `pip install .` then `python -c "import agent_kit_substrate"`
    exits 0, `python -m unittest discover -s tests -p 'test_*.py'` collects the pre-move test count and
    exits 0, and every entry in [project.scripts] answers `--help` with exit 0; the uvx path is CI-run.
  - One release-please PR bumps package.json, pyproject.toml and server.json to identical versions; merging
    it tags, and the tag publishes to npm with `--provenance` and to PyPI with PEP 740 attestations under
    OIDC with no long-lived token in any workflow, plus an SBOM, an MCP Registry entry and a .mcpb release
    asset.
  - A required CI job on a runner with no `docker` on PATH and the substrate installed without extras
    drives all 17 MCP tools to non-error results, asserts artifact_memory_status reports mode `lexical`
    / vectors `disabled`, and fails if docker is invoked at any point.
  - The server answers `server/discover` per MCP 2026-07-28 with the v2 SDK pinned to an exact version,
    every list result carries resultType/ttlMs/cacheScope, and src/transport-lock.test.ts fails if any
    deprecated-feature import is reintroduced.
  - '`git grep -c "PERSONAL_" -- ":!plans/" ":!docs/"` over tracked files matches only the deprecation shim and its test, and
    `grep -rn "personal multi-repo workspace|personal fork|on my own projects" README.md package.json
    workspace-tooling/README.md` returns nothing.'
  wont:
  - Deciding or executing the rename itself. The name/licence/fork-provenance decision is starts-everywhere-e1
    and blocks every publishing task here; M4 consumes the decision, it does not make it.
  - Removing the four unused @aws-sdk dependencies. X003 bundles that with the package metadata, but the
    dependency half is the same defect as F099/F125/F135/F184 and closes in starts-everywhere-e5 (clone
    hygiene). M4 only asserts the tarball is clean.
  - Adding any tool to the 17-tool read-only surface — no write path, no remember/forget, no skills/list,
    no recall. The per-pack context budget report exists precisely to make the tool-count argument with
    numbers later (memory-that-earns-it).
  - Porting the IPC transport to Windows named pipes, or rendering systemd units and Scheduled Tasks.
    M4 only stops pinning an absolute venv interpreter path; the supervision contract is native-everywhere-e1/e2.
  - Introducing or changing the ruff/mypy rule set, the cross-OS matrix, action SHA-pinning or zizmor.
    Those are ci-proves-it-e1/e3; M4 moves the existing tool config into pyproject.toml without altering
    enforced rules, and adds only the publish-side OIDC leg.
  - Building the skills corpus, the golden task set, the outcome ledger v2 or any ROI statistic (author-and-measure).
    data/skills/ still contains exactly one skill; nothing here is premised on a population.
  - Implementing SEP-2640 skills/list, signed packs, provider capability manifests, or the .agents/ tier-0
    tree (providers-as-data).
  - Fixing where generate-adapter-packs.py --apply writes its output. The env-var rename touches the same
    lookup (data/scripts/generate-adapter-packs.py:523) and M4 removes only the ~/Work/workspace fallback;
    the --out DIR default is providers-as-data-e3.
