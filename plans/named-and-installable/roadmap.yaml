- id: named-and-installable-t-lexical-only-retrieval
  kind: task
  title: Add a lexical-only retrieval mode that runs with no Qdrant, no ONNX and no fastembed
  status: planned
  parent: named-and-installable-e4
  summary: 'ranking_contract() at workspace-tooling/artifact_retrieval.py:108-126 loops over fastembed,
    numpy, onnxruntime, qdrant-client and tokenizers and raises RetrievalError(''ranking dependency is
    unavailable: …'') on the first PackageNotFoundError — so the entire retrieval path is dead on a base
    install. The lexical leg is already standalone and needs no vectors: LexicalIndex.search (:410-455)
    issues a bm25(spans_fts, …) query with FTS_BM25_WEIGHTS (:39) against the spans_fts virtual table
    created at artifact_span_generation.py:690, and LexicalIndex.lookup (:458+) does exact point-id retrieval.
    Introduce an explicit lexical mode selected by the runtime configuration decided in starts-everywhere-e3,
    make ranking_contract() return a mode-tagged contract with null vector and reranker fields instead
    of raising, and route search through the lexical leg alone with an explicit degradation marker on
    results. Hybrid ranking must not change by a single byte. Closes X024''s retrieval leg.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given a venv with none of fastembed, onnxruntime or qdrant-client installed and lexical mode selected,
    when ranking_contract() is called, then it returns a contract whose mode is 'lexical', whose vector
    and reranker fields are null, whose digest differs from the hybrid digest, and it does not raise.
  - Given the same venv, when the retrieval CLI is invoked with a query, then it returns FTS5-ranked span
    rows carrying an explicit degradation marker and exits 0.
  - Given a hybrid-capable install, when ranking_contract() is called, then its digest is byte-identical
    to the value recorded at HEAD before this task — asserted by a committed golden digest, proving the
    degraded path did not perturb hybrid ranking.
  - Given a query in lexical mode, then each result carries a recall field valued 'degraded'; given the
    same query in hybrid mode, then that field is absent — asserted by one test per mode.
  - Given lexical mode and a missing spans database, then the failure is a typed UserError naming the
    file and the command that builds it, not an unhandled exception.
  depends_on:
  - starts-everywhere-e3
  - named-and-installable-t-pyproject-skeleton
  tags:
  - X024
  - memory
  - retrieval
  - fts5
  - degraded-mode
