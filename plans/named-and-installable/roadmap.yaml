    RetrievalError the moment fastembed, numpy, onnxruntime, qdrant-client or tokenizers is not importable,
    so nothing downstream can run without the heavy extras. Then add the devcontainer and the honest prerequisite
    table (X028, F180), with the digest-pinned loopback Qdrant compose as the opt-in upgrade rather than
    the only path.'
