- id: named-and-installable-t-npm-package-metadata
  kind: task
  title: Give package.json the metadata that makes `npm publish` produce an installable server
  status: planned
  parent: named-and-installable-e1
  summary: package.json (verified at HEAD, lines 1-30) declares no main, no exports, no bin, no files,
    no license, no repository, no bugs, no homepage, no publishConfig and no prepublishOnly. There is
    no .npmignore, so npm falls back to .gitignore whose line 2 is `dist/` — `npm pack --dry-run` therefore
    emits a gitignore-fallback warning and produces a 291-file tarball carrying all 24 workspace-tooling
    test_*.py files, all 46 Python modules and the 5 com.personal.* plists, and not one byte of dist/.
    engines.node is ">=20", a runtime that reached end of life in April 2026. src/index.ts:1 already carries
    `#!/usr/bin/env node`, so the bin entry needs no source change. This closes the metadata half of F161;
    the release-automation half is named-and-installable-t-release-please-manifest. The @aws-sdk removal
    bundled into X003 is the same defect as F099/F125/F135/F184 and closes in starts-everywhere-e5.
  priority: must
  lane: next
  size: M
  acceptance:
  - Given package.json at HEAD, when `node -e "const p=require('./package.json');for(const k of ['name','version','description','license','repository','bugs','homepage','bin','files','exports','engines','publishConfig','scripts'])if(!p[k])throw
    new Error('missing '+k)"` runs, then it exits 0.
  - Given a clean tree, when `npm pack --dry-run --json > pack.json` runs, then jq over pack.json shows
    dist/index.js and data/ present, zero paths matching \.py$, zero matching \.plist$, zero starting
    with workspace-tooling/, and npm's stderr contains no 'gitignore-fallback'.
  - Given `npm run prepublishOnly` at HEAD, then it runs `npm run build && npm test` followed by all four
    generator gates (data/scripts/catalog-generate.py --check, generate-adapter-packs.py --check, generate-root-contract.py
    --check, model-policy-apply.py --check) and exits 0.
  - Given a deliberately reverted generator output, when `npm run prepublishOnly` runs, then it exits
    non-zero naming the failing gate — proving a red gate cannot be published.
  - Given the tarball from `npm pack`, when it is installed into an empty temp directory and its bin is
    launched over stdio, then tools/list returns 17 tools on ubuntu-latest, macos-latest and windows-latest.
  - Given `node -e "console.log(require('./package.json').engines.node)"`, then it prints a range that
    excludes Node 20 and matches the Node versions in the ci-proves-it-e1 matrix.
  depends_on:
  - starts-everywhere-e1
  - gates-green-e1
  - ci-proves-it-e1
  tags:
  - F098
  - F129
  - F161
  - X003
  - packaging
  - npm
  - release
  - mcp-server
- id: named-and-installable-t-tool-descriptor-registry
  kind: task
  title: Collapse the four hand-synced tool registries into one typed ToolDescriptor registry
  status: planned
  parent: named-and-installable-e1
  summary: 'src/index.ts is 834 lines and holds the whole server: a ~230-line inline JSON literal of all
    17 tool schemas (:324-558), a 70-line switch dispatch (:713-782), and three string sets kept consistent
    by hand — ARTIFACT_MEMORY_TOOL_NAMES (:153-158), CACHE_EXEMPT_TOOLS (:562-573, 10 entries), CHUNKABLE_TOOLS
    (:578-582). They have already diverged: src/tools/token-stats.ts:8-20 declares its own copies and
    its cache-exempt set has 5 entries where index.ts has 10 (missing list_memory and all four artifact-memory
    tools), so get_token_stats reports cache-bypass against a stale policy. There is also no runtime input
    validation — eight `argObj as { … }` casts. Add src/tools/registry.ts exporting `interface ToolDescriptor
    { name; description; inputSchema: z.ZodType; cacheExempt: boolean; chunkable: boolean; profiles: ServerProfile[];
    handler(args): Promise<ToolResult> }` and a TOOLS array assembled from the per-tool modules in src/tools/;
    derive the ListTools response with zod-to-json-schema and derive all three sets from descriptor flags.
    Closes F114.'
  priority: must
  lane: next
  size: L
  acceptance:
  - Given src/tools/registry.ts, when `npm test` runs, then a new src/tools/registry.test.ts asserts TOOLS.length
    === 17 and that every descriptor has a name, description, inputSchema, cacheExempt, chunkable, profiles
    and handler.
  - Given the refactor, when `grep -n "CACHE_EXEMPT_TOOLS\|CHUNKABLE_TOOLS" src/tools/token-stats.ts`
    runs, then it returns no matches, and token-stats imports the derived sets from the registry.
  - Given a test asserting descriptor-derived sets, then it fails if any tool is flagged cacheExempt in
    the registry but absent from the set token-stats consumes — i.e. the divergence at src/tools/token-stats.ts:8-20
    cannot reappear.
  - Given the derived ListTools response, when the mcp-contract golden test runs, then tests/fixtures/tools-list.golden.json
    is byte-identical to its pre-refactor content, proving the change is behaviour-preserving.
  - 'Given a call to get_skill with `{"name": 123}`, when it is dispatched, then the server returns an
    isError result naming the failing zod path instead of throwing, and `grep -c "argObj as {" src/index.ts`
    returns 0.'
  - Given one new descriptor appended to TOOLS and no other file edited, when the server starts, then
    the tool appears in tools/list, dispatches, and is honoured by the cache-exempt and chunkable policies.
  depends_on:
  - gates-green-e2
  tags:
  - F114
  - mcp-server
  - refactor
  - zod
- id: named-and-installable-t-tool-result-contract
  kind: task
  title: Define one TypeScript ToolResult type and version the cache and token-log JSONL
  status: planned
  parent: named-and-installable-e1
  summary: 'The tool-handler return contract is not a type: skillTools.list_skills returns a plain string
    while memoryTools.list_memory returns `{content:[…]}` (src/tools/memory.ts:31-86), so src/index.ts:786-791
    sniffs the shape at runtime to normalise it. Define `type ToolResult = { content: {type:''text'';
    text:string}[]; isError?: boolean }` in src/types.ts, make every handler in src/tools/*.ts return
    it, and delete the sniff. Separately add `schemaVersion: 1` to CachedResponse (src/cache/response-cache.ts:26)
    and to TokenLogEntry (src/logging/token-logger.ts), and have the snapshot restore loop at src/index.ts:234-243
    drop rows whose schemaVersion is absent or unknown instead of trusting them. This is the TypeScript
    half of F121; the Python half is named-and-installable-t-python-error-contract.'
  priority: should
  lane: next
  size: M
  acceptance:
  - Given `npm run build` under tsc strict, then every exported handler in src/tools/*.ts is declared
    `Promise<ToolResult>` and the build exits 0.
  - Given src/index.ts, then the runtime shape-sniff branch at :786-791 is deleted and `grep -n "'content'
    in raw\|\"content\" in raw" src/index.ts` returns no matches.
  - Given a cache snapshot file seeded with one row lacking schemaVersion and one row with schemaVersion
    99, when the server restarts, then both rows are dropped, exactly one stderr line reports the dropped
    count, and surviving rows are restored — asserted by a new case in src/cache/response-cache.test.ts.
  - Given `npm test`, then the mcp-contract golden output is unchanged by this refactor.
  depends_on:
  - named-and-installable-t-tool-descriptor-registry
  tags:
  - F121
  - mcp-server
  - error-contract
  - typescript
- id: named-and-installable-t-python-error-contract
  kind: task
  title: Give the Python substrate one exception base and force broad catches to justify themselves
  status: planned
  parent: named-and-installable-e1
  summary: There are 33 module-local exception classes across the Python tree with no shared base, inconsistently
    derived from ValueError, RuntimeError or bare Exception — IngestionError(ValueError) at artifact_ingestion.py:96-102,
    RetrievalError, ServiceError at artifact_memory_service.py:90-96, EvalError at artifact_retrieval_eval.py:149,
    QuarantineError, WatermarkError and others. MigrationError is defined twice with different bases (artifact_qdrant_migrate.py:42
    as RuntimeError, data/scripts/milestone-pipeline-migrate.py:84 as Exception). A caller cannot write
    `except AgentKitError`. There are also 76 broad `except Exception` or bare `except:` handlers, concentrated
    in artifact_memory_service.py (14) and artifact_event_consumer.py (10). Add errors.py to the package
    with AgentKitError, UserError (bad input/config, exit 2) and InvariantError (fail-closed integrity
    violation, exit 3), reparent the module exceptions, de-duplicate MigrationError, and enable ruff BLE001
    with an explicit shrinking allowlist. Python half of F121.
  priority: should
  lane: next
  size: M
  acceptance:
  - Given the installed package, when `python -c "from agent_kit_substrate.errors import AgentKitError,
    UserError, InvariantError"` runs, then it exits 0.
  - Given tests/test_error_contract.py, when the suite runs, then an ast walk asserts every class defined
    in an artifact_*.py module whose name ends in 'Error' is a subclass of AgentKitError, and that the
    name MigrationError is defined exactly once across the whole tree.
  - Given `ruff check --select BLE001`, then it exits 0 against a committed allowlist file, and a test
    asserts the allowlist entry count is less than or equal to the count recorded at the start of this
    task (recorded in the commit message).
  - Given a CLI invoked with an unresolvable --collection, then it exits 2; given a fail-closed integrity
    violation (a tampered manifest digest), then it exits 3 — both asserted by subprocess cases.
  depends_on:
  - named-and-installable-t-package-move
  tags:
  - F121
  - substrate
  - error-contract
  - ruff
- id: named-and-installable-spike-1
  kind: spike
  title: Pin the MCP v2 SDK surface and decide the dual-revision support window
  status: planned
  parent: named-and-installable-e1
  summary: The server imports the v1 SDK layout — Server from @modelcontextprotocol/sdk/server/index.js,
    StdioServerTransport, CallToolRequestSchema and ListToolsRequestSchema (src/index.ts:11-16) — against
    a `^1.12.1` range that resolves to 1.29.0 in this clone. The MCP 2026-07-28 revision removes the initialize
    handshake and protocol-level sessions, adds a mandatory server/discover, and moves to a stateless
    _meta envelope. Before committing to the migration, time-box an investigation that establishes the
    exact v2 package names and versions, whether one process can answer both revisions or a compatibility
    shim is required, how long clients on the older revision are supported, and every call site that changes.
    Being stdio-only means none of the expensive session/transport work applies, but a server that does
    not answer server/discover reads as broken to a probing host rather than merely old.
  priority: must
  lane: next
  size: S
  acceptance:
  - 'Given a 2-day time box, when the spike closes, then docs/adr/adr-011-mcp-2026-07-28-migration.md
    exists and records: the exact v2 package names with pinned versions, whether v1 and v2 request handlers
    can coexist in one process, the decided support window for clients on the older revision, and a file-by-file
    change list naming src/index.ts, src/mcp-contract.test.ts and src/transport-lock.test.ts.'
  - Given the spike branch, when a throwaway prototype is driven by a client issuing server/discover,
    then the response is captured verbatim in the ADR as evidence.
  - Given the ADR, then it records an explicit go/no-go for landing the migration in this milestone and,
    if no-go, names the release it moves to and why.
  depends_on:
  - ci-proves-it-e3
  tags:
  - X012
  - mcp-server
  - protocol
  - adr
