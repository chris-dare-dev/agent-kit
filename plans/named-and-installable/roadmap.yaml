- id: named-and-installable-e1
  kind: epic
  title: A real npm package, a maintainable server surface, and a team-product voice
  status: planned
  summary: Make the Node half publishable and maintainable in one pass, because everything in it is expensive
    to change once someone pins it. package.json gains bin, files, exports, license, repository, engines
    and a prepublishOnly that runs build, test and the four generator gates (F098, F129, F161, X003).
    The four hand-synced tool registries in src/index.ts collapse into one typed ToolDescriptor registry
    with zod-validated dispatch (F114) and one shared error contract replaces the ad-hoc result shapes
    and the 33 unparented Python exception classes (F121). The server migrates to the MCP 2026-07-28 revision
    and SDK v2 with server/discover and the stateless _meta envelope (X012), under a per-pack context
    budget enforced in CI (X042). README, package.json and the PERSONAL_* env namespace are rewritten
    from personal-workspace voice to team-product voice with a runnable quickstart (F106, F104).
  priority: must
  lane: next
  size: XL
  acceptance:
  - Given a clean clone at the release tag, when `npm pack --dry-run --json` runs, then the file list
    contains dist/index.js and data/, contains no path matching \.py$ or \.plist$, and npm emits no gitignore-fallback
    warning.
  - Given the packed tarball installed into an empty temp directory, when its bin is launched over stdio
    with SERVER_PROFILE=personal on ubuntu-latest, macos-latest and windows-latest, then tools/list returns
    17 tools on all three.
  - Given `npm test`, then src/tools/registry.test.ts asserts all 17 tools come from one TOOLS array,
    `grep -n "CACHE_EXEMPT_TOOLS\|CHUNKABLE_TOOLS" src/tools/token-stats.ts` returns no matches, and `grep
    -c "argObj as {" src/index.ts` returns 0.
  - Given a client sending `server/discover`, then the server responds per MCP 2026-07-28 and src/transport-lock.test.ts
    fails when a deprecated-feature import is reintroduced.
  - Given `git grep -c "PERSONAL_" -- ":!plans/" ":!docs/"` over tracked files, then the only matches are the compatibility shim
    module and its test; and `grep -rn "personal multi-repo workspace\|personal fork\|on my own projects\|Personal
    provider-neutral" README.md package.json workspace-tooling/README.md` returns nothing.
  depends_on:
  - starts-everywhere-e1
  - gates-green-e1
  - ci-proves-it-e1
  tags:
  - F098
  - F129
  - F161
  - F114
  - F121
