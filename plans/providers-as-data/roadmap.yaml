- id: providers-as-data-t-anchor-resolver
  kind: task
  title: Delete PLATFORM_ROOT and resolve every output path through a manifest anchor
  status: planned
  parent: providers-as-data-e1
  summary: data/scripts/generate-adapter-packs.py:59 sets `PLATFORM_ROOT = ROOT.parents[1]`, which in
    this standalone clone resolves two directories above the checkout; `_anchor` (:530-535) maps every
    PLATFORM/-prefixed pack path there and `apply()` (:538-564) writes unconditionally and unlinks stale
    `.toml` files in that foreign directory. Delete the constant, resolve every anchor through one `resolve_anchor(manifest,
    args)` reading the manifest's `layout.anchor` plus path template, default `--apply` to `<repo>/dist/packs/<provider>/`,
    require an explicit `--install-to PATH` to write anywhere else, refuse paths above the repo root without
    `--allow-outside-repo`, gate the unlink loop behind `--prune`, and print the resolved destination
    before writing.
  priority: must
  lane: later
  size: M
  acceptance:
  - Given the documented reproduction (clone at `<parent>/Source Code/agent-kit`, run `python3 data/scripts/generate-adapter-packs.py
    --apply`), then every written path is under `<repo>/dist/packs/` and `<parent>/Source Code/.opencode`
    does not exist; tests/provider_conformance/test_anchor.py asserts no written path resolves outside
    ROOT.
  - Given `--install-to <dir-above-repo>` without `--allow-outside-repo`, then the process exits 2 printing
    `refusing to write outside the repo root (pass --allow-outside-repo)` and creates no files.
  - Given a stale `.codex/agents/orphan.toml` in the target and `--apply` without `--prune`, then orphan.toml
    still exists afterwards; with `--prune` it is deleted and its full path was printed to stdout before
    deletion.
  - Given the change is complete, when `grep -nE 'parents\[1\]|Work/workspace' data/scripts/generate-adapter-packs.py`
    runs, then it returns no hits.
  - Given `--apply` on any platform, then the first stdout line names the resolved destination directory
    for each provider.
  depends_on:
  - providers-as-data-t-provider-manifest-schema
  tags:
  - F026
  - F177
