- id: providers-as-data-t-model-policy-override-chain
  kind: task
  title: Un-bind the shipped model policy from Bedrock and add an override chain
  status: planned
  parent: providers-as-data-e1
  summary: 'Every one of the six classes in data/model-policy.json resolves providers.opencode.model to
    an AWS Bedrock inference profile (:32, :60, :88, :112, :134, :162), and that string is the only model
    literal any pack stamps — so any external adopter running the OpenCode pack gets 20 agent files pinned
    to ARNs in an account they do not have, with no override path (generate-adapter-packs.load_policy()
    at :237-238 reads one file). Change the shipped values to a provider-neutral default, move the Bedrock
    IDs into a documented example overlay, and give load_policy() the chain: data/model-policy.json, then
    $AGENT_KIT_MODEL_POLICY_OVERRIDE, then <workspace>/.claude/model-policy.local.json (the file model-policy-apply.py:76-102
    already defines, so one override serves both paths). Let a manifest declare perAgentModel:false so
    Codex is not forced to carry dead model strings.'
  priority: must
  lane: later
  size: M
  acceptance:
  - Given the change, when `grep -rn 'amazon-bedrock' data/model-policy.json` runs, then it returns nothing;
    the Bedrock inference-profile IDs live in data/references/model-policy-overlay.example.json with a
    comment recording they were verified against `aws bedrock list-inference-profiles` on 2026-07-11.
  - Given `AGENT_KIT_MODEL_POLICY_OVERRIDE=data/references/model-policy-overlay.example.json`, when the
    packs are rendered, then every dist/packs/opencode/**/agents/*.md carries the original Bedrock model
