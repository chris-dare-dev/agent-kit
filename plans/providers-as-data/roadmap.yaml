  title: Versioned provider capability manifests replacing hardcoded provider logic
  status: planned
  summary: 'Replace every hardcoded provider fact in data/scripts/ with `data/providers/<id>/provider.json`
    validated by a Draft 2020-12 schema, declaring id, status, capabilities, per-kind layout, ref-rewrite
    mode, root-contract shape, owned namespaces and an anchor enum (repo|workspace|home) resolved by one
    function. The generator, the model-policy checker and the catalog all derive their provider set from
    the manifests instead of frozen constants, the model policy gains an override chain so shipped defaults
    stop hard-binding every OpenCode agent to Bedrock, and `--apply` stops writing outside the clone.
    Outcome: a provider is a reviewable data diff, not a five-module Python edit.'
  priority: must
  lane: later
  size: XL
  acceptance:
  - Given a clean clone, when `python3 data/scripts/provider-manifest-check.py --check` runs, then it
    validates every data/providers/*/provider.json against data/schemas/provider-manifest.schema.json
    and exits 0.
  - Given the refactor is complete, when `grep -rnE 'provider == "|REQUIRED_PROVIDERS|PLATFORM_ROOT|WRONGCASE_RE|MCP_TIER_TOOL'
