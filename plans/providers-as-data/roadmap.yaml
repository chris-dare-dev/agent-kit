schema: roadmap/1
slug: providers-as-data
project: agent-kit
title: M7 Providers as Data — adding a provider is a data contribution, proven by a conformance suite
status: draft
phase: sequenced
brief: 'Goal C is the headline differentiator and today it is a claim, not a mechanism: a fourth provider
  means editing five Python modules, `provider == "codex"` string tests are scattered through shared helpers,
  `PLATFORM_ROOT = ROOT.parents[1]` scatters 26 files two directories above the clone, the golden manifest
  validates the renderer against itself, Codex silently drops 4 of 5 entrypoints while CONTEXT.md promises
  nothing is silently dropped, and every OpenCode agent is hard-bound to Bedrock inference profiles in
  an AWS account no adopter has.

  This milestone turns provider support into versioned data: `data/providers/<id>/provider.json` under
  a Draft 2020-12 schema declares capabilities, per-kind layout, ref-rewrite mode, root-contract shape
  and the output anchor; the generator, the model-policy checker and the catalog all derive their provider
  set from those manifests.

  A hostile-case conformance corpus then proves each pack renders losslessly or reports the loss fail-closed,
  with an independent expectation tree so a reviewer sees a line diff instead of a hash diff.

  Finally every pack becomes a versioned, signed artifact with the provider-neutral `.agents/skills/`
  tree as tier 0, the Claude target ships as a versioned plugin, and each rendered skill carries its catalog
  id so file-delivered Codex and OpenCode packs stop being invisible to the ledger.

  This is safe only after M3 (CI to run a suite in), M4 (a format to ship into) and M6 (one frontmatter
  contract to conform to); F026''s anchor work lands here with the manifest that defines anchors, because
  doing it earlier means writing the same generator twice.'
goal:
  hmw: How might we make adding a provider a reviewed data contribution — with the capability loss it
    causes stated out loud and proven by a suite — instead of a five-module Python edit that only its
    author can review?
  objective: Provider support is declared in versioned capability manifests, every pack is proven correct
    against an independent oracle or reports its loss fail-closed, and every pack ships as a signed, versioned
    artifact that reports its own usage.
  key_results:
  - A fourth provider is added by a commit that changes zero lines under data/scripts/*.py — proven by
    the worked gemini-cli example's own `git show --stat`, which touches only data/providers/, data/provider-adapters/,
    tests/fixtures/ and data/facts/catalog.json.
  - '`python3 -m unittest discover -s tests/provider_conformance -p ''test_*.py''` is green and covers
    every declared manifest x every catalog kind; the two known renderer defects (block-sequence allowed-tools
    tool leak, Codex entrypoint drop) each have a test that fails against HEAD''s renderer and passes
    after the fix.'
  - '`python3 data/scripts/generate-adapter-packs.py --apply` writes zero bytes outside the repository
    root, and `grep -rn ''parents\[1\]\|Work/workspace\|provider == "'' data/scripts/*.py` returns no
    hits.'
  - Zero rendered pack bytes contain `amazon-bedrock/`, `PENDING LIVE-VERIFICATION`, or (in a non-Claude
    pack) a `.claude/` path literal — each asserted by a conformance test, not by inspection.
  - Every built pack carries pack.json with semver and per-file sha256 plus a detached signature that
    `pack-verify.py` rejects on a single flipped byte; every rendered skill and agent carries its catalog
    id and revision.
  - 'All three providers emit an edit event that joins to the M6 outcome ledger on run_id: a fixture run
    produces non-zero per-catalog-id counts for codex and opencode, not just claude.'
  wont:
  - Extracting the compiler as a standalone interop package (X053) — explicitly last, not first; the profile
    interpreter, lossiness reporter and conformance suite stay in-repo this milestone.
  - Implementing the MCP Skills Extension SEP-2640 (X013) or migrating to MCP SDK v2 / the 2026-07-28
    protocol revision (X012) — that is server-surface work, not pack work, and the tool-count degradation
    research flagged in the corrections has not been done.
  - Publishing packs to the MCP Registry or skills.sh (X014) — belongs to M4 and is blocked behind the
    owner's name decision (X001, OpenAI AgentKit collision).
  - Converting the 5 commands into skills (X010) — the shape of the corpus is M6's decision; M7 renders
    whatever the catalog holds.
  - 'Shipping Gemini CLI as a supported provider — it lands as a documentation-grade worked example with
    conformance fixtures and status: experimental, nothing more.'
  - Any per-skill A/B, interleaving or optimisation machinery — the corpus is still small (see the n=1
    research correction); M7 measures delivery, not skill quality.
  - Emulating provider-side runtime features the provider lacks (background Workflow, subagent dispatch,
    runtime tool sandboxing) — the manifest records their absence honestly; it does not paper over it.
