- id: providers-as-data-t-catalog-id-stamping
  kind: task
  title: Stamp every rendered skill and agent with its catalog id and revision
  status: planned
  parent: providers-as-data-e3
  summary: 'The kit''s primary delivery mechanism is file rendering, not MCP — the generator''s own header
    (generate-adapter-packs.py:13-26) states that for Claude the .claude tree IS data/ via symlinks so
    no get_skill call is made, and that OpenCode declares no mcp block at all — so TokenLogger (src/logging/token-logger.ts:265-345)
    observes only the subset of sessions that route through the server. Step one of closing that gap:
    have the renderer stamp each rendered skill and agent with `agent-kit-catalog-id` and `agent-kit-revision`
    (the 12-hex content revision landed by M6''s content-identity work) so a read of a rendered file can
    be attributed to a specific skill revision.'
  priority: should
  lane: later
  size: S
  acceptance:
  - Given a build, when a test walks every rendered skill and agent across all declared providers, then
    each carries `agent-kit-catalog-id` and `agent-kit-revision` in its frontmatter (or, for TOML agents,
    as top-level keys), and the test names any file missing either.
  - Given `python3 data/scripts/pack-identify.py dist/packs/codex/.codex/agents/<name>.toml`, then it
    prints the catalog id and revision and exits 0; run over every file in every built pack it exits 0
    for all of them.
  - Given the revision stamp, when a source skill body changes and the pack is rebuilt, then the stamped
    revision changes for that entry and for no other — asserted by comparing two builds.
  - Given the expectation tree, when the stamping lands, then the tests/fixtures/expected/ diff for each
    affected file shows only the two added keys and no other line.
  depends_on:
  - author-and-measure-e3
  - providers-as-data-t-manifest-driven-renderer
  tags:
  - F088
  - instrumentation
  - catalog-identity
  - goal-F
  - goal-C
  - evals
- id: providers-as-data-t-provider-event-hooks
  kind: task
  title: One provider-neutral edit-event contract with three thin adapters
  status: planned
  parent: providers-as-data-e3
  summary: The only edit-time instrumentation point is data/scripts/template-settings.json:46-59, a Claude-Code-specific
    PostToolUse Edit|Write chain running two scripts that record nothing measurable; template-codex-config.toml
    has no hooks section at all and template-opencode-plugin.mjs wires only the secret guard. Define one
    provider-neutral contract — data/hooks/record-edit-event (ported to the non-bash implementation M3
    lands) reading the same {tool_input:{file_path, content|new_string}} payload and appending {ts, run_id,
    provider, tool, file_path, bytes_delta, catalog_id?} to $AGENT_KIT_EVENT_LOG — and register it in
    all three provider config templates, mirroring the secret-guard pattern. Then document, generated
    from the manifests, which providers produce usage signal and which do not, so no one draws a conclusion
    from a partial denominator.
  priority: should
  lane: later
  size: M
  acceptance:
  - Given the measured payload shapes from spike-1, when a unit test feeds each provider's native payload
    to data/hooks/record-edit-event, then each produces exactly one well-formed JSONL line with all required
    keys and a parseable ts; a malformed payload produces no line and exit code 0 (fail-open, parity with
    the secret-guard core).
  - Given the three templates, when a test inspects them, then data/scripts/template-settings.json registers
    record-edit-event in its PostToolUse Edit|Write array, data/scripts/template-codex-hooks.json registers
    it, and data/scripts/template-opencode-plugin.mjs registers a tool.execute.after handler for it; the
    test fails naming any template that does not.
  - Given a fixture event log covering all three providers, when the usage consumer runs (`python3 data/scripts/mcp-token-stats.py
    --by-provider` or its successor), then it reports non-zero per-catalog-id counts for codex and opencode
    as well as claude, joined to the M6 outcome ledger on run_id — asserted against expected counts.
  - Given README.md's instrumentation section, then it is generated from the manifests' capabilities.hookEvents
    and a stale hand-edit makes `python3 data/scripts/generate-root-contract.py --check` exit non-zero.
  - Given a provider whose manifest declares no supported hook events, then the generated README marks
    it as producing no usage signal and the consumer reports its denominator as unmeasured rather than
    zero.
