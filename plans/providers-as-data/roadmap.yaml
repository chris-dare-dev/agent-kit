- id: providers-as-data-e2
  kind: epic
  title: Provider conformance suite with a fail-closed lossiness report
  status: planned
  summary: 'The only automated check on pack output is a sha256 drift comparison against tests/fixtures/adapter-packs.golden.json
    — a file produced by `--update-golden` from the very renderer it polices, so it detects change but
    proves nothing about correctness and shows a reviewer a hash, never a line. Build a hostile-case corpus
    and a suite that asserts rendered output against an independent expectation, make every kind either
    render for every provider or produce a declared, reported loss (with its own non-zero exit code),
    wire or honestly downgrade the OpenCode config plant and the Codex/OpenCode secret-guard legs, and
    pin upstream spec revisions with a scheduled drift watchdog. Outcome: a fourth-provider PR arrives
    with an oracle a reviewer who is not the author can trust.'
  priority: should
  lane: later
  size: XL
  acceptance:
  - Given the suite, when `python3 -m unittest discover -s tests/provider_conformance -p 'test_*.py'`
