- id: providers-as-data-t-claude-plugin
  kind: task
  title: Ship the Claude target as a versioned plugin with a marketplace entry
  status: planned
  parent: providers-as-data-e3
  summary: The plugin is the only Claude distribution unit that carries skills, subagents, hooks and MCP
    config together, and the 20 subagents are where this repo's value concentrates; without an explicit
    version field Claude Code falls back to the commit SHA and treats every commit as a release. Add .claude-plugin/plugin.json
    with an explicit semver version, hooks/hooks.json, .mcp.json referencing ${CLAUDE_PLUGIN_ROOT}, the
    skills/ and agents/ trees, and a marketplace.json entry. Audit the 20 agents against the restriction
    that plugin-shipped agents may not declare hooks, mcpServers or permissionMode, and enforce it with
    a gate.
  priority: should
  lane: later
  size: M
  acceptance:
  - Given the repo, then .claude-plugin/plugin.json exists with an explicit semver `version` (not a SHA),
    hooks/hooks.json, an .mcp.json whose server command path is expressed via ${CLAUDE_PLUGIN_ROOT}, plus
    skills/ and agents/; a marketplace.json entry is committed.
  - Given `python3 data/scripts/claude-plugin-check.py --check`, then it exits 0; given a test that injects
    `permissionMode:` into one of data/agents/*.md, it exits 1 naming the agent and the forbidden key.
    The same check asserts no plugin-shipped agent declares hooks or mcpServers.
  - Given package.json version 0.2.0, when the check runs against a plugin.json declaring a different
    version, then it exits 1 printing both values; a release that bumps package.json must bump plugin.json
    in the same commit.
  - Given the plugin manifest, when the check runs, then it asserts every catalog skill and all 20 catalog
    agents are reachable from the plugin's declared skills/ and agents/ paths, failing with the count
    and the missing names if not.
  - Given `grep -rn '\${CLAUDE_PLUGIN_ROOT}' .claude-plugin/`, then every path in .mcp.json that points
    into the repo is expressed relative to that variable — no absolute path literal survives, asserted
    by the check.
