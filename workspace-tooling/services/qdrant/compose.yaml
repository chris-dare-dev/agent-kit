name: personal-artifact-memory

services:
  qdrant:
    image: qdrant/qdrant:v1.16.3-unprivileged@sha256:9dfabc51ededc48158899a288a19a04de1ab54a11d8c512e1c40eebbd5e2bc92
    container_name: personal-artifact-memory-qdrant
    entrypoint:
      - /usr/bin/bash
      - -c
      - "umask 077; exec /qdrant/qdrant"
    ports:
      - "127.0.0.1:6343:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      QDRANT__SERVICE__READ_ONLY_API_KEY: "${QDRANT_READ_ONLY_API_KEY:?QDRANT_READ_ONLY_API_KEY is required}"
      QDRANT__SERVICE__ENABLE_CORS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: "/qdrant/storage/snapshots"
    volumes:
      - ./storage:/qdrant/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - artifact-memory
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  qdrant-restore:
    profiles:
      - restore-test
    image: qdrant/qdrant:v1.16.3-unprivileged@sha256:9dfabc51ededc48158899a288a19a04de1ab54a11d8c512e1c40eebbd5e2bc92
    container_name: personal-artifact-memory-qdrant-restore
    entrypoint:
      - /usr/bin/bash
      - -c
      - "umask 077; exec /qdrant/qdrant"
    ports:
      - "127.0.0.1:6345:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_RESTORE_API_KEY:?QDRANT_RESTORE_API_KEY is required}"
      QDRANT__SERVICE__READ_ONLY_API_KEY: "${QDRANT_RESTORE_READ_ONLY_API_KEY:?QDRANT_RESTORE_READ_ONLY_API_KEY is required}"
      QDRANT__SERVICE__ENABLE_CORS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: "/qdrant/storage/snapshots"
    volumes:
      - ./restore-storage:/qdrant/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - artifact-memory
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  artifact-memory: {}
