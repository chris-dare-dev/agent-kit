# template-codex-config.toml -- Codex launch-config template.
# Planted as <workspace>/.codex/config.toml (create-if-absent, NEVER overwrites);
# ${AGENT_KIT_ROOT} is substituted with the resolved clone path at install time.
#
# INDIRECT-BY-DEFAULT: no credential literal ever belongs in this file. This kit's
# own server reads no secret of any kind; if you add a server that needs one, keep
# it in a file outside the repo and source it at launch. The PreToolUse guard
# (block-plaintext-secret-write.sh) and secret-scan.py enforce this file stays clean.

[shell_environment_policy]
inherit = "core"

[mcp_servers.agent-kit]
command = "node"
args = ["${AGENT_KIT_ROOT}/dist/index.js"]

[mcp_servers.agent-kit.env]
SERVER_PROFILE = "personal"
